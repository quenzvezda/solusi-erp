server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml,image/svg+xml,font/woff2
    min-response-size: 1024
  servlet:
    session:
      timeout: 30m # Standard for ERP session timeout
      cookie:
        secure: true
        http-only: true

spring:
  config:
    import: "optional:file:${ENV_FILE:.env}[.properties]"
  web:
    resources:
      chain:
        enabled: true
        strategy:
          content:
            enabled: true
            paths: /**
    error:
      whitelabel:
        enabled: false # Mematikan halaman putih bawaan Spring Boot
      include-message: always # Pastikan pesan error dikirim ke template
      include-binding-errors: always
      path: /error
  devtools:
    restart:
      exclude: static/**,public/**,templates/**,**/templates/**
      enabled: false
    livereload:
      enabled: false
  application:
    name: solusi-program-erp

  # Database Configuration
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/solusi_erp_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver   

  # JPA / Hibernate Configuration
  jpa:
    open-in-view: false # Recommended for ERP to avoid N+1 in views
    show-sql: true
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: none # Strictly enforced: Use Flyway for DB changes
    properties:
      hibernate.format_sql: false

  # Flyway Migration Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Thymeleaf Configuration
  thymeleaf:
    cache: false # Disable for development       
    mode: HTML

logging:
  level:
    com.solusi.erp: DEBUG
    org.springframework.security: error
    org.hibernate.SQL: off
    org.hibernate.type.descriptor.sql.BasicBinder: off
