server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml,image/svg+xml,font/woff2
    min-response-size: 1024
  servlet:
    session:
      timeout: 30m # Standard for ERP session timeout
      cookie:
        secure: true
        http-only: true
        same-site: lax

spring:
  config:
    import: "optional:file:${ENV_FILE:.env}[.properties]"
  web:
    error:
      whitelabel:
        enabled: false
      include-message: never
      include-binding-errors: never
      include-stacktrace: never
      path: /error
    resources:
      chain:
        enabled: true
        strategy:
          content:
            enabled: true
            paths: /**
  devtools:
    restart:
      exclude: static/**,public/**,templates/**,**/templates/**
      enabled: false
    livereload:
      enabled: false
  application:
    name: solusi-program-erp

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  # Database Configuration
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/solusi_erp_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver   

  # JPA / Hibernate Configuration
  jpa:
    open-in-view: false # Recommended for ERP to avoid N+1 in views
    show-sql: true
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: none # Strictly enforced: Use Flyway for DB changes
    properties:
      hibernate.format_sql: false

  # Flyway Migration Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Thymeleaf Configuration
  thymeleaf:
    cache: false # Disable for development       
    mode: HTML

logging:
  level:
    com.solusi.erp: DEBUG
    org.springframework.security: error
    org.hibernate.SQL: off
    org.hibernate.type.descriptor.sql.BasicBinder: off
  file:
    path: logs
    name: logs/erp.log

# Monitoring Configuration
monitoring:
  log:
    directory: ${LOG_DIR:logs}
    max-lines: 500
    timezone: Asia/Jakarta

# MinIO S3-compatible Storage Configuration
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  presigned-endpoint: ${MINIO_PRESIGNED_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ROOT_USER:minioadmin}
  secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
  buckets:
    signatures: ${MINIO_BUCKET_SIGNATURES:approval-signatures}
    # tambahkan bucket baru di sini untuk fitur berikutnya

erp:
  messaging:
    enabled: ${ERP_MESSAGING_ENABLED:false}
    outbox:
      batch-size: ${ERP_MESSAGING_OUTBOX_BATCH_SIZE:25}
      fixed-delay-ms: ${ERP_MESSAGING_OUTBOX_FIXED_DELAY_MS:5000}
      retry-delay-seconds: ${ERP_MESSAGING_OUTBOX_RETRY_DELAY_SECONDS:60}
      max-attempts: ${ERP_MESSAGING_OUTBOX_MAX_ATTEMPTS:10}
    kafka:
      default-topic: ${ERP_MESSAGING_KAFKA_DEFAULT_TOPIC:erp.procurement.events.v1}
