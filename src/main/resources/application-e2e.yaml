# E2E Test Profile — H2 in-memory database
# Activated via: --spring.profiles.active=e2e
# DOES NOT affect production (MariaDB) flow

server:
  port: 18080
  servlet:
    session:
      timeout: 30m
      cookie:
        secure: false
        http-only: true
        same-site: lax
  tomcat:
    accesslog:
      enabled: true
      directory: ${java.io.tmpdir}
      prefix: solusi-erp-e2e-access
      suffix: .log
      pattern: '%t %s %D %r'
      rotate: false

spring:
  datasource:
    url: jdbc:h2:mem:erp_e2e;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        globally_quoted_identifiers: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: true
    locations:
      - classpath:db/migration-h2

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  thymeleaf:
    cache: true

logging:
  level:
    root: WARN
    com.solusi.erp: INFO
    org.flywaydb: INFO
