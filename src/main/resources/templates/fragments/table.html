<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- 
        Generic Sortable Header Fragment 
        Params:
        - field: Field name in the entity (e.g., 'name', 'code')
        - label: Text to display in the header
    -->
    <th th:fragment="sortable(field, label)" scope="col">
        <a th:href="@{${currentUri}(page=0, keyword=${keyword}, sort=${field + ',' + (sortField == field && sortDir == 'asc' ? 'desc' : 'asc')})}"
           class="table-sort text-dark text-decoration-none"
           hx-boost="true"
           hx-target="closest [id]"
           hx-params="none">
            <span th:text="${label}">Label</span>
            <span class="ms-1 d-inline-flex">
                <!-- Sorting Icons -->
                <i th:if="${sortField == field && sortDir == 'asc'}" class="ti ti-arrow-narrow-up icon text-primary"></i>
                <i th:if="${sortField == field && sortDir == 'desc'}" class="ti ti-arrow-narrow-down icon text-primary"></i>
                <i th:if="${sortField != field}" class="ti ti-arrows-sort text-secondary opacity-30 icon"></i>
            </span>
        </a>
    </th>

    <!-- 
        Generic Pagination Fragment 
        Params:
        - page: The Page<T> object from Spring Data
    -->
    <div th:fragment="pagination(page)" class="card-footer d-flex align-items-center" 
         th:if="${page.totalPages > 0}" 
         hx-boost="true" 
         hx-target="closest [id]">
        <p class="m-0 text-secondary">
            <span th:text="#{label.pagination.showing}">Showing</span>
            <span th:text="${page.number * page.size + 1}">1</span>
            <span th:text="#{label.pagination.to}">to</span>
            <span th:text="${(page.number + 1) * page.size > page.totalElements ? page.totalElements : (page.number + 1) * page.size}">10</span>
            <span th:text="#{label.pagination.of}">of</span>
            <span th:text="${page.totalElements}">100</span>
            <span th:text="#{label.pagination.entries}">entries</span>
        </p>
        <ul class="pagination m-0 ms-auto">
            <!-- First Page (<<) -->
            <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                <a class="page-link"
                   th:href="${page.first} ? '#' : ${pageUrlBuilder.apply(0)}"
                   hx-params="none"
                   tabindex="-1" aria-disabled="true" th:title="#{label.pagination.first}">
                    <i class="ti ti-chevrons-left"></i>
                </a>
            </li>
            <!-- Previous Page (<) -->
            <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                <a class="page-link"
                   th:href="${page.first} ? '#' : ${pageUrlBuilder.apply(page.number - 1)}"
                   hx-params="none"
                   tabindex="-1" aria-disabled="true" th:title="#{label.pagination.previous}">
                    <i class="ti ti-chevron-left"></i>
                </a>
            </li>
            
            <!-- Page Numbers -->
            <li class="page-item" 
                th:each="i : ${#numbers.sequence(page.number - 3 < 0 ? 0 : page.number - 3, page.number + 3 > page.totalPages - 1 ? page.totalPages - 1 : page.number + 3)}"
                th:classappend="${i == page.number} ? 'active'">
                <a class="page-link"
                   th:href="${pageUrlBuilder.apply(i)}"
                   hx-params="none"
                   th:text="${i + 1}">1</a>
            </li>
            
            <!-- Next Page (>) -->
            <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                <a class="page-link"
                   th:href="${page.last} ? '#' : ${pageUrlBuilder.apply(page.number + 1)}"
                   hx-params="none"
                   th:title="#{label.pagination.next}">
                    <i class="ti ti-chevron-right"></i>
                </a>
            </li>
            <!-- Last Page (>>) -->
            <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                <a class="page-link"
                   th:href="${page.last} ? '#' : ${pageUrlBuilder.apply(page.totalPages - 1)}"
                   hx-params="none"
                   th:title="#{label.pagination.last}">
                    <i class="ti ti-chevrons-right"></i>
                </a>
            </li>
        </ul>
    </div>
</body>
</html>
