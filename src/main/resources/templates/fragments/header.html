<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <header th:fragment="header" class="navbar navbar-expand-md d-none d-lg-flex d-print-none">
        <div class="container-xl">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar-menu" aria-controls="navbar-menu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="navbar-nav flex-row order-md-last">
                <!-- Language Selector Dropdown -->
                <div class="nav-item dropdown me-3">
                    <a href="#" class="nav-link px-0" data-bs-toggle="dropdown" tabindex="-1" aria-label="Show languages">
                        <i class="ti ti-world icon"></i>
                        <span class="ms-1" th:text="${#locale.language == 'id' ? 'ID' : 'EN'}">ID</span>
                    </a>
                    <div class="dropdown-menu dropdown-menu-end dropdown-menu-arrow">
                        <a th:href="@{''(lang='id')}" class="dropdown-item" th:classappend="${#locale.language == 'id' ? 'active' : ''}">
                            Bahasa Indonesia
                        </a>
                        <a th:href="@{''(lang='en')}" class="dropdown-item" th:classappend="${#locale.language == 'en' ? 'active' : ''}">
                            English
                        </a>
                    </div>
                </div>
                <div class="nav-item dropdown">
                    <a href="#" class="nav-link d-flex lh-1 text-reset p-0" data-bs-toggle="dropdown" aria-label="Open user menu">
                        <span class="avatar avatar-sm"><i class="ti ti-user"></i></span>
                        <div class="d-none d-xl-block ps-2">
                            <div th:text="${#authentication != null ? #authentication.name : 'Unknown User'}">Username</div>
                            <div class="mt-1 small text-secondary">Administrator</div>
                        </div>
                    </a>
                    <div class="dropdown-menu dropdown-menu-end dropdown-menu-arrow">
                        <a th:href="@{/profile}" class="dropdown-item" th:text="#{label.profile}">Profil Saya</a>
                        <div class="dropdown-divider"></div>
                        <form th:action="@{/logout}" method="post">
                            <button type="submit" class="dropdown-item" th:text="#{label.logout}">Keluar</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="collapse navbar-collapse" id="navbar-menu">
                <div class="ms-md-auto me-md-auto w-100" style="max-width: 400px;">
                    <select id="global-menu-search" name="globalMenuSearch" class="form-select" th:placeholder="#{placeholder.common.search_menu}"></select>
                </div>
            </div>
        </div>
    </header>
</body>
</html>
