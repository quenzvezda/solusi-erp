<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head></head>

<body>
<aside th:fragment="sidebar" id="sidebar" class="navbar navbar-vertical navbar-expand-lg" data-bs-theme="dark">

    <!-- ============================================================
         RESIZER HANDLE — the invisible hot-zone at the right edge
         ============================================================ -->
    <div class="sidebar-resizer" id="sidebar-resizer" aria-hidden="true">
        <div class="sidebar-resizer-line"></div>
    </div>

    <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#sidebar-menu"
                aria-controls="sidebar-menu" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <h1 class="navbar-brand navbar-brand-autodark">
            <a th:href="@{/dashboard}" class="d-flex align-items-center justify-content-center w-100">
                <img th:src="@{/img/logo.png}" height="32" alt="Solusi ERP" class="navbar-brand-image logo-full">
                <img th:src="@{/img/logo-only.png}" height="32" alt="Solusi ERP"
                     class="navbar-brand-image logo-icon" style="display:none;">
            </a>
        </h1>

        <div class="collapse navbar-collapse" id="sidebar-menu">
            <ul class="navbar-nav pt-lg-3 flex-grow-1">

                <!-- Dynamic Menu Nodes from Session -->
                <th:block th:if="${session.userMenu != null}">
                    <th:block th:each="mNode, iterStat : ${session.userMenu}">
                        <th:block
                                th:replace="~{:: menuNode(node=${mNode}, id='sidebar-item-' + ${iterStat.index}, parentId='sidebar-menu')}">
                        </th:block>
                    </th:block>
                </th:block>

            </ul>

            <!-- Sidebar Footer -->
            <div class="sidebar-footer mt-auto d-none d-lg-flex align-items-center">
                <button class="btn-sidebar-toggle" id="sidebar-toggle-btn" onclick="toggleSidebar()"
                        title="Toggle Sidebar">
                    <span class="toggle-icon-wrap">
                        <i class="ti ti-layout-sidebar-left-collapse" id="sidebar-toggle-icon"></i>
                    </span>
                    <span class="nav-link-title ms-2" id="sidebar-toggle-text"
                          th:text="#{label.collapse}">Collapse</span>
                </button>
            </div>
        </div>
    </div>


    <!-- ============================================================
         RECURSIVE MENU FRAGMENT
         ============================================================ -->
    <th:block th:fragment="menuNode(node, id, parentId)">
        <th:block th:if="${node != null}">
            <!-- Leaf -->
            <li th:if="${node.leaf}" class="nav-item">
                <a class="nav-link" th:href="@{${node.urlPath}}">
                    <span th:if="${node.iconClass != null}" class="nav-link-icon d-md-none d-lg-inline-block">
                        <i th:class="'ti ' + ${node.iconClass}"></i>
                    </span>
                    <span th:if="${node.iconClass == null}" class="nav-leaf-dot"></span>
                    <span class="nav-link-title" th:text="${node.name}">Menu Name</span>
                </a>
            </li>
            <!-- Parent -->
            <li th:if="${!node.leaf}" class="nav-item">
                <a class="nav-link dropdown-toggle" th:href="'#' + ${id}"
                   data-bs-toggle="collapse" role="button"
                   aria-expanded="false" th:attr="aria-controls=${id}">
                    <span th:if="${node.iconClass != null}" class="nav-link-icon d-md-none d-lg-inline-block">
                        <i th:class="'ti ' + ${node.iconClass}"></i>
                    </span>
                    <span th:if="${node.iconClass == null}" class="nav-link-icon d-md-none d-lg-inline-block">
                        <i class="ti ti-folder"></i>
                    </span>
                    <span class="nav-link-title" th:text="${node.name}">Parent Name</span>
                </a>
                <div class="collapse" th:id="${id}" th:attr="data-bs-parent='#' + ${parentId}">
                    <ul class="nav flex-column nav-nested">
                        <th:block th:each="child, cstat : ${node.children}">
                            <th:block
                                    th:replace="~{:: menuNode(node=${child}, id=${id} + '-c-' + ${cstat.index}, parentId=${id})}">
                            </th:block>
                        </th:block>
                    </ul>
                </div>
            </li>
        </th:block>
    </th:block>


    <!-- ============================================================
         STYLES
         ============================================================ -->
    <style>
        /* ── Design Tokens ─────────────────────────────────────── */
        :root {
            --sidebar-width: 260px;
            --sidebar-min-width: 220px;
            --sidebar-max-width: 480px;
            --sidebar-narrow-width: 4.5rem;
            --sidebar-transition: width 0.22s cubic-bezier(0.4, 0, 0.2, 1);
            --page-transition: margin-left 0.22s cubic-bezier(0.4, 0, 0.2, 1);

            /* Resizer colours */
            --resizer-idle-bg: transparent;
            --resizer-hover-bg: rgba(77, 166, 255, 0.18);
            --resizer-active-bg: rgba(77, 166, 255, 0.35);
            --resizer-line-idle: rgba(255, 255, 255, 0.06);
            --resizer-line-hover: rgba(77, 166, 255, 0.7);
            --resizer-line-active: #4da6ff;

            /* Nav accent */
            --nav-accent: #4da6ff;
            --nav-accent-glow: rgba(77, 166, 255, 0.22);
        }

        /* ── Resizer Handle ─────────────────────────────────────── */
        /*
         * Key geometry:
         *  - The aside is position:fixed by Tabler, overflow:hidden by default.
         *  - We use overflow:visible on the aside so the handle can bleed outside.
         *  - right: 0  + transform: translateX(50%)  →  handle straddles the
         *    exact border between sidebar and page-wrapper (4px left, 4px right).
         *  - NO negative right value → nothing bleeds into the scrollable document
         *    flow, so zero horizontal scrollbar.
         */
        #sidebar {
            overflow: visible !important; /* allow resizer to bleed rightward */
        }

        .sidebar-resizer {
            position: absolute;
            top: 0;
            right: 0;                       /* flush with sidebar's right edge  */
            transform: translateX(50%);     /* center the zone ON that edge      */
            width: 8px;
            height: 100%;
            cursor: col-resize;
            z-index: 1060;
            display: flex;
            align-items: stretch;
            justify-content: center;
        }

        .sidebar-resizer-line {
            width: 1px;
            border-radius: 2px;
            background: var(--resizer-line-idle);
            transition: background 0.2s, box-shadow 0.2s, width 0.15s;
            align-self: stretch;
            pointer-events: none;
        }

        /* Hover state */
        .sidebar-resizer:hover .sidebar-resizer-line {
            background: var(--resizer-line-hover);
            box-shadow: 0 0 8px rgba(77, 166, 255, 0.4);
            width: 2px;
        }

        /* Active drag state — body carries this class */
        body.sidebar-resizing .sidebar-resizer-line {
            background: var(--resizer-line-active) !important;
            box-shadow: 0 0 14px rgba(77, 166, 255, 0.7) !important;
            width: 3px !important;
        }

        /* Freeze transitions & prevent text selection while dragging */
        body.sidebar-resizing * {
            transition: none !important;
            user-select: none !important;
            cursor: col-resize !important;
        }

        /* Hide resizer in narrow mode */
        body.sidebar-narrow .sidebar-resizer {
            opacity: 0;
            pointer-events: none;
        }

        /* Prevent horizontal scrollbar from appearing during/after resize */
        html, body {
            overflow-x: hidden;
        }

        /* ── Sidebar Base (desktop) ─────────────────────────────── */
        @media (min-width: 992px) {
            .navbar-vertical {
                width: var(--sidebar-width) !important;
                transition: var(--sidebar-transition);
                will-change: width;
            }

            .page-wrapper {
                margin-left: var(--sidebar-width) !important;
                transition: var(--page-transition);
                will-change: margin-left;
            }

            /* ── Narrow / Collapsed Mode ──────────────────────── */
            body.sidebar-narrow #sidebar.navbar-vertical {
                width: var(--sidebar-narrow-width) !important;
            }

            body.sidebar-narrow .page-wrapper {
                margin-left: var(--sidebar-narrow-width) !important;
            }

            body.sidebar-narrow #sidebar .nav-link-title,
            body.sidebar-narrow #sidebar .dropdown-toggle::after,
            body.sidebar-narrow #sidebar #sidebar-toggle-text,
            body.sidebar-narrow #sidebar .nav-section-label {
                display: none !important;
            }

            /* Reset ALL padding so icons land exactly in the centre of the narrow width */
            body.sidebar-narrow #sidebar.navbar-vertical,
            body.sidebar-narrow #sidebar.navbar-vertical .container-fluid {
                padding-left: 0 !important;
                padding-right: 0 !important;
            }

            /* Center .nav-item list inside the ul */
            body.sidebar-narrow #sidebar .navbar-nav {
                width: 100% !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            body.sidebar-narrow #sidebar .nav-item {
                width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                display: flex !important;
                justify-content: center !important;
                align-items: center !important;
            }

            /* Force perfectly square links with absolute positioning for the icon */
            body.sidebar-narrow #sidebar .nav-link {
                width: 3rem !important;
                height: 3rem !important;
                margin: 0 auto !important; /* Ultimate block-level horizontal centering */
                padding: 0 !important;
                position: relative !important;
                display: block !important; /* Defeat flex to avoid inner layout struggles */
                border-radius: 8px; /* Ensure uniform active state shape */
            }

            body.sidebar-narrow #sidebar .nav-link-icon {
                margin: 0 !important;
                padding: 0 !important;
                font-size: 1.25rem;
                position: absolute !important;
                top: 50% !important;
                left: 50% !important;
                transform: translate(-50%, -50%) !important;
                display: block !important; /* Defeat d-lg-inline-block !important utility */
                width: auto !important;
                height: auto !important;
                line-height: 1 !important;
            }

            /* Hide leaf dots & nested menus in narrow mode */
            body.sidebar-narrow #sidebar .nav-leaf-dot,
            body.sidebar-narrow #sidebar .nav-nested {
                display: none !important;
            }

            body.sidebar-narrow #sidebar .logo-full  { display: none !important; }
            body.sidebar-narrow #sidebar .logo-icon  { display: block !important; margin: 0 auto; }

            /* Fix sidebar footer collapse button centering */
            body.sidebar-narrow #sidebar .sidebar-footer { 
                padding: 0.5rem 0 !important; 
                display: flex !important;
                justify-content: center !important;
            }

            body.sidebar-narrow #sidebar .btn-sidebar-toggle {
                width: 2.2rem !important;
                height: 2.2rem !important;
                margin: 0 auto !important; /* Ultimate block-level horizontal centering */
                padding: 0 !important;
                position: relative !important;
                display: block !important;
                border-radius: 8px;
            }

            body.sidebar-narrow #sidebar .btn-sidebar-toggle .toggle-icon-wrap {
                position: absolute !important;
                top: 50% !important;
                left: 50% !important;
                transform: translate(-50%, -50%) !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            body.sidebar-narrow #sidebar-menu .nav-item .collapse {
                display: none !important;
            }
        }

        /* ── Nav Items ───────────────────────────────────────────── */
        .nav-nested {
            padding-left: 0.5rem;
            border-left: 1px solid rgba(255, 255, 255, 0.07);
            margin-left: 1.3rem;
            margin-top: 0.1rem;
            margin-bottom: 0.2rem;
        }

        .nav-leaf-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.22);
            flex-shrink: 0;
            transition: background 0.18s, transform 0.18s;
            margin-right: 0.75rem;
        }

        .nav-link:hover .nav-leaf-dot,
        .nav-link.active .nav-leaf-dot {
            background: var(--nav-accent);
            transform: scale(1.6);
        }

        .nav-link.active {
            color: var(--nav-accent) !important;
            background: var(--nav-accent-glow) !important;
            border-radius: 6px;
        }

        .nav-link.dropdown-toggle::after {
            margin-left: auto;
            opacity: 0.35;
            transition: transform 0.2s ease, opacity 0.2s;
        }

        .nav-link.dropdown-toggle[aria-expanded="true"]::after {
            transform: rotate(180deg);
            opacity: 0.75;
        }

        .nav-link.dropdown-toggle[aria-expanded="true"] {
            color: #fff !important;
        }

        .nav-link.dropdown-toggle[aria-expanded="true"] .nav-link-icon {
            color: var(--nav-accent);
        }

        /* ── Sidebar Footer / Toggle Button ─────────────────────── */
        .sidebar-footer {
            padding: 0.75rem 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.07);
        }

        .btn-sidebar-toggle {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            color: rgba(255, 255, 255, 0.45);
            padding: 0.45rem 0.875rem;
            font-size: 0.8125rem;
            cursor: pointer;
            transition: background 0.18s, color 0.18s, border-color 0.18s;
            width: 100%;
            height: 2.2rem; /* Standard button height ~35px */
            gap: 0.5rem;
        }

        .btn-sidebar-toggle:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.16);
            color: rgba(255, 255, 255, 0.82);
        }

        .toggle-icon-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 1.25rem;
            flex-shrink: 0;
        }

        /* ── Width tooltip shown while resizing ─────────────────── */
        #sidebar-width-tooltip {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(15, 23, 42, 0.9);
            color: #e2e8f0;
            border: 1px solid rgba(77, 166, 255, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 6px;
            padding: 0.3rem 0.65rem;
            font-size: 0.75rem;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            letter-spacing: 0.03em;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s;
            z-index: 2000;
            white-space: nowrap;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        #sidebar-width-tooltip.visible {
            opacity: 1;
        }

        /* ── Collapse chevron direction hint ────────────────────── */
        body.sidebar-narrow #sidebar-toggle-icon::before {
            font-family: 'tabler-icons' !important;
            content: "\eb83";  /* ti-layout-sidebar-right-expand */
        }
    </style>


    <!-- ============================================================
         SCRIPTS
         ============================================================ -->
    <script>
        /* ── Immediate init (before paint) ── */
        (function () {
            const narrow = localStorage.getItem('sidebar-narrow') === 'true';
            const width = localStorage.getItem('sidebar-width') || '260px';
            if (narrow) document.body.classList.add('sidebar-narrow');
            document.documentElement.style.setProperty('--sidebar-width', width);
        }());

        /* ── Toggle collapse ── */
        function toggleSidebar() {
            const isNarrow = document.body.classList.toggle('sidebar-narrow');
            if (isNarrow) {
                /* 1. Close all open collapse panels */
                document.querySelectorAll('#sidebar .collapse.show').forEach(function (el) {
                    // Manually close the panel in the DOM
                    el.classList.remove('show');
                    
                    // Destroy the Bootstrap instance to prevent internal state desync
                    // so the next time it's opened, it initializes cleanly from the closed state
                    const bsCollapse = bootstrap.Collapse.getInstance(el);
                    if (bsCollapse) {
                        bsCollapse.dispose();
                    }
                });
                /* 2. Reset aria-expanded on EVERY dropdown-toggle so the
                      white/open highlight is fully cleared */
                document.querySelectorAll('#sidebar .nav-link.dropdown-toggle').forEach(function (trigger) {
                    trigger.setAttribute('aria-expanded', 'false');
                });
            }
            localStorage.setItem('sidebar-narrow', isNarrow);
        }

        /* ── Auto-expand sidebar when clicking parent menu in narrow mode ── */
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('#sidebar .nav-link.dropdown-toggle').forEach(function (trigger) {
                trigger.addEventListener('click', function (e) {
                    if (document.body.classList.contains('sidebar-narrow')) {
                        // Expand the sidebar immediately
                        document.body.classList.remove('sidebar-narrow');
                        localStorage.setItem('sidebar-narrow', false);

                        // Allow the click event to naturally bubble up to Bootstrap's data-api listener.
                        // Bootstrap will handle opening the submenu synchronously.
                    }
                });
            });
        });

        /* ── Resizer ── */
        document.addEventListener('DOMContentLoaded', function () {

            const resizer = document.getElementById('sidebar-resizer');
            const tooltip = document.createElement('div');
            tooltip.id  = 'sidebar-width-tooltip';
            document.body.appendChild(tooltip);

            if (!resizer) return;

            let startX, startWidth, dragging = false;

            resizer.addEventListener('mousedown', function (e) {
                if (document.body.classList.contains('sidebar-narrow')) return;

                e.preventDefault();
                dragging   = true;
                startX     = e.clientX;
                startWidth = parseInt(
                    getComputedStyle(document.documentElement)
                        .getPropertyValue('--sidebar-width'), 10
                ) || 260;

                document.body.classList.add('sidebar-resizing');
                tooltip.classList.add('visible');
                updateTooltip(startWidth, e.clientX);

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup',   onMouseUp);
            });

            function onMouseMove(e) {
                if (!dragging) return;

                const delta = e.clientX - startX;
                const newWidth = Math.min(
                    Math.max(startWidth + delta, parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sidebar-min-width')) || 220),
                    parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sidebar-max-width')) || 480
                );

                document.documentElement.style.setProperty('--sidebar-width', newWidth + 'px');
                updateTooltip(newWidth, e.clientX);
            }

            function onMouseUp() {
                if (!dragging) return;
                dragging = false;

                document.body.classList.remove('sidebar-resizing');
                tooltip.classList.remove('visible');

                const finalWidth = getComputedStyle(document.documentElement)
                    .getPropertyValue('--sidebar-width').trim();
                localStorage.setItem('sidebar-width', finalWidth);

                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup',   onMouseUp);
            }

            function updateTooltip(widthPx, cursorX) {
                tooltip.textContent = widthPx + ' px';
                /* Position tooltip just to the right of the cursor */
                tooltip.style.left = (cursorX + 18) + 'px';
            }

            /* ── Highlight active nav link (most-specific match only) ── */
            const currentPath = window.location.pathname;
            let bestLink = null;
            let bestLen = 0;
            document.querySelectorAll('#sidebar .nav-link').forEach(function (link) {
                const href = link.getAttribute('href');
                if (href && href !== '#') {
                    if (currentPath === href || currentPath.startsWith(href + '/')) {
                        if (href.length > bestLen) {
                            bestLen = href.length;
                            bestLink = link;
                        }
                    }
                }
            });
            if (bestLink) {
                bestLink.classList.add('active');
                /* Open all ancestor collapse panels */
                let panel = bestLink.closest('.collapse');
                while (panel) {
                    panel.classList.add('show');
                    const trigger = document.querySelector('[data-bs-target="#' + panel.id + '"]');
                    if (trigger) trigger.setAttribute('aria-expanded', 'true');
                    panel = panel.parentElement && panel.parentElement.closest('.collapse');
                }
            }
        });
    </script>

</aside>
</body>
</html>
