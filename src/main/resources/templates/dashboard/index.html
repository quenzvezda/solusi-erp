<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/master :: head(#{label.dashboard})}"></head>
<body th:replace="~{layout/master :: layout(~{:: .dashboard-content}, ~{})}">
    <div class="dashboard-content">
        <div th:if="${param.resetSuccess}" class="alert alert-success mt-3" th:text="#{msg.password.reset.success}">
            Password Anda telah berhasil diperbarui. Selamat bekerja!
        </div>
        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title" th:text="#{msg.welcome(${#authentication.name})}">
                            Selamat Datang, User!
                        </h2>
                    </div>
                </div>
            </div>
        </div>

        <div class="page-body">
            <div class="container-xl">
                <div class="row row-cards">

                    <!-- System Status Card -->
                    <div class="col-md-6 col-lg-3">
                        <div class="card">
                            <div class="card-body">
                                <div class="subheader" th:text="#{label.system.status}">Status Sistem</div>
                                <div class="h1" th:text="#{label.system.online}">Online</div>
                            </div>
                        </div>
                    </div>

                    <!-- Pending Approval Card -->
                    <div class="col-md-6 col-lg-3" sec:authorize="hasAuthority('DASHBOARD_APPROVAL')"
                         th:if="${pendingApprovalCount != null}">
                        <a th:href="@{/common/approval}" class="text-decoration-none">
                            <div class="card card-link card-link-pop">
                                <div class="card-body">
                                    <div class="subheader" th:text="#{label.approval.pending}">Persetujuan Pending</div>
                                    <div class="d-flex align-items-baseline">
                                        <div class="h1 mb-0 me-2" th:text="${pendingApprovalCount}">0</div>
                                        <div class="me-auto">
                                            <span class="text-warning d-inline-flex align-items-center lh-1">
                                                <i class="ti ti-clock me-1"></i>
                                                <span th:text="#{label.approval.status.pending}">Menunggu</span>
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </a>
                    </div>

                    <!-- Latest News Card -->
                    <div class="col-md-12 col-lg-6" sec:authorize="hasAuthority('DASHBOARD_NEWS')"
                         th:if="${latestNews != null and !latestNews.isEmpty()}">
                        <div class="card">
                            <div class="card-header">
                                <h3 class="card-title" th:text="#{label.news.latest}">Berita Terbaru</h3>
                                <div class="card-options">
                                    <a th:href="@{/common/news}" class="btn btn-sm btn-outline-secondary"
                                       th:text="#{label.view.all}">Lihat Semua</a>
                                </div>
                            </div>
                            <div class="list-group list-group-flush">
                                <a th:each="n : ${latestNews}"
                                   th:href="@{/common/news/{id}(id=${n.id})}"
                                   class="list-group-item list-group-item-action">
                                    <div class="row align-items-center">
                                        <div class="col-auto">
                                            <span class="avatar avatar-sm rounded bg-blue-lt">
                                                <i class="ti ti-news"></i>
                                            </span>
                                        </div>
                                        <div class="col text-truncate">
                                            <div class="text-body d-block fw-semibold text-truncate" th:text="${n.title}">Title</div>
                                            <div class="d-block text-secondary text-truncate small">
                                                <span th:text="${n.author ?: '-'}">Author</span>
                                                <span th:if="${n.publishDate}" class="ms-2 text-muted">
                                                    <i class="ti ti-calendar me-1"></i>
                                                    <span th:text="${#temporals.format(n.publishDate, 'dd MMM yyyy')}">Date</span>
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                </a>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</body>
</html>
