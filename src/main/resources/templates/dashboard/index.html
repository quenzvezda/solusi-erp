<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/master :: head(#{label.dashboard})}"></head>
<body th:replace="~{layout/master :: layout(~{:: .dashboard-content})}">
    <div class="dashboard-content">
        <div th:if="${param.resetSuccess}" class="alert alert-success mt-3" th:text="#{msg.password.reset.success}">
            Password Anda telah berhasil diperbarui. Selamat bekerja!
        </div>
        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title" th:text="#{msg.welcome(${#authentication.name})}">
                            Selamat Datang, User!
                        </h2>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row row-cards mt-2">
            <div class="col-md-6 col-lg-3">
                <div class="card">
                    <div class="card-body">
                        <div class="subheader" th:text="#{label.system.status}">Status Sistem</div>
                        <div class="h1" th:text="#{label.system.online}">Online (Native Thymeleaf)</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
