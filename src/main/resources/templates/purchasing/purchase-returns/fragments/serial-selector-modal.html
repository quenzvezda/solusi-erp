<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div id="purchase-return-serial-selector-results" th:fragment="purchase-return-serial-selector-results">
    <div class="card-header border-0 pb-0">
        <form class="row g-2" hx-get="/purchasing/purchase-returns/selectors/serials"
              hx-target="#purchase-return-serial-selector-results" hx-swap="outerHTML">
            <input type="hidden" name="goodsReceiptId" th:value="${goodsReceiptId}">
            <input type="hidden" name="goodsReceiptLineId" th:value="${goodsReceiptLineId}">
            <th:block th:each="key : ${excludedSelectionKeys}">
                <input type="hidden" name="excludedSelectionKeys" th:value="${key}">
            </th:block>
            <div class="col"><input type="search" class="form-control" name="keyword" th:value="${keyword}"
                                    th:placeholder="#{label.purchase-return.serial.search}"></div>
            <div class="col-auto"><button type="submit" class="btn btn-primary">
                <i class="ti ti-search me-1"></i><span th:text="#{label.search}">Search</span>
            </button></div>
        </form>
    </div>
    <div class="table-responsive">
        <table class="table table-vcenter card-table">
            <thead><tr>
                <th class="w-1"></th><th th:text="#{label.serial}">Serial</th><th th:text="#{label.product}">Product</th>
                <th th:text="#{label.container}">Actual Container</th><th class="text-end" th:text="#{label.unit.cost}">Unit Cost</th>
            </tr></thead>
            <tbody>
            <tr th:if="${page.empty}"><td colspan="5" class="text-center text-secondary py-4" th:text="#{label.purchase-return.selector.serial.empty}">No serials.</td></tr>
            <tr th:each="row : ${page.content}"
                th:attr="data-selection-key=${row.selectionKey},data-goods-receipt-line-id=${row.goodsReceiptLineId},
                         data-product-id=${row.productId},data-product-name=${row.productName},data-product-subtext=${row.productCode},
                         data-uom-id=${row.uomId},data-uom-name=${row.uomName},data-uom-subtext=${row.uomCode},
                         data-facility-id=${row.facilityId},data-facility-name=${row.facilityName},
                         data-grid-id=${row.gridId},data-grid-name=${row.gridName},data-grid-subtext=${row.gridCode},
                         data-container-id=${row.containerId},data-container-name=${row.containerName},data-container-subtext=${row.containerCode},
                         data-serialized=true,data-serial-number=${row.serialNumber},data-outstanding-quantity=1,
                         data-valuation-reference-type=${row.valuationReferenceType},data-valuation-reference-id=${row.valuationReferenceId},
                         data-valuation-reference-line-id=${row.valuationReferenceLineId},data-unit-cost=${row.unitCost},
                         data-inventory-amount=${row.inventoryAmount},data-tax-reversal-amount=${row.taxReversalAmount},
                         data-clearing-amount=${row.clearingAmount}">
                <td><label class="form-check m-0"><input class="form-check-input js-purchase-return-serial-item" type="checkbox"></label></td>
                <td class="fw-semibold" th:text="${row.serialNumber}">SER-001</td>
                <td><div th:text="${row.productName}">Product</div><div class="text-secondary small" th:text="${row.productCode}">P-001</div></td>
                <td><div th:text="${row.containerName}">Moved Bin</div><div class="text-secondary small" th:text="${row.facilityName + ' / ' + row.gridCode + ' / ' + row.containerCode}">Main / A / MOVED</div></td>
                <td class="text-end" th:text="${#numbers.formatDecimal(row.unitCost, 1, 'COMMA', 2, 'POINT')}">0.00</td>
            </tr>
            </tbody>
        </table>
    </div>
    <div th:replace="~{fragments/table :: pagination(${page})}"></div>
    <div class="card-footer d-flex justify-content-end">
        <button type="button" class="btn btn-primary js-purchase-return-serial-apply">
            <i class="ti ti-check me-1"></i><span th:text="#{label.apply}">Apply</span>
        </button>
    </div>
</div>
</body>
</html>
