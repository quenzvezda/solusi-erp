<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/master :: head(${purchaseReturnRequest.id == null ? #messages.msg('label.purchase-return.create') : #messages.msg('label.purchase-return.edit')})}"></head>
<body th:replace="~{layout/master :: layout(~{:: .purchase-return-form-content}, ~{:: #page-specific-scripts})}">
<div class="purchase-return-form-content">
    <div class="page-header d-print-none">
        <div class="container-xl">
            <h2 class="page-title" th:text="${purchaseReturnRequest.id == null ? #messages.msg('label.purchase-return.create') : #messages.msg('label.purchase-return.edit')}">Purchase Return</h2>
        </div>
    </div>
    <div class="page-body">
        <div class="container-xl">
            <form th:action="${purchaseReturnRequest.id == null ? '/purchasing/purchase-returns/create' : '/purchasing/purchase-returns/edit/' + purchaseReturnRequest.id}"
                  th:object="${purchaseReturnRequest}" method="post" id="purchase-return-form"
                  data-ajax-form="true" data-redirect-on-success="/purchasing/purchase-returns">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" th:field="*{id}">
                <input type="hidden" th:field="*{goodsReceiptId}">
                <input type="hidden" th:field="*{goodsReceiptCode}">
                <input type="hidden" th:field="*{purchaseOrderId}">
                <input type="hidden" th:field="*{purchaseOrderCode}">
                <input type="hidden" th:field="*{supplierId}">
                <input type="hidden" th:field="*{supplierName}">
                <input type="hidden" th:field="*{facilityId}">
                <input type="hidden" th:field="*{facilityName}">
                <input type="hidden" th:field="*{currencyId}">
                <input type="hidden" th:field="*{currencyCode}">
                <input type="hidden" th:field="*{exchangeRate}">
                <div class="card mb-3">
                    <div class="card-body">
                        <div class="alert-container">
                            <div th:replace="~{fragments/alerts :: success}"></div>
                            <div th:replace="~{fragments/alerts :: error}"></div>
                        </div>
                        <div class="row g-3">
                            <div class="col-md-3">
                                <label class="form-label text-secondary" th:text="#{label.purchase-return.goods-receipt}">Goods Receipt</label>
                                <div class="form-control-plaintext fw-semibold">
                                    <a th:href="@{/inventory/goods-receipts/{id}(id=${purchaseReturnRequest.goodsReceiptId})}"
                                       th:text="${purchaseReturnRequest.goodsReceiptCode}">GR-001</a>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label text-secondary" th:text="#{label.purchase-return.purchase-order}">Purchase Order</label>
                                <div class="form-control-plaintext">
                                    <a th:href="@{/purchasing/purchase-orders/view/{id}(id=${purchaseReturnRequest.purchaseOrderId})}"
                                       th:text="${purchaseReturnRequest.purchaseOrderCode}">PO-001</a>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label text-secondary" th:text="#{label.purchase-return.supplier}">Supplier</label>
                                <div class="form-control-plaintext" th:text="${purchaseReturnRequest.supplierName}">Supplier</div>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label text-secondary" th:text="#{label.purchase-return.facility}">Facility</label>
                                <div class="form-control-plaintext" th:text="${purchaseReturnRequest.facilityName}">Main</div>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label text-secondary" th:text="#{label.purchase-return.currency}">Currency</label>
                                <div class="form-control-plaintext" th:text="${purchaseReturnRequest.currencyCode}">IDR</div>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label text-secondary" th:text="#{label.purchase-return.exchange-rate}">Exchange Rate</label>
                                <div class="form-control-plaintext" th:text="${#numbers.formatDecimal(purchaseReturnRequest.exchangeRate, 1, 'COMMA', 4, 'POINT')}">1.0000</div>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label required" th:text="#{label.purchase-return.return-date}">Return Date</label>
                                <input type="date" data-picker="date" th:field="*{returnDate}" class="form-control erp-input" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label required" th:text="#{label.purchase-return.reason}">Default Reason</label>
                                <select th:field="*{reason}" id="header-reason" class="form-select erp-input" required>
                                    <option value="">-- Select --</option>
                                    <option th:each="reason : ${reasons}" th:value="${reason}"
                                            th:text="${#messages.msg(reason.messageKey)}">Damaged</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label" th:text="#{label.purchase-return.note}">Note</label>
                                <textarea th:field="*{note}" class="form-control erp-input" rows="2"></textarea>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row row-cards">
                    <div class="col-lg-9">
                        <div class="card">
                            <div class="card-header">
                                <h3 class="card-title" th:text="#{label.purchase-return.lines}">Return Lines</h3>
                                <div class="card-actions">
                                    <button type="button" class="btn btn-primary btn-sm" id="btn-add-line">
                                        <i class="ti ti-plus me-1"></i><span th:text="#{label.purchase-return.line.add}">Add Line</span>
                                    </button>
                                </div>
                            </div>
                            <div class="table-responsive">
                                <table class="table table-vcenter card-table" id="table-lines">
                                    <thead><tr>
                                        <th th:text="#{label.product}">Product</th>
                                        <th th:text="#{label.container}">Container</th>
                                        <th class="text-end" th:text="#{label.purchase-return.returnable-qty}">Outstanding</th>
                                        <th class="text-end required" th:text="#{label.qty}">Qty</th>
                                        <th class="required" th:text="#{label.purchase-return.reason}">Reason</th>
                                        <th th:text="#{label.purchase-return.note}">Note</th>
                                        <th th:text="#{label.serial}">Serial</th>
                                        <th class="w-1"></th>
                                    </tr></thead>
                                    <tbody id="line-container">
                                    <tr th:each="line, stat : *{lines}" class="line-row"
                                        th:data-index="${stat.index}" th:data-selection-key="${line.selectionKey}">
                                        <td>
                                            <input type="hidden" th:name="'lines[' + ${stat.index} + '].id'" th:value="${line.id}">
                                            <input type="hidden" th:name="'lines[' + ${stat.index} + '].selectionKey'" th:value="${line.selectionKey}" class="input-selection-key">
                                            <input type="hidden" th:name="'lines[' + ${stat.index} + '].goodsReceiptLineId'" th:value="${line.goodsReceiptLineId}" class="input-gr-line-id">
                                            <input type="hidden" th:name="'lines[' + ${stat.index} + '].productId'" th:value="${line.productId}">
                                            <input type="hidden" th:name="'lines[' + ${stat.index} + '].productName'" th:value="${line.productName}">
                                            <input type="hidden" th:name="'lines[' + ${stat.index} + '].productCode'" th:value="${line.productCode}">
                                            <input type="hidden" th:name="'lines[' + ${stat.index} + '].serialized'" th:value="${line.serialized}" class="input-serialized">
                                            <input type="hidden" th:name="'lines[' + ${stat.index} + '].baseQuantity'" th:value="${line.baseQuantity}" class="input-base-qty">
                                            <input type="hidden" th:name="'lines[' + ${stat.index} + '].uomId'" th:value="${line.uomId}">
                                            <input type="hidden" th:name="'lines[' + ${stat.index} + '].uomName'" th:value="${line.uomName}">
                                            <input type="hidden" th:name="'lines[' + ${stat.index} + '].uomCode'" th:value="${line.uomCode}">
                                            <input type="hidden" th:name="'lines[' + ${stat.index} + '].facilityId'" th:value="${line.facilityId}">
                                            <input type="hidden" th:name="'lines[' + ${stat.index} + '].facilityName'" th:value="${line.facilityName}">
                                            <input type="hidden" th:name="'lines[' + ${stat.index} + '].gridId'" th:value="${line.gridId}">
                                            <input type="hidden" th:name="'lines[' + ${stat.index} + '].gridName'" th:value="${line.gridName}">
                                            <input type="hidden" th:name="'lines[' + ${stat.index} + '].gridCode'" th:value="${line.gridCode}">
                                            <input type="hidden" th:name="'lines[' + ${stat.index} + '].containerId'" th:value="${line.containerId}" class="input-container-id">
                                            <input type="hidden" th:name="'lines[' + ${stat.index} + '].containerName'" th:value="${line.containerName}">
                                            <input type="hidden" th:name="'lines[' + ${stat.index} + '].containerCode'" th:value="${line.containerCode}">
                                            <input type="hidden" th:name="'lines[' + ${stat.index} + '].serialNumbers'" th:value="${line.serialNumbers}" class="input-serial-numbers">
                                            <input type="hidden" th:name="'lines[' + ${stat.index} + '].outstandingQuantity'" th:value="${line.outstandingQuantity}" class="input-outstanding-qty">
                                            <input type="hidden" th:name="'lines[' + ${stat.index} + '].valuationReferenceType'" th:value="${line.valuationReferenceType}">
                                            <input type="hidden" th:name="'lines[' + ${stat.index} + '].valuationReferenceId'" th:value="${line.valuationReferenceId}">
                                            <input type="hidden" th:name="'lines[' + ${stat.index} + '].valuationReferenceLineId'" th:value="${line.valuationReferenceLineId}">
                                            <input type="hidden" th:name="'lines[' + ${stat.index} + '].unitCost'" th:value="${line.unitCost}" class="input-unit-cost">
                                            <input type="hidden" th:name="'lines[' + ${stat.index} + '].inventoryAmount'" th:value="${line.inventoryAmount}" class="input-inventory-amount">
                                            <input type="hidden" th:name="'lines[' + ${stat.index} + '].taxReversalAmount'" th:value="${line.taxReversalAmount}">
                                            <input type="hidden" th:name="'lines[' + ${stat.index} + '].clearingAmount'" th:value="${line.clearingAmount}">
                                            <div class="fw-semibold" th:text="${line.productName}">Product</div>
                                            <div class="text-secondary small" th:text="${line.productCode + ' / ' + line.uomCode}">P-001 / PCS</div>
                                        </td>
                                        <td>
                                            <div th:text="${line.containerName ?: line.containerCode}">Bin</div>
                                            <div class="text-secondary small" th:text="${line.facilityName + ' / ' + line.gridCode + ' / ' + line.containerCode}">Main / A / BIN</div>
                                        </td>
                                        <td class="text-end" th:text="${#numbers.formatDecimal(line.outstandingQuantity, 1, 'COMMA', 2, 'POINT')}">0.00</td>
                                        <td><input type="text" th:name="'lines[' + ${stat.index} + '].quantity'" th:value="${line.quantity}"
                                                   class="form-control form-control-sm erp-input-sm erp-number-decimal text-end input-qty"
                                                   th:readonly="${line.serialized}"></td>
                                        <td><select th:name="'lines[' + ${stat.index} + '].reason'" class="form-select form-select-sm input-line-reason">
                                            <option value="">-- Select --</option>
                                            <option th:each="lineReason : ${reasons}" th:value="${lineReason}" th:selected="${line.reason == lineReason}"
                                                    th:text="${#messages.msg(lineReason.messageKey)}">Damaged</option>
                                        </select></td>
                                        <td><input type="text" th:name="'lines[' + ${stat.index} + '].note'" th:value="${line.note}"
                                                   class="form-control form-control-sm erp-input-sm input-line-note"></td>
                                        <td><button type="button" class="btn btn-white btn-sm btn-select-serials"
                                                    th:if="${line.serialized}">
                                            <i class="ti ti-barcode me-1"></i><span class="serial-count">0</span>
                                        </button><span th:unless="${line.serialized}">-</span></td>
                                        <td><button type="button" class="btn btn-white btn-icon btn-remove-line text-danger"><i class="ti ti-trash"></i></button></td>
                                    </tr>
                                    </tbody>
                                </table>
                                <div id="empty-msg" class="text-center py-4 text-secondary"
                                     th:style="${#lists.isEmpty(purchaseReturnRequest.lines)} ? '' : 'display:none'"
                                     th:text="#{label.purchase-return.line.empty}">No lines.</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-3">
                        <div class="card bg-secondary-lt">
                            <div class="card-body">
                                <div class="text-secondary" th:text="#{label.purchase-return.summary.lines}">Positive Lines</div>
                                <div class="h2 mb-3" id="summary-line-count">0</div>
                                <div class="text-secondary" th:text="#{label.qty}">Qty</div>
                                <div class="h3 mb-3" id="summary-total-qty">0.00</div>
                                <div class="text-secondary" th:text="#{label.inventory.amount}">Amount</div>
                                <div class="h3 mb-0" id="summary-total-amount">0.00</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card mt-3">
                    <div class="card-footer d-flex align-items-center">
                        <div id="loading-indicator" class="spinner-border spinner-border-sm text-primary me-2" role="status" style="display:none;"></div>
                        <a th:href="@{/purchasing/purchase-returns}" class="btn btn-link link-secondary" th:text="#{label.cancel}">Cancel</a>
                        <button type="submit" class="btn btn-primary ms-auto" sec:authorize="hasAnyAuthority('PURCHASE-RETURN_CREATE', 'PURCHASE-RETURN_UPDATE')">
                            <i class="ti ti-device-floppy me-1"></i><span th:text="#{label.save}">Save</span>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <table style="display:none"><tbody id="row-template-source">
    <tr class="line-row" data-selection-key="">
        <td>
            <input type="hidden" name="lines[INDEX].id">
            <input type="hidden" name="lines[INDEX].selectionKey" class="input-selection-key">
            <input type="hidden" name="lines[INDEX].goodsReceiptLineId" class="input-gr-line-id">
            <input type="hidden" name="lines[INDEX].productId"><input type="hidden" name="lines[INDEX].productName"><input type="hidden" name="lines[INDEX].productCode">
            <input type="hidden" name="lines[INDEX].serialized" class="input-serialized">
            <input type="hidden" name="lines[INDEX].baseQuantity" class="input-base-qty">
            <input type="hidden" name="lines[INDEX].uomId"><input type="hidden" name="lines[INDEX].uomName"><input type="hidden" name="lines[INDEX].uomCode">
            <input type="hidden" name="lines[INDEX].facilityId"><input type="hidden" name="lines[INDEX].facilityName">
            <input type="hidden" name="lines[INDEX].gridId"><input type="hidden" name="lines[INDEX].gridName"><input type="hidden" name="lines[INDEX].gridCode">
            <input type="hidden" name="lines[INDEX].containerId" class="input-container-id"><input type="hidden" name="lines[INDEX].containerName"><input type="hidden" name="lines[INDEX].containerCode">
            <input type="hidden" name="lines[INDEX].serialNumbers" class="input-serial-numbers">
            <input type="hidden" name="lines[INDEX].outstandingQuantity" class="input-outstanding-qty">
            <input type="hidden" name="lines[INDEX].valuationReferenceType"><input type="hidden" name="lines[INDEX].valuationReferenceId"><input type="hidden" name="lines[INDEX].valuationReferenceLineId">
            <input type="hidden" name="lines[INDEX].unitCost" class="input-unit-cost"><input type="hidden" name="lines[INDEX].inventoryAmount" class="input-inventory-amount">
            <input type="hidden" name="lines[INDEX].taxReversalAmount"><input type="hidden" name="lines[INDEX].clearingAmount">
            <div class="fw-semibold line-product-name"></div><div class="text-secondary small line-product-subtext"></div>
        </td>
        <td><div class="line-container-name"></div><div class="text-secondary small line-container-subtext"></div></td>
        <td class="text-end line-outstanding-display">0.00</td>
        <td><input type="text" name="lines[INDEX].quantity" value="0" class="form-control form-control-sm erp-input-sm erp-number-decimal text-end input-qty"></td>
        <td><select name="lines[INDEX].reason" class="form-select form-select-sm input-line-reason">
            <option value="">-- Select --</option><option th:each="lineReason : ${reasons}" th:value="${lineReason}" th:text="${#messages.msg(lineReason.messageKey)}">Damaged</option>
        </select></td>
        <td><input type="text" name="lines[INDEX].note" class="form-control form-control-sm erp-input-sm input-line-note"></td>
        <td><button type="button" class="btn btn-white btn-sm btn-select-serials d-none"><i class="ti ti-barcode me-1"></i><span class="serial-count">0</span></button><span class="non-serial-placeholder">-</span></td>
        <td><button type="button" class="btn btn-white btn-icon btn-remove-line text-danger"><i class="ti ti-trash"></i></button></td>
    </tr>
    </tbody></table>
    <div th:replace="~{fragments/modal-selector :: shell('modal-purchase-return-gr-lines', #{label.purchase-return.line.add}, 'purchase-return-gr-line-selector-results', 'modal-xl')}"></div>
    <div th:replace="~{fragments/modal-selector :: shell('modal-purchase-return-serials', #{label.purchase-return.serial.select}, 'purchase-return-serial-selector-results', 'modal-xl')}"></div>
</div>
<div id="page-specific-scripts" th:fragment="pageScripts">
    <script th:inline="javascript">
        window.PurchaseReturnPageConfig = {
            goodsReceiptId: /*[[${purchaseReturnRequest.goodsReceiptId}]]*/ null,
            grLineSelectorUrl: /*[[@{/purchasing/purchase-returns/selectors/goods-receipt-lines}]]*/ '',
            serialSelectorUrl: /*[[@{/purchasing/purchase-returns/selectors/serials}]]*/ '',
            reasonRequired: /*[[#{msg.error.purchase-return.line.reason-required}]]*/ '',
            otherNoteRequired: /*[[#{msg.error.purchase-return.line.other-note-required}]]*/ '',
            quantityExceeded: /*[[#{msg.error.purchase-return.line.quantity-exceeded}]]*/ '',
            lineRequired: /*[[#{msg.error.purchase-return.line.required}]]*/ '',
            serialRequired: /*[[#{msg.error.purchase-return.line.serial-required}]]*/ '',
            selectAtLeastOne: /*[[#{msg.error.purchase-return.selector.select-at-least-one}]]*/ ''
        };
    </script>
    <script th:src="@{/js/shared/erp-modal-selector.js}" defer></script>
    <script th:src="@{/js/purchasing/purchase-return/form.js}" defer></script>
</div>
</body>
</html>
