<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layout/master :: head(${grRequest.id == null
    ? #messages.msg('label.gr.create')
    : #messages.msg('label.gr.edit')})}">
</head>

<body th:replace="~{layout/master :: layout(~{:: .gr-form-content}, ~{:: #page-specific-scripts})}">
    <div class="gr-form-content" id="gr-form-content">

        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title">
                            <span th:if="${grRequest.id == null}" th:text="#{label.gr.create}">Create Goods Receipt</span>
                            <span th:if="${grRequest.id != null}" th:text="#{label.gr.edit}">Edit Goods Receipt</span>
                        </h2>
                    </div>
                </div>
            </div>
        </div>

        <div class="page-body">
            <div class="container-xl">

                <form th:action="${grRequest.id == null
                        ? '/inventory/goods-receipts'
                        : '/inventory/goods-receipts'}"
                    th:object="${grRequest}"
                    method="post"
                    id="gr-form"
                    data-ajax-form="true"
                    data-redirect-on-success="/inventory/goods-receipts">

                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <input type="hidden" th:field="*{id}">

                    <div class="card mb-3">
                        <div class="card-body">
                            <div class="alert-container"></div>

                            <div class="row g-3">
                                <div class="col-md-4">
                                    <div th:replace="~{fragments/inputs :: date(field='receiptDate', value=*{receiptDate}, label=#{label.gr.receiptDate}, isReadonly=false, required=true)}"></div>
                                </div>
                                <div class="col-md-12">
                                    <label class="form-label" th:text="#{label.gr.notes}">Notes</label>
                                    <textarea class="form-control erp-input" th:field="*{notes}" rows="2"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title" th:text="#{label.gr.line.title}">Receipt Lines</h3>
                            <div class="card-actions">
                                <button type="button" class="btn btn-primary btn-sm" id="btn-add-line"><i class="ti ti-plus"></i> <span th:text="#{label.gr.line.add}">Add Line</span></button>
                            </div>
                        </div>
                        <div class="table-responsive" style="min-height: 200px;">
                            <table class="table table-vcenter card-table" id="table-lines">
                                <thead>
                                    <tr>
                                        <th class="required" th:text="#{label.product}" style="width: 25%;">Product</th>
                                        <th class="required" th:text="#{label.serialized}" style="width: 8%;">Serialized</th>
                                        <th class="text-end required" th:text="#{label.qty.received}" style="width: 12%;">Qty Received</th>
                                        <th class="required" th:text="#{label.uom}" style="width: 12%;">UoM</th>
                                        <th th:text="#{label.container}" style="width: 15%;">Container</th>
                                        <th th:text="#{label.serial.number}" style="width: 15%;">Serial Number</th>
                                        <th class="w-1" style="width: 80px;"></th>
                                    </tr>
                                </thead>
                                <tbody id="line-container">
                                    <tr th:each="line, stat : *{lines}" class="line-row" th:data-index="${stat.index}">
                                        <td>
                                            <div th:replace="~{fragments/inputs :: table-autocomplete(name='lines[' + __${stat.index}__ + '].productId', id='select-product-' + __${stat.index}__, isReadonly=false, extraClass='select-product', path='inventory/products',
                                                initialValue=${line.productId}, initialText=${line.productName},
                                                initialSubtext=${line.productCode})}"></div>
                                        </td>
                                        <td>
                                            <div class="form-check">
                                                <input type="checkbox" th:name="'lines[' + ${stat.index} + '].serialized'" class="form-check-input chk-serialized" th:checked="${line.serialized}">
                                            </div>
                                        </td>
                                        <td><input type="text" th:name="'lines[' + ${stat.index} + '].quantityReceived'" th:value="${line.quantityReceived}" class="form-control form-control-sm erp-input-sm erp-number-decimal text-end input-qty" required></td>
                                        <td>
                                            <div th:replace="~{fragments/inputs :: table-autocomplete(name='lines[' + __${stat.index}__ + '].uomId', id='select-uom-' + __${stat.index}__, isReadonly=false, extraClass='select-uom', path='inventory/uoms',
                                                initialValue=${line.uomId}, initialText=${line.uomName},
                                                initialSubtext=${line.uomCode})}"></div>
                                        </td>
                                        <td>
                                            <div th:replace="~{fragments/inputs :: table-autocomplete(name='lines[' + __${stat.index}__ + '].containerId', id='select-container-' + __${stat.index}__, isReadonly=false, extraClass='select-container', path='inventory/containers',
                                                initialValue=${line.containerId}, initialText=${line.containerName},
                                                initialSubtext=${line.containerCode})}"></div>
                                        </td>
                                        <td><input type="text" th:name="'lines[' + ${stat.index} + '].serialNumber'" th:value="${line.serialNumber}" class="form-control form-control-sm erp-input-sm input-serial-number"></td>
                                        <td>
                                            <div class="btn-list flex-nowrap">
                                                <button type="button" class="btn btn-white btn-icon btn-remove-line text-danger" title="Remove"><i class="ti ti-trash"></i></button>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                            <div id="empty-msg" class="text-center py-4 text-secondary" th:style="${#lists.isEmpty(grRequest.lines)} ? '' : 'display:none'" th:text="#{label.gr.line.empty}">No lines added yet.</div>
                        </div>
                        <div class="card-footer text-end">
                            <div th:if="${auditInfo != null and auditInfo.id != null}" th:replace="~{fragments/audit-info :: audit-info(${auditInfo})}"></div>
                            <div class="d-flex align-items-center">
                                <div id="loading-indicator" class="spinner-border spinner-border-sm text-primary me-2" role="status" style="display: none;"></div>
                                <a th:href="@{/inventory/goods-receipts}" class="btn btn-link link-secondary" th:text="#{label.cancel}">Cancel</a>
                                <button type="submit" class="btn btn-primary ms-auto">
                                    <i class="ti ti-device-floppy"></i>
                                    <span th:text="#{label.save}">Save</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <table style="display:none">
            <tbody id="row-template-source">
                <tr class="line-row">
                    <td>
                        <div th:replace="~{fragments/inputs :: table-autocomplete(name='lines[INDEX].productId', id='', isReadonly=false, extraClass='select-product', path='inventory/products')}"></div>
                    </td>
                    <td>
                        <div class="form-check">
                            <input type="checkbox" name="lines[INDEX].serialized" class="form-check-input chk-serialized">
                        </div>
                    </td>
                    <td><input type="text" name="lines[INDEX].quantityReceived" class="form-control form-control-sm erp-input-sm erp-number-decimal text-end input-qty" value="0.0000" required></td>
                    <td>
                        <div th:replace="~{fragments/inputs :: table-autocomplete(name='lines[INDEX].uomId', id='', isReadonly=false, extraClass='select-uom', path='inventory/uoms')}"></div>
                    </td>
                    <td>
                        <div th:replace="~{fragments/inputs :: table-autocomplete(name='lines[INDEX].containerId', id='', isReadonly=false, extraClass='select-container', path='inventory/containers')}"></div>
                    </td>
                    <td><input type="text" name="lines[INDEX].serialNumber" class="form-control form-control-sm erp-input-sm input-serial-number"></td>
                    <td>
                        <div class="btn-list flex-nowrap">
                            <button type="button" class="btn btn-white btn-icon btn-remove-line text-danger" title="Remove"><i class="ti ti-trash"></i></button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>

    </div>

    <div id="page-specific-scripts">
        <script th:src="@{/js/inventory/goods-receipt/goods-receipt-form.js}"></script>
    </div>
</body>

</html>
