<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layout/master :: head(#{label.stock-adjustment.title})}"></head>

<body th:replace="~{layout/master :: layout(~{:: .stock-adjustment-form-content})}">
    <div class="stock-adjustment-form-content">
        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title" th:text="${stockAdjustment.id == null ? #messages.msg('label.stock-adjustment.add') : #messages.msg('label.stock-adjustment.edit')}">
                            Add New Adjustment
                        </h2>
                    </div>
                </div>
            </div>
        </div>

        <div class="page-body">
            <div class="container-xl">
                <form th:action="${stockAdjustment.id == null ? '/inventory/adjustments/create' : '/inventory/adjustments/edit/' + stockAdjustment.id}"
                      th:object="${stockAdjustment}" method="post" id="adjustment-form">
                    
                    <div class="card mb-3">
                        <div class="card-header">
                            <h3 class="card-title" th:text="#{label.stock-adjustment.title}">Header</h3>
                        </div>
                        <div class="card-body">
                            <div class="row row-cards">
                                <div class="col-md-4">
                                    <div class="mb-3">
                                        <label class="form-label" th:text="#{label.stock-adjustment.code}">No. Adj</label>
                                        <input type="text" class="form-control bg-light" th:field="*{code}" readonly placeholder="AUTO">
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="mb-3">
                                        <label class="form-label required" th:text="#{label.stock-adjustment.date}">Date</label>
                                        <input type="date" class="form-control" th:field="*{transactionDate}" th:errorclass="is-invalid">
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('transactionDate')}" th:errors="*{transactionDate}"></div>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="mb-3">
                                        <label class="form-label required" th:text="#{label.stock-adjustment.currency}">Currency</label>
                                        <div class="row g-2">
                                            <div class="col">
                                                <select class="form-select" th:field="*{currencyId}" th:errorclass="is-invalid">
                                                    <option value="" th:text="#{label.currency.select}">-- Select --</option>
                                                    <option th:each="c : ${currencies}" th:value="${c.id}" th:text="${c.alias}" th:data-rate="${c.id == 1 ? '1.00' : ''}"></option>
                                                </select>
                                            </div>
                                            <div class="col">
                                                <input type="number" step="0.000001" class="form-control" th:field="*{exchangeRate}" placeholder="Rate">
                                            </div>
                                        </div>
                                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('currencyId')}" th:errors="*{currencyId}"></div>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="mb-3">
                                        <label class="form-label" th:text="#{label.stock-adjustment.note}">Note</label>
                                        <textarea class="form-control" th:field="*{note}" rows="2"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title" th:text="#{label.stock-adjustment.lines}">Items</h3>
                            <div class="card-actions">
                                <button type="button" class="btn btn-primary btn-sm" id="btn-add-line">
                                    <i class="ti ti-plus"></i> Add Line
                                </button>
                            </div>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-vcenter card-table" id="table-lines">
                                <thead>
                                    <tr>
                                        <th th:text="#{label.product}">Product</th>
                                        <th th:text="#{label.container}">Container</th>
                                        <th class="w-1" th:text="#{label.product.serialized}">SN</th>
                                        <th class="text-end" th:text="#{label.pagination.entries}">Qty</th>
                                        <th class="text-end" th:text="#{label.stock-adjustment.total.original}">Unit Cost</th>
                                        <th class="w-1"></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="line, stat : *{lines}" class="line-row">
                                        <td>
                                            <input type="hidden" th:field="*{lines[__${stat.index}__].productId}" class="input-product-id">
                                            <input type="text" class="form-control form-control-sm" value="TODO: Autocomplete" readonly>
                                        </td>
                                        <td>
                                            <input type="hidden" th:field="*{lines[__${stat.index}__].containerId}" class="input-container-id">
                                            <input type="text" class="form-control form-control-sm" value="TODO: Autocomplete" readonly>
                                        </td>
                                        <td>
                                            <input type="text" class="form-control form-control-sm" th:field="*{lines[__${stat.index}__].serialNumber}">
                                        </td>
                                        <td>
                                            <input type="number" step="0.0001" class="form-control form-control-sm text-end" th:field="*{lines[__${stat.index}__].quantity}">
                                        </td>
                                        <td>
                                            <input type="number" step="0.0001" class="form-control form-control-sm text-end" th:field="*{lines[__${stat.index}__].unitCost}">
                                        </td>
                                        <td>
                                            <button type="button" class="btn btn-link link-danger btn-remove-line"><i class="ti ti-trash"></i></button>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(stockAdjustment.lines)}" id="empty-row">
                                        <td colspan="6" class="text-center text-secondary">No items added yet.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="card-footer text-end">
                            <a th:href="@{/inventory/adjustments}" class="btn btn-link link-secondary" th:text="#{label.cancel}">Cancel</a>
                            <button type="submit" class="btn btn-primary" th:text="#{label.save}">Save Adjustment</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Script for Dynamic Rows (Simplified for MVP) -->
    <script th:inline="javascript">
        // JavaScript logic here to add/remove rows and handle indexing.
        // In a real ERP, we'd use a more robust JS framework or a custom lookup modal.
    </script>
</body>

</html>
