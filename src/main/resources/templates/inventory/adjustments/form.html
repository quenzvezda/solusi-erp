<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layout/master :: head(#{label.stock-adjustment.title})}"></head>

<body th:replace="~{layout/master :: layout(~{:: .stock-adjustment-form-content}, ~{:: #page-specific-scripts})}">
    <div class="stock-adjustment-form-content">
        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title">
                            <span th:if="${stockAdjustment.id == null}" th:text="#{label.stock-adjustment.add}">Add New Adjustment</span>
                            <span th:if="${stockAdjustment.id != null}" th:text="${stockAdjustment.code}">ADJ-001</span>
                        </h2>
                    </div>
                </div>
            </div>
        </div>

        <div class="page-body" th:with="isLocked=${stockAdjustment.status != null && stockAdjustment.status.name() == 'COMPLETED'}">
            <div class="container-xl">
                
                <form th:action="${stockAdjustment.id == null ? '/inventory/adjustments/create' : '/inventory/adjustments/edit/' + stockAdjustment.id}"
                      th:object="${stockAdjustment}" 
                      method="post" 
                      id="adjustment-form"
                      data-ajax-form="true"
                      data-redirect-on-success="/inventory/adjustments">
                    
                    <div class="alert-container">
                        <div th:replace="~{fragments/alerts :: success}"></div>
                        <div th:replace="~{fragments/alerts :: error}"></div>
                    </div>

                    <div class="card mb-3">
                        <div class="card-body">
                            <div class="row g-3">
                                <div class="col-md-9 border-end">
                                    <div class="row g-3">
                                        <div class="col-md-3">
                                            <div th:replace="~{fragments/inputs :: text(field='code', label=#{label.stock-adjustment.code}, placeholder='AUTO', isReadonly=true)}"></div>
                                        </div>
                                        <div class="col-md-3">
                                            <div th:replace="~{fragments/inputs :: date(field='transactionDate', value=*{transactionDate}, label=#{label.stock-adjustment.date}, isReadonly=${isLocked}, required=true)}"></div>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label required" th:text="#{label.stock-adjustment.currency}">Currency</label>
                                            <div class="row g-2">
                                                <div class="col-7">
                                                    <select class="form-select erp-input" th:field="*{currencyId}" id="header-currency" th:disabled="${isLocked}">
                                                        <option th:each="c : ${currencies}" th:value="${c.id}" th:text="${c.alias}" th:data-alias="${c.alias}"></option>
                                                    </select>
                                                </div>
                                                <div class="col-5">
                                                    <div th:replace="~{fragments/inputs :: decimal(field='exchangeRate', label=null, isReadonly=${isLocked}, id='header-rate')}"></div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div th:replace="~{fragments/inputs :: autocomplete(field='facilityId', label=#{label.facility}, placeholder='', isReadonly=${isLocked}, required=true, id='header-facility', 
                                                initialValue=${stockAdjustment.facilityId}, initialText=${stockAdjustment.facilityName}, initialSubtext=${stockAdjustment.facilityCode})}"></div>
                                        </div>
                                        <div class="col-12">
                                            <label class="form-label" th:text="#{label.stock-adjustment.note}">Note</label>
                                            <textarea class="form-control" th:field="*{note}" rows="2" placeholder="Optional notes..."></textarea>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-3 d-flex flex-column justify-content-center bg-secondary-lt rounded-end">
                                    <div class="px-3 text-center">
                                        <div class="text-uppercase text-secondary font-weight-bold mb-3" style="font-size: 0.65rem; letter-spacing: 0.05em;">Grand Total</div>
                                        <div class="mb-3">
                                            <div class="text-muted mb-1" id="label-recap-original" style="font-size: 0.7rem; text-transform: uppercase;">Total (Original)</div>
                                            <div class="h3 mb-0 font-weight-bold" id="recap-total-original">0.00</div>
                                        </div>
                                        <div class="pt-2 border-top">
                                            <div class="text-muted mb-1" id="label-recap-local" style="font-size: 0.7rem; text-transform: uppercase;" th:text="${'Total (' + (defaultCurrency != null ? defaultCurrency.alias : 'Local') + ')'}">Total (Local)</div>
                                            <div class="h1 mb-0 text-primary font-weight-bold" id="recap-total-local" style="font-size: 1.85rem;">0.00</div>
                                        </div>
                                        <div sec:authorize="hasAuthority('STOCK-ADJUSTMENT_PROCESS')">
                                            <div class="mt-3 pt-3 border-top" th:if="${stockAdjustment.id != null && stockAdjustment.status.name() == 'DRAFT'}">
                                                <button type="button" class="btn btn-success w-100 py-2" id="btn-process-inventory"
                                                        th:data-process-url="@{/inventory/adjustments/process/{id}(id=${stockAdjustment.id})}">
                                                    <i class="ti ti-check me-1"></i> <span th:text="#{label.stock-adjustment.btn.process}">Process to Inventory</span>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title" th:text="#{label.stock-adjustment.lines}">Items</h3>
                            <div class="card-actions" th:if="${stockAdjustment.status == null || stockAdjustment.status.name() != 'COMPLETED'}">
                                <button type="button" class="btn btn-primary btn-sm" id="btn-add-line"><i class="ti ti-plus"></i> Add Line</button>
                            </div>
                        </div>
                        <div class="table-responsive" style="min-height: 250px;">
                            <table class="table table-vcenter card-table" id="table-lines">
                                <thead>
                                    <tr>
                                        <th class="required" th:text="#{label.product}" style="width: 25%;">Product</th>
                                        <th class="required" th:text="#{label.grid}" style="width: 15%;">Grid</th>
                                        <th class="required" th:text="#{label.container}" style="width: 15%;">Bin</th>
                                        <th class="text-end required" th:text="#{label.qty}" style="width: 10%;">Qty</th>
                                        <th class="text-end required" th:text="#{label.price}" style="width: 12%;">Price</th>
                                        <th class="text-end" th:text="#{label.total}" style="width: 13%;">Total</th>
                                        <th class="w-1" style="width: 100px;" th:if="!${isLocked}"></th>
                                    </tr>
                                </thead>
                                <tbody id="line-container">
                                    <tr th:each="line, stat : *{lines}" class="line-row" th:data-index="${stat.index}">
                                        <td>
                                            <div th:replace="~{fragments/inputs :: table-autocomplete(name='lines[' + __${stat.index}__ + '].productId', id='select-product-' + __${stat.index}__, isReadonly=${isLocked}, extraClass='select-product', 
                                                initialValue=${line.productId}, initialText=${line.productName}, initialSubtext=${line.productCode})}"></div>
                                            <input type="hidden" th:field="*{lines[__${stat.index}__].uomId}" class="input-uom-id">
                                            <input type="hidden" th:field="*{lines[__${stat.index}__].conversionFactor}" class="input-uom-factor">
                                            <input type="hidden" class="input-uom-alias" th:value="${line.uomName}">
                                            <input type="hidden" class="input-serialized" th:value="${line.isSerialized}">
                                            <input type="hidden" th:field="*{lines[__${stat.index}__].serialNumber}" class="input-sn-single">
                                        </td>
                                        <td><div th:replace="~{fragments/inputs :: table-autocomplete(name='lines[' + __${stat.index}__ + '].gridId', isReadonly=${isLocked}, extraClass='select-grid', initialValue=${line.gridId}, initialText=${line.gridName}, initialSubtext=${line.gridCode})}"></div></td>
                                        <td><div th:replace="~{fragments/inputs :: table-autocomplete(name='lines[' + __${stat.index}__ + '].containerId', isReadonly=${isLocked}, extraClass='select-container', initialValue=${line.containerId}, initialText=${line.containerName}, initialSubtext=${line.containerCode})}"></div></td>
                                        <td><input type="text" th:name="'lines[' + ${stat.index} + '].quantity'" th:value="${line.quantity}" class="form-control form-control-sm erp-input-sm erp-number-decimal text-end input-qty" readonly></td>
                                        <td><input type="text" th:name="'lines[' + ${stat.index} + '].unitCost'" th:value="${line.unitCost}" class="form-control form-control-sm erp-input-sm erp-number-decimal text-end input-price" th:readonly="${isLocked}"></td>
                                        <td class="text-end font-weight-medium line-total">0.00</td>
                                        <td th:if="!${isLocked}">
                                            <div class="btn-list flex-nowrap">
                                                <button type="button" class="btn btn-white btn-icon btn-edit-detail" title="Edit Detail / Qty"><i class="ti ti-pencil"></i></button>
                                                <button type="button" class="btn btn-white btn-icon btn-remove-line text-danger" title="Remove"><i class="ti ti-trash"></i></button>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                            <div id="empty-msg" class="text-center py-4 text-secondary" th:style="${#lists.isEmpty(stockAdjustment.lines)} ? '' : 'display:none'">No items added yet. Click "Add Line" to start.</div>
                        </div>
                        <div class="card-footer text-end border-top-0">
                            <div class="small text-secondary mb-2"><i class="ti ti-info-circle"></i> Tip: Click the pencil icon to set quantity and UoM.</div>
                            <div class="d-flex align-items-center">
                                <a th:href="@{/inventory/adjustments}" class="btn btn-link link-secondary" th:text="#{label.cancel}">Cancel</a>
                                <button type="submit" class="btn btn-primary ms-auto" th:text="#{label.save}">Save Adjustment</button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <table style="display:none">
            <tbody id="row-template-source">
                <tr class="line-row">
                    <td>
                        <div th:replace="~{fragments/inputs :: table-autocomplete(name='lines[INDEX].productId', id='', isReadonly=false, extraClass='select-product')}"></div>
                        <input type="hidden" name="lines[INDEX].uomId" class="input-uom-id"><input type="hidden" name="lines[INDEX].conversionFactor" class="input-uom-factor" value="1.00">
                        <input type="hidden" class="input-uom-alias"><input type="hidden" class="input-serialized"><input type="hidden" name="lines[INDEX].serialNumber" class="input-sn-single">
                    </td>
                    <td><div th:replace="~{fragments/inputs :: table-autocomplete(name='lines[INDEX].gridId', id='', isReadonly=false, extraClass='select-grid')}"></div></td>
                    <td><div th:replace="~{fragments/inputs :: table-autocomplete(name='lines[INDEX].containerId', id='', isReadonly=false, extraClass='select-container')}"></div></td>
                    <td><input type="text" name="lines[INDEX].quantity" class="form-control form-control-sm erp-input-sm erp-number-decimal text-end input-qty" value="0.00" readonly></td>
                    <td><input type="text" name="lines[INDEX].unitCost" class="form-control form-control-sm erp-input-sm erp-number-decimal text-end input-price" value="0.00"></td>
                    <td class="text-end font-weight-medium line-total">0.00</td>
                    <td><div class="btn-list flex-nowrap"><button type="button" class="btn btn-white btn-icon btn-edit-detail"><i class="ti ti-pencil"></i></button><button type="button" class="btn btn-white btn-icon btn-remove-line text-danger"><i class="ti ti-trash"></i></button></div></td>
                </tr>
            </tbody>
        </table>

        <div th:replace="~{inventory/adjustments/drawer-fragments :: adjustment-drawers}"></div>
    </div>

    <div id="page-specific-scripts" th:fragment="pageScripts">
        <script th:inline="javascript">
            window.StockAdjustmentPageConfig = {
                msgSelectFirst: /*[[#{msg.error.please_select_first}]]*/ 'Please select {0} first!',
                labelFacility: /*[[#{label.facility}]]*/ 'Facility',
                confirmChangeFacility: 'Changing the facility will remove all existing items. Proceed?',
                processConfirm: /*[[#{label.stock-adjustment.process.confirm}]]*/ 'Are you sure?',
                isLocked: /*[[${isLocked}]]*/ false
            };
        </script>
        <script th:src="@{/js/inventory/adjustment/stock-adjustment-form.js}" defer></script>
    </div>
</body>
</html>
