<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layout/master :: head(#{label.stock-adjustment.title})}"></head>

<body th:replace="~{layout/master :: layout(~{:: .stock-adjustment-form-content})}">
    <div class="stock-adjustment-form-content">
        <style>
            /* Force TomSelect consistency */
            .ts-wrapper, .ts-control, .ts-control input {
                width: 100% !important;
            }
            .ts-wrapper.sm .ts-control {
                padding: 0.2rem 0.4rem !important;
                min-height: calc(1.4em + 0.4rem + 2px) !important;
            }
            .line-row td {
                vertical-align: top;
                padding: 0.3rem 0.15rem !important;
            }
            /* Ultra-tight table layout */
            #table-lines {
                table-layout: fixed;
                width: 100%;
                font-size: 0.85rem;
            }
            #table-lines th {
                padding: 0.4rem 0.15rem !important;
                font-size: 0.65rem;
                text-transform: uppercase;
                letter-spacing: .02em;
                color: #626976;
            }
            .form-control-sm {
                padding: 0.2rem 0.4rem;
            }
            /* Hide number spinners */
            input::-webkit-outer-spin-button,
            input::-webkit-inner-spin-button {
                -webkit-appearance: none;
                margin: 0;
            }
            input[type=number] {
                -moz-appearance: textfield;
            }
            /* Recap Styling */
            .recap-label { color: #626976 !important; font-weight: 500; }
            .recap-value-secondary { color: #1d273b !important; font-size: 1.2rem; font-weight: 700; }
        </style>

        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title" th:text="${stockAdjustment.id == null ? #messages.msg('label.stock-adjustment.add') : #messages.msg('label.stock-adjustment.edit')}">
                            Add New Adjustment
                        </h2>
                    </div>
                </div>
            </div>
        </div>

        <div class="page-body" th:with="isLocked=${stockAdjustment.status != null && stockAdjustment.status.name() == 'COMPLETED'}">
            <div class="container-xl">
                <form th:action="${stockAdjustment.id == null ? '/inventory/adjustments/create' : '/inventory/adjustments/' + stockAdjustment.id + '/edit'}"
                      th:object="${stockAdjustment}" method="post" id="adjustment-form">
                    
                    <div class="card mb-3">
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-9 border-end">
                                    <div class="row g-3">
                                        <div class="col-md-3">
                                            <label class="form-label" th:text="#{label.stock-adjustment.code}">No. Adj</label>
                                            <input type="text" class="form-control bg-light" th:field="*{code}" readonly placeholder="AUTO">
                                        </div>
                                        <div class="col-md-3">
                                            <label class="form-label required" th:text="#{label.stock-adjustment.date}">Date</label>
                                            <!-- Force ISO format for date input compatibility -->
                                            <input type="date" class="form-control" 
                                                   th:value="${stockAdjustment.transactionDate != null ? #temporals.format(stockAdjustment.transactionDate, 'yyyy-MM-dd') : #calendars.format(#calendars.createNow(), 'yyyy-MM-dd')}"
                                                   name="transactionDate"
                                                   th:errorclass="is-invalid"
                                                   th:readonly="${isLocked}">
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label required" th:text="#{label.stock-adjustment.currency}">Currency</label>
                                            <div class="row g-2">
                                                <div class="col-7">
                                                    <select class="form-select" th:field="*{currencyId}" id="header-currency" th:disabled="${isLocked}">
                                                        <option th:each="c : ${currencies}" th:value="${c.id}" th:text="${c.alias}" th:data-alias="${c.alias}"></option>
                                                    </select>
                                                </div>
                                                <div class="col-5">
                                                    <div class="input-group">
                                                        <span class="input-group-text">Rate</span>
                                                        <input type="number" step="0.01" class="form-control text-end" th:field="*{exchangeRate}" id="header-rate" th:readonly="${isLocked}">
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label required" th:text="#{label.facility}">Facility</label>
                                            <select class="form-select" th:field="*{facilityId}" id="header-facility" th:disabled="${isLocked}">
                                                <option value=""></option>
                                                <option th:if="${stockAdjustment.facilityId != null}" 
                                                        th:value="${stockAdjustment.facilityId}" 
                                                        th:text="${stockAdjustment.facilityName}" 
                                                        th:attr="data-subtext=${stockAdjustment.facilityCode}"
                                                        selected></option>
                                            </select>
                                        </div>
                                        <div class="col-12">
                                            <label class="form-label" th:text="#{label.stock-adjustment.note}">Note</label>
                                            <textarea class="form-control" th:field="*{note}" rows="2" placeholder="Optional notes..."></textarea>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-3 d-flex flex-column justify-content-center bg-light-lt">
                                    <div class="px-3 text-center">
                                        <div class="text-uppercase text-secondary font-weight-bold mb-2">Grand Total</div>
                                        <div class="mb-3">
                                            <div class="small recap-label" id="label-recap-original">Total (Original)</div>
                                            <div class="recap-value-secondary" id="recap-total-original">0.00</div>
                                        </div>
                                        <div>
                                            <div class="small recap-label" id="label-recap-local" th:text="${'Total (' + (defaultCurrency != null ? defaultCurrency.alias : 'Local') + ')'}">Total (Local)</div>
                                            <div class="h1 font-weight-bold text-primary mb-0" id="recap-total-local">0.00</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title" th:text="#{label.stock-adjustment.lines}">Items</h3>
                            <div class="card-actions" th:if="!${isLocked}">
                                <button type="button" class="btn btn-primary btn-sm" id="btn-add-line"><i class="ti ti-plus"></i> Add Line</button>
                            </div>
                        </div>
                        <div class="table-responsive" style="min-height: 250px; overflow-x: hidden;">
                            <table class="table table-vcenter card-table" id="table-lines">
                                <thead>
                                    <tr>
                                        <th th:text="#{label.product}" style="width: 26%;">Product</th>
                                        <th th:text="#{label.grid}" style="width: 14%;">Grid</th>
                                        <th th:text="#{label.container}" style="width: 14%;">Bin</th>
                                        <th th:text="#{label.product.serialized}" style="width: 12%;">SN</th>
                                        <th class="text-end" style="width: 7%;">Qty</th>
                                        <th class="text-end" style="width: 11%;">Price</th>
                                        <th class="text-end" style="width: 13%;">Total</th>
                                        <th class="w-1" style="width: 30px;" th:if="!${isLocked}"></th>
                                    </tr>
                                </thead>
                                <tbody id="line-container">
                                    <tr th:each="line, stat : *{lines}" class="line-row">
                                        <td><select th:field="*{lines[__${stat.index}__].productId}" class="select-product" required th:disabled="${isLocked}"><option th:if="${line.productId != null}" th:value="${line.productId}" th:text="${line.productName}" th:attr="data-subtext=${line.productCode}"></option></select></td>
                                        <td><select th:field="*{lines[__${stat.index}__].gridId}" class="select-grid" required th:disabled="${isLocked}"><option th:if="${line.gridId != null}" th:value="${line.gridId}" th:text="${line.gridName}" th:attr="data-subtext=${line.gridCode}"></option></select></td>
                                        <td><select th:field="*{lines[__${stat.index}__].containerId}" class="select-container" required th:disabled="${isLocked}"><option th:if="${line.containerId != null}" th:value="${line.containerId}" th:text="${line.containerName}" th:attr="data-subtext=${line.containerCode}"></option></select></td>
                                        <td><input type="text" class="form-control form-control-sm" th:field="*{lines[__${stat.index}__].serialNumber}" th:readonly="${isLocked}"></td>
                                        <td><input type="number" step="0.01" class="form-control form-control-sm text-end input-qty" 
                                                   th:name="${'lines[' + stat.index + '].quantity'}"
                                                   th:value="${line.quantity != null ? #numbers.formatDecimal(line.quantity, 1, 2) : '0.00'}" 
                                                   required th:readonly="${isLocked}"></td>
                                        <td><input type="number" step="0.01" class="form-control form-control-sm text-end input-price" 
                                                   th:name="${'lines[' + stat.index + '].unitCost'}"
                                                   th:value="${line.unitCost != null ? #numbers.formatDecimal(line.unitCost, 1, 2) : '0.00'}" 
                                                   required th:readonly="${isLocked}"></td>
                                        <td class="text-end font-weight-medium line-total">0.00</td>
                                        <td th:if="!${isLocked}"><button type="button" class="btn btn-link link-danger btn-remove-line p-0"><i class="ti ti-trash"></i></button></td>
                                    </tr>
                                </tbody>
                            </table>
                            <div id="empty-msg" class="text-center py-4 text-secondary" th:style="${#lists.isEmpty(stockAdjustment.lines)} ? '' : 'display:none'">No items added yet. Click "Add Line" to start.</div>
                        </div>
                        <div class="card-footer text-end">
                            <a th:href="@{/inventory/adjustments}" class="btn btn-link link-secondary" th:text="#{label.cancel}">Cancel</a>
                            <button type="submit" class="btn btn-primary" th:text="#{label.save}">Save Adjustment</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <table style="display:none"><tbody id="row-template-source"><tr class="line-row"><td><select name="lines[INDEX].productId" class="select-product" required></select></td><td><select name="lines[INDEX].gridId" class="select-grid" required></select></td><td><select name="lines[INDEX].containerId" class="select-container" required></select></td><td><input type="text" name="lines[INDEX].serialNumber" class="form-control form-control-sm"></td><td><input type="number" step="0.01" name="lines[INDEX].quantity" class="form-control form-control-sm text-end input-qty" value="0.00" required></td><td><input type="number" step="0.01" name="lines[INDEX].unitCost" class="form-control form-control-sm text-end input-price" value="0.00" required></td><td class="text-end font-weight-medium line-total">0.00</td><td><button type="button" class="btn btn-link link-danger btn-remove-line p-0"><i class="ti ti-trash"></i></button></td></tr></tbody></table>

        <script th:inline="javascript">
            window.addEventListener('load', function() {
                const lineContainer = document.getElementById('line-container');
                const btnAddLine = document.getElementById('btn-add-line');
                const rowTemplateSource = document.getElementById('row-template-source');
                const headerFacility = document.getElementById('header-facility');
                const headerCurrency = document.getElementById('header-currency');
                const headerRate = document.getElementById('header-rate');
                const recapOriginal = document.getElementById('recap-total-original');
                const recapLocal = document.getElementById('recap-total-local');
                const labelRecapOriginal = document.getElementById('label-recap-original');

                const LOOKUP_BASE = '/api/lookup/inventory';
                const msgSelectFirst = /*[[#{msg.error.please_select_first}]]*/ 'Please select {0} first!';
                const labelFacility = /*[[#{label.facility}]]*/ 'Facility';

                function debounce(fn, delay) {
                    let timer;
                    return function (...args) {
                        clearTimeout(timer);
                        timer = setTimeout(() => fn.apply(this, args), delay);
                    };
                }

                function lookupAutoFill(data, mapping) {
                    if (!data || !data.payload) return;
                    Object.keys(mapping).forEach(key => {
                        const target = mapping[key];
                        const val = data.payload[key];
                        if (val !== undefined && target) {
                            if (typeof target.setValue === 'function' && typeof target.addOption === 'function') {
                                if (key === 'parentId' && data.payload.parentName) {
                                    target.addOption({id: val, name: data.payload.parentName});
                                }
                                target.setValue(val);
                            } else {
                                target.value = val;
                            }
                        }
                    });
                }

                function formatDecimalInput(input) {
                    const val = parseFloat(input.value);
                    if (!isNaN(val)) {
                        input.value = val.toFixed(2);
                    }
                }

                function initLookup(el, type, parentProvider = null) {
                    if (!el) return null;
                    if (el.tomselect) el.tomselect.destroy();
                    
                    const ts = new TomSelect(el, {
                        valueField: 'id',
                        labelField: 'name',
                        searchField: ['name'],
                        placeholder: '-- Select --',
                        allowEmptyOption: false,
                        preload: 'focus', 
                        dropdownParent: 'body',
                        onInitialize: function() {
                            this.control.classList.add('form-control-sm');
                            this.control.style.width = '100%';
                            
                            // Map data-subtext from initial option if exists
                            const initialOption = el.querySelector('option[selected], option[value]:not([value=""])');
                            if (initialOption) {
                                const val = initialOption.value;
                                const subText = initialOption.getAttribute('data-subtext');
                                if (subText && this.options[val]) {
                                    this.options[val].subText = subText;
                                    this.refreshOptions(false);
                                }
                            }
                        },
                        load: debounce(function(q, callback) {
                            let url = `${LOOKUP_BASE}/${type}?q=${encodeURIComponent(q)}&limit=10`;
                            if (parentProvider) {
                                const parent = parentProvider();
                                if (parent.type === 'facility' && parent.id) url += `&facilityId=${parent.id}`;
                                if (parent.type === 'grid' && parent.id) url += `&gridId=${parent.id}`;
                            }
                            fetch(url).then(r => r.json()).then(callback).catch(() => callback([]));
                        }, 150),
                        render: {
                            option: (data, escape) => {
                                if (!data.id) return '';
                                let sub = data.subText ? `<small class="text-muted d-block" style="font-size:0.75em">${escape(data.subText)}</small>` : '';
                                return `<div class="py-1"><div>${escape(data.name)}</div>${sub}</div>`;
                            },
                            item: (data, escape) => {
                                return `<span>${escape(data.name)}</span>`;
                            }
                        }
                    });

                    if (parentProvider) {
                        ts.on('dropdown_open', () => {
                            ts.clearOptions();
                            ts.refreshOptions(false);
                        });
                    }

                    return ts;
                }

                const tsFacility = initLookup(headerFacility, 'facilities');
                const tsCurrency = new TomSelect(headerCurrency, { onInitialize: function() { this.control.style.width = '100%'; } });

                tsFacility.on('change', () => {
                    lineContainer.querySelectorAll('.line-row:not(.child-row)').forEach(row => {
                        if (row.querySelector('.select-grid').tomselect) row.querySelector('.select-grid').tomselect.clear();
                        if (row.querySelector('.select-container').tomselect) row.querySelector('.select-container').tomselect.clear();
                    });
                });

                function updateCurrencyLabel() {
                    if (headerCurrency.value) {
                        const opt = headerCurrency.options[headerCurrency.selectedIndex];
                        const alias = opt.getAttribute('data-alias') || opt.text;
                        labelRecapOriginal.textContent = `Total (${alias})`;
                    }
                }

                tsCurrency.on('change', () => {
                    updateCurrencyLabel();
                    calculateTotals();
                });

                function syncChildRows(parentRow) {
                    if (!parentRow.classList.contains('parent-row')) return;
                    
                    const qty = parseInt(parentRow.querySelector('.input-qty').value) || 0;
                    const productId = parentRow.querySelector('.select-product').value || '';
                    const gridId = parentRow.querySelector('.select-grid').value || '';
                    const containerId = parentRow.querySelector('.select-container').value || '';
                    const unitCostRaw = parseFloat(parentRow.querySelector('.input-price').value) || 0;
                    const unitCost = unitCostRaw.toFixed(2);
                    
                    let nextEl = parentRow.nextElementSibling;
                    let existingChildren = [];
                    while (nextEl && nextEl.classList.contains('child-row')) {
                        existingChildren.push(nextEl);
                        nextEl = nextEl.nextElementSibling;
                    }
                    
                    if (existingChildren.length > qty) {
                        for (let i = qty; i < existingChildren.length; i++) {
                            existingChildren[i].remove();
                        }
                        existingChildren = existingChildren.slice(0, qty);
                    } else if (existingChildren.length < qty) {
                        for (let i = existingChildren.length; i < qty; i++) {
                            const tr = document.createElement('tr');
                            tr.className = 'line-row child-row bg-light-lt';
                            tr.innerHTML = `
                                <td colspan="3" class="text-end text-muted align-middle pe-2" style="font-size: 0.75rem;">
                                    <i class="ti ti-corner-down-right"></i> Serial Item
                                    <input type="hidden" class="child-product" value="${productId}">
                                    <input type="hidden" class="child-grid" value="${gridId}">
                                    <input type="hidden" class="child-container" value="${containerId}">
                                </td>
                                <td><input type="text" class="form-control form-control-sm child-sn" placeholder="Serial Number" required></td>
                                <td><input type="number" step="0.01" class="form-control form-control-sm text-end input-qty child-qty" value="1.00" required></td>
                                <td><input type="number" step="0.01" class="form-control form-control-sm text-end input-price child-price" value="${unitCost}" required></td>
                                <td class="text-end font-weight-medium line-total">0.00</td>
                                <td><button type="button" class="btn btn-link link-danger btn-remove-child p-0"><i class="ti ti-trash"></i></button></td>
                            `;
                            
                            const qInput = tr.querySelector('.input-qty');
                            const pInput = tr.querySelector('.input-price');
                            qInput.addEventListener('blur', () => formatDecimalInput(qInput));
                            pInput.addEventListener('blur', () => formatDecimalInput(pInput));
                            
                            const insertAfter = existingChildren.length > 0 ? existingChildren[existingChildren.length - 1] : parentRow;
                            insertAfter.parentNode.insertBefore(tr, insertAfter.nextSibling);
                            existingChildren.push(tr);
                        }
                    }
                    
                    existingChildren.forEach(child => {
                        child.querySelector('.child-product').value = productId;
                        child.querySelector('.child-grid').value = gridId;
                        child.querySelector('.child-container').value = containerId;
                    });
                    
                    updateIndexes();
                    calculateTotals();
                }

                function setupRowLogic(row) {
                    if (row.classList.contains('child-row')) return;

                    const tsProduct = initLookup(row.querySelector('.select-product'), 'products');
                    const tsGrid = initLookup(row.querySelector('.select-grid'), 'grids', () => ({ type: 'facility', id: headerFacility.value }));
                    const tsContainer = initLookup(row.querySelector('.select-container'), 'containers', () => {
                        const gId = tsGrid.getValue();
                        return gId ? { type: 'grid', id: gId } : { type: 'facility', id: headerFacility.value };
                    });

                    const qInput = row.querySelector('.input-qty');
                    const pInput = row.querySelector('.input-price');

                    qInput.addEventListener('blur', () => formatDecimalInput(qInput));
                    pInput.addEventListener('blur', () => formatDecimalInput(pInput));
                    
                    formatDecimalInput(qInput);
                    formatDecimalInput(pInput);

                    let isAutoSetting = false;

                    tsProduct.on('change', function(val) {
                        if (val) {
                            const data = tsProduct.options[val];
                            const isSerialized = data && data.payload && data.payload.isSerialized;
                            const snInput = row.querySelector('input[name$=".serialNumber"], input[data-name="serialNumber"]');
                            
                            // Reset quantity on product change
                            qInput.value = '0.00';
                            
                            if (isSerialized) {
                                row.classList.add('parent-row');
                                if (snInput) {
                                    snInput.value = '';
                                    snInput.parentElement.style.visibility = 'hidden';
                                }
                                syncChildRows(row);
                            } else {
                                if (row.classList.contains('parent-row')) {
                                    row.classList.remove('parent-row');
                                    let nextEl = row.nextElementSibling;
                                    while (nextEl && nextEl.classList.contains('child-row')) {
                                        const toRemove = nextEl;
                                        nextEl = nextEl.nextElementSibling;
                                        toRemove.remove();
                                    }
                                    if (snInput) {
                                        snInput.parentElement.style.visibility = 'visible';
                                        snInput.placeholder = '';
                                    }
                                    updateIndexes();
                                    calculateTotals();
                                }
                            }
                        }
                    });

                    qInput.addEventListener('input', () => syncChildRows(row));

                    pInput.addEventListener('input', () => {
                        if (row.classList.contains('parent-row')) {
                            const newPrice = pInput.value;
                            let nextEl = row.nextElementSibling;
                            while (nextEl && nextEl.classList.contains('child-row')) {
                                nextEl.querySelector('.child-price').value = newPrice;
                                formatDecimalInput(nextEl.querySelector('.child-price'));
                                nextEl = nextEl.nextElementSibling;
                            }
                            calculateTotals();
                        }
                    });

                    tsGrid.on('change', () => {
                        if (!isAutoSetting) {
                            tsContainer.clear();
                            tsContainer.clearOptions();
                        }
                        syncChildRows(row);
                    });

                    tsContainer.on('change', function(val) {
                        if (val && !isAutoSetting) {
                            const data = tsContainer.options[val];
                            if (data && data.payload && data.payload.parentId && tsGrid.getValue() != data.payload.parentId) {
                                isAutoSetting = true;
                                lookupAutoFill(data, { 'parentId': tsGrid });
                                setTimeout(() => { isAutoSetting = false; }, 100);
                            }
                        }
                        syncChildRows(row);
                    });
                }

                if (btnAddLine) {
                    btnAddLine.onclick = function() {
                        if (!headerFacility.value) {
                            alert(msgSelectFirst.replace('{0}', labelFacility));
                            return;
                        }
                        const index = lineContainer.querySelectorAll('.line-row:not(.parent-row)').length;
                        let html = rowTemplateSource.innerHTML.replace(/INDEX/g, index);
                        const temp = document.createElement('tbody');
                        temp.innerHTML = html;
                        const row = temp.querySelector('tr');
                        lineContainer.appendChild(row);
                        setupRowLogic(row);
                        updateIndexes();
                    };
                }

                function updateIndexes() {
                    let index = 0;
                    lineContainer.querySelectorAll('.line-row').forEach(row => {
                        if (row.classList.contains('parent-row')) {
                            row.querySelectorAll('input, select').forEach(input => {
                                if (input.name) {
                                    input.dataset.name = input.name.replace(/lines\[\d+\]\./, '');
                                    input.removeAttribute('name');
                                }
                            });
                        } else {
                            if (row.classList.contains('child-row')) {
                                row.querySelector('.child-product').name = `lines[${index}].productId`;
                                row.querySelector('.child-grid').name = `lines[${index}].gridId`;
                                row.querySelector('.child-container').name = `lines[${index}].containerId`;
                                row.querySelector('.child-sn').name = `lines[${index}].serialNumber`;
                                row.querySelector('.child-qty').name = `lines[${index}].quantity`;
                                row.querySelector('.child-price').name = `lines[${index}].unitCost`;
                            } else {
                                row.querySelectorAll('input, select').forEach(input => {
                                    let propName = input.dataset.name || (input.name ? input.name.replace(/lines\[\d+\]\./, '') : null);
                                    if (propName) {
                                        input.name = `lines[${index}].${propName}`;
                                    }
                                });
                            }
                            index++;
                        }
                    });
                    if (document.getElementById('empty-msg')) {
                        document.getElementById('empty-msg').style.display = lineContainer.children.length > 0 ? 'none' : '';
                    }
                }

                function calculateTotals() {
                    let total = 0;
                    const rate = parseFloat(headerRate.value) || 1;
                    lineContainer.querySelectorAll('.line-row').forEach(row => {
                        if (row.classList.contains('parent-row')) {
                            row.querySelector('.line-total').textContent = '0.00';
                            return;
                        }
                        const q = parseFloat(row.querySelector('.input-qty').value) || 0;
                        const p = parseFloat(row.querySelector('.input-price').value) || 0;
                        const sub = q * p;
                        row.querySelector('.line-total').textContent = sub.toLocaleString(undefined, {minimumFractionDigits: 2});
                        total += sub;
                    });
                    recapOriginal.textContent = total.toLocaleString(undefined, {minimumFractionDigits: 2});
                    recapLocal.textContent = (total * rate).toLocaleString(undefined, {minimumFractionDigits: 2});
                }

                function autoGroupEditMode() {
                    let parentRow = null;
                    let parentProductId = null;
                    let parentGridId = null;
                    let parentContainerId = null;
                    
                    const rows = Array.from(lineContainer.querySelectorAll('.line-row'));
                    
                    rows.forEach(row => {
                        const productId = row.querySelector('.select-product').value;
                        const gridId = row.querySelector('.select-grid').value;
                        const containerId = row.querySelector('.select-container').value;
                        const snInput = row.querySelector('input[name$=".serialNumber"]');
                        const serialNumber = snInput ? snInput.value : '';
                        
                        if (serialNumber && serialNumber.trim() !== '') {
                            if (!parentRow || parentProductId !== productId || parentGridId !== gridId || parentContainerId !== containerId) {
                                parentRow = row.cloneNode(true);
                                parentRow.classList.add('parent-row');
                                
                                const parentSnInput = parentRow.querySelector('input[name$=".serialNumber"]');
                                if (parentSnInput) {
                                    parentSnInput.value = '';
                                    parentSnInput.parentElement.style.visibility = 'hidden';
                                }
                                
                                parentRow.querySelector('.input-qty').value = '0';
                                row.parentNode.insertBefore(parentRow, row);
                                
                                parentProductId = productId;
                                parentGridId = gridId;
                                parentContainerId = containerId;
                            }
                            
                            const parentQtyInput = parentRow.querySelector('.input-qty');
                            const currentLineQty = parseFloat(row.querySelector('.input-qty').value) || 0;
                            parentQtyInput.value = (parseFloat(parentQtyInput.value) + currentLineQty).toFixed(2);
                            
                            const tds = row.querySelectorAll('td');
                            tds[0].colSpan = 3;
                            tds[0].className = "text-end text-muted align-middle pe-2";
                            tds[0].style.fontSize = "0.75rem";
                            tds[0].innerHTML = `
                                <i class="ti ti-corner-down-right"></i> Serial Item
                                <input type="hidden" class="child-product" value="${productId}">
                                <input type="hidden" class="child-grid" value="${gridId}">
                                <input type="hidden" class="child-container" value="${containerId}">
                            `;
                            tds[1].remove();
                            tds[2].remove();
                            
                            row.classList.add('child-row', 'bg-light-lt');
                            if(snInput) snInput.classList.add('child-sn');
                            
                            const qtyInput = row.querySelector('.input-qty');
                            qtyInput.classList.add('child-qty');
                            qtyInput.value = currentLineQty.toFixed(2);

                            const priceInput = row.querySelector('.input-price');
                            priceInput.classList.add('child-price');
                            priceInput.value = parseFloat(priceInput.value || 0).toFixed(2);
                        } else {
                            parentRow = null;
                        }
                    });
                }

                autoGroupEditMode();

                lineContainer.addEventListener('input', calculateTotals);
                headerRate.addEventListener('input', calculateTotals);
                lineContainer.addEventListener('click', e => {
                    if (e.target.closest('.btn-remove-line')) {
                        const row = e.target.closest('.line-row');
                        if (row.classList.contains('parent-row')) {
                            let nextEl = row.nextElementSibling;
                            while (nextEl && nextEl.classList.contains('child-row')) {
                                const toRemove = nextEl;
                                nextEl = nextEl.nextElementSibling;
                                toRemove.remove();
                            }
                        }
                        row.remove();
                        updateIndexes();
                        calculateTotals();
                    } else if (e.target.closest('.btn-remove-child')) {
                        const childRow = e.target.closest('.child-row');
                        let prevEl = childRow.previousElementSibling;
                        while (prevEl && !prevEl.classList.contains('parent-row') && !prevEl.classList.contains('line-row')) {
                            prevEl = prevEl.previousElementSibling;
                        }
                        if (prevEl && prevEl.classList.contains('parent-row')) {
                            const qtyInput = prevEl.querySelector('.input-qty');
                            let currentQty = parseFloat(qtyInput.value) || 0;
                            if (currentQty > 0) {
                                qtyInput.value = (currentQty - 1).toFixed(2);
                            }
                        }
                        childRow.remove();
                        updateIndexes();
                        calculateTotals();
                    }
                });

                lineContainer.querySelectorAll('.line-row:not(.child-row)').forEach(setupRowLogic);
                
                headerRate.addEventListener('blur', () => formatDecimalInput(headerRate));
                formatDecimalInput(headerRate);

                updateIndexes();
                calculateTotals();
                updateCurrencyLabel();

                /*[# th:if="${isLocked}"]*/
                tsFacility.disable();
                tsCurrency.disable();
                document.querySelectorAll('.line-row:not(.child-row)').forEach(row => {
                    const tsProduct = row.querySelector('.select-product')?.tomselect;
                    const tsGrid = row.querySelector('.select-grid')?.tomselect;
                    const tsContainer = row.querySelector('.select-container')?.tomselect;
                    if (tsProduct) tsProduct.disable();
                    if (tsGrid) tsGrid.disable();
                    if (tsContainer) tsContainer.disable();
                });
                const btnSave = document.querySelector('button[type="submit"]');
                if (btnSave) btnSave.disabled = true;
                /*[/]*/
            });
        </script>
    </div>
</body>
</html>
