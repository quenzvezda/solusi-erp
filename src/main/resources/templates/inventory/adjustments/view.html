<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layout/master :: head(#{label.stock-adjustment.title})}"></head>

<body th:replace="~{layout/master :: layout(~{:: .stock-adjustment-view-content})}">
    <div class="stock-adjustment-view-content">
        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title" th:text="${stockAdjustment.code}">ADJ-001</h2>
                        <div class="text-secondary mt-1">
                            <span class="badge" 
                                  th:classappend="${stockAdjustment.status.name() == 'DRAFT' ? 'bg-secondary' : 'bg-success'}"
                                  th:text="${stockAdjustment.status}">STATUS</span>
                        </div>
                    </div>
                    <div class="col-auto ms-auto d-print-none">
                        <div class="btn-list">
                            <a th:if="${stockAdjustment.status.name() == 'DRAFT'}"
                               th:href="@{/inventory/adjustments/{id}/edit(id=${stockAdjustment.id})}"
                               class="btn btn-white">
                                <i class="ti ti-edit"></i> Edit
                            </a>
                            <form th:if="${stockAdjustment.status.name() == 'DRAFT'}"
                                  th:action="@{/inventory/adjustments/{id}/process(id=${stockAdjustment.id})}"
                                  method="post"
                                  onsubmit="return confirm(this.getAttribute('data-confirm'))"
                                  th:data-confirm="#{label.stock-adjustment.process.confirm}">
                                <button type="submit" class="btn btn-success" sec:authorize="hasAuthority('STOCK-ADJUSTMENT_PROCESS')">
                                    <i class="ti ti-check"></i> <span th:text="#{label.stock-adjustment.btn.process}">Process</span>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="page-body">
            <div class="container-xl">
                <div class="row row-cards">
                    <div class="col-md-8">
                        <div class="card">
                            <div class="card-header">
                                <h3 class="card-title" th:text="#{label.stock-adjustment.lines}">Items</h3>
                            </div>
                            <div class="table-responsive">
                                <table class="table table-vcenter card-table">
                                    <thead>
                                        <tr>
                                            <th th:text="#{label.product}">Product</th>
                                            <th th:text="#{label.container}">Container</th>
                                            <th th:text="#{label.product.serialized}">SN</th>
                                            <th class="text-end" th:text="#{label.pagination.entries}">Qty</th>
                                            <th class="text-end" th:text="#{label.stock-adjustment.total.original}">Unit Cost</th>
                                            <th class="text-end">Total</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="line : ${stockAdjustment.lines}">
                                            <td>
                                                <div th:text="${line.productCode}">CODE</div>
                                                <div class="text-secondary small" th:text="${line.productName}">Name</div>
                                            </td>
                                            <td>
                                                <div th:text="${line.containerCode}">BIN</div>
                                                <div class="text-secondary small" th:text="${line.facilityName}">Facility</div>
                                            </td>
                                            <td th:text="${line.serialNumber ?: '-'}">-</td>
                                            <td class="text-end" th:text="${#numbers.formatDecimal(line.quantity, 1, 'COMMA', 2, 'POINT')}">0</td>
                                            <td class="text-end" th:text="${#numbers.formatDecimal(line.unitCost, 1, 'COMMA', 2, 'POINT')}">0.00</td>
                                            <td class="text-end font-weight-medium" th:text="${#numbers.formatDecimal(line.totalAmount, 1, 'COMMA', 2, 'POINT')}">0.00</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card mb-3">
                            <div class="card-header">
                                <h3 class="card-title">Summary</h3>
                            </div>
                            <div class="card-body">
                                <div class="mb-3">
                                    <label class="form-label" th:text="#{label.stock-adjustment.date}">Date</label>
                                    <div class="form-control-plaintext" th:text="${#temporals.format(stockAdjustment.transactionDate, 'dd MMM yyyy')}">Date</div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" th:text="#{label.stock-adjustment.currency}">Currency</label>
                                    <div class="form-control-plaintext">
                                        <span th:text="${stockAdjustment.currencyAlias}">USD</span>
                                        (Rate: <span th:text="${#numbers.formatDecimal(stockAdjustment.exchangeRate, 1, 'COMMA', 2, 'POINT')}">1.00</span>)
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" th:text="#{label.stock-adjustment.total.local}">Total Local</label>
                                    <div class="h2 font-weight-bold" th:text="${#numbers.formatDecimal(stockAdjustment.totalAmountLocal, 1, 'COMMA', 2, 'POINT')}">0.00</div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" th:text="#{label.stock-adjustment.note}">Note</label>
                                    <div class="text-secondary" th:text="${stockAdjustment.note ?: '-'}">None</div>
                                </div>
                            </div>
                        </div>
                        <div th:replace="~{fragments/audit-info :: audit-info(${stockAdjustment})}"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
