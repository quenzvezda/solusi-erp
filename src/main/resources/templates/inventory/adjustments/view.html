<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layout/master :: head(#{label.stock-adjustment.title})}"></head>

<body th:replace="~{layout/master :: layout(~{:: .stock-adjustment-view-content}, ~{})}">
    <div class="stock-adjustment-view-content">
        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title" th:text="${stockAdjustment.code}">ADJ-001</h2>
                        <div class="mt-1">
                            <span class="badge" 
                                  th:classappend="${stockAdjustment.status.name() == 'DRAFT' ? 'bg-secondary-lt' : 'bg-success-lt'}"
                                  th:text="${stockAdjustment.status}">STATUS</span>
                        </div>
                    </div>
                    <div class="col-auto ms-auto d-print-none">
                        <div class="btn-list">
                            <a th:href="@{/inventory/adjustments}" class="btn btn-white">
                                <i class="ti ti-arrow-left"></i> <span th:text="#{label.back}">Back</span>
                            </a>
                            <a th:if="${stockAdjustment.status.name() == 'DRAFT'}"
                               th:href="@{/inventory/adjustments/edit/{id}(id=${stockAdjustment.id})}"
                               class="btn btn-white">
                                <i class="ti ti-edit"></i> Edit
                            </a>
                            <form th:if="${stockAdjustment.status.name() == 'DRAFT'}"
                                  th:action="@{/inventory/adjustments/{id}/process(id=${stockAdjustment.id})}"
                                  method="post"
                                  onsubmit="return confirm(this.getAttribute('data-confirm'))"
                                  th:data-confirm="#{label.stock-adjustment.process.confirm}">
                                <button type="submit" class="btn btn-success" sec:authorize="hasAuthority('STOCK-ADJUSTMENT_PROCESS')">
                                    <i class="ti ti-check"></i> <span th:text="#{label.stock-adjustment.btn.process}">Process to Inventory</span>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="page-body">
            <div class="container-xl">
                <div class="row row-cards">
                    <!-- Left: Table Items -->
                    <div class="col-lg-8">
                        <div class="card">
                            <div class="card-header">
                                <h3 class="card-title" th:text="#{label.stock-adjustment.lines}">Adjustment Items</h3>
                            </div>
                            <div class="table-responsive">
                                <table class="table table-vcenter card-table">
                                    <thead>
                                        <tr>
                                            <th th:text="#{label.product}">Product</th>
                                            <th th:text="#{label.grid}">Grid</th>
                                            <th th:text="#{label.container}">Bin</th>
                                            <th th:text="#{label.product.serialized}">SN</th>
                                            <th class="text-end">Qty</th>
                                            <th class="text-end" th:text="#{label.stock-adjustment.total.original}">Unit Cost</th>
                                            <th class="text-end">Total</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="line : ${stockAdjustment.lines}">
                                            <td>
                                                <div class="font-weight-medium" th:text="${line.productCode}">CODE</div>
                                                <div class="text-secondary small" th:text="${line.productName}">Name</div>
                                            </td>
                                            <td><div th:text="${line.gridCode}">GRID</div></td>
                                            <td><div th:text="${line.containerCode}">BIN</div></td>
                                            <td class="text-secondary text-wrap" style="max-width: 200px; font-size: 0.75rem;" th:text="${line.serialNumber ?: '-'}">-</td>
                                            <td class="text-end" th:text="${#numbers.formatDecimal(line.quantity, 1, 'COMMA', 2, 'POINT')}">0</td>
                                            <td class="text-end" th:text="${#numbers.formatDecimal(line.unitCost, 1, 'COMMA', 2, 'POINT')}">0.00</td>
                                            <td class="text-end font-weight-medium" th:text="${#numbers.formatDecimal(line.totalAmount, 1, 'COMMA', 2, 'POINT')}">0.00</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- Right: Summary -->
                    <div class="col-lg-4">
                        <div class="card">
                            <div class="card-header">
                                <h3 class="card-title">Summary</h3>
                            </div>
                            <div class="card-body">
                                <div class="mb-3">
                                    <label class="form-label text-muted" th:text="#{label.stock-adjustment.date}">Date</label>
                                    <div class="font-weight-medium" th:text="${#temporals.format(stockAdjustment.transactionDate, 'dd MMM yyyy')}">Date</div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label text-muted" th:text="#{label.facility}">Facility</label>
                                    <div class="font-weight-medium" th:text="${stockAdjustment.facilityName}">Gudang Utama</div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label text-muted" th:text="#{label.stock-adjustment.currency}">Currency</label>
                                    <div class="font-weight-medium">
                                        <span th:text="${stockAdjustment.currencyAlias}">USD</span>
                                        <span class="text-muted small">(Rate: <span th:text="${#numbers.formatDecimal(stockAdjustment.exchangeRate, 1, 'COMMA', 2, 'POINT')}" th:data-value="${stockAdjustment.exchangeRate}">1.00</span>)</span>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label text-muted" th:text="#{label.stock-adjustment.total.local}">Total (Local)</label>
                                    <div class="h2 font-weight-bold text-primary mb-0" th:text="${#numbers.formatDecimal(stockAdjustment.totalAmountLocal, 1, 'COMMA', 2, 'POINT')}" th:data-value="${stockAdjustment.totalAmountLocal}">0.00</div>
                                </div>
                                <div class="mb-0">
                                    <label class="form-label text-muted" th:text="#{label.stock-adjustment.note}">Note</label>
                                    <div class="text-secondary small" th:text="${stockAdjustment.note ?: '-'}">None</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Bottom: Record Info (Full Width) -->
                    <div class="col-12 mt-3">
                        <div th:replace="~{fragments/audit-info :: audit-info(${stockAdjustment})}"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
