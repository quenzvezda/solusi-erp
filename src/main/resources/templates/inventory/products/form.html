<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/master :: head(${productRequest.id == null ? #messages.msg('label.product.add') : #messages.msg('label.product.edit')})}"></head>

<body th:replace="~{layout/master :: layout(~{:: .product-form-content})}">
    <div class="product-form-content">
        <!-- Page Header -->
        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title" th:text="${productRequest.id == null ? #messages.msg('label.product.add') : #messages.msg('label.product.edit')}">
                            Tambah Produk Baru
                        </h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Page Body -->
        <div class="page-body">
            <div class="container-xl">
                <form th:action="${productRequest.id == null ? '/inventory/products/create' : '/inventory/products/edit/' + productRequest.id}"
                    th:object="${productRequest}" method="post" class="card">
                    <div class="card-body">
                        <div class="row">
                            <!-- Basic Information -->
                            <div class="col-md-12">
                                <h3 class="card-title" th:text="#{label.product.section.basic}">Informasi Dasar</h3>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label class="form-label" th:text="#{label.product.code}">Kode Produk</label>
                                    <input type="text" th:field="*{code}" class="form-control bg-light" readonly 
                                        th:placeholder="${productRequest.id == null ? '[ Auto Generated ]' : ''}">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label required" th:text="#{label.product.name}">Nama Produk</label>
                                    <input type="text" th:field="*{name}" class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" th:text="#{label.product.barcode}">Barcode (EAN)</label>
                                    <input type="text" th:field="*{barcode}" class="form-control" th:placeholder="#{placeholder.product.barcode}">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label class="form-label required" th:text="#{label.product.category}">Kategori</label>
                                    <select th:field="*{categoryId}" class="form-select" id="category-select" th:classappend="${#fields.hasErrors('categoryId')} ? 'is-invalid'">
                                        <option value="" th:text="#{label.product.select.category}">-- Pilih Kategori --</option>
                                        <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:data-type="${cat.type}"></option>
                                    </select>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label required" th:text="#{label.product.uom}">Satuan Ukur (UoM)</label>
                                    <select th:field="*{uomId}" class="form-select" th:classappend="${#fields.hasErrors('uomId')} ? 'is-invalid'">
                                        <option value="" th:text="#{label.product.select.uom}">-- Pilih UoM --</option>
                                        <option th:each="u : ${uoms}" th:value="${u.id}" th:text="${u.name + ' (' + u.code + ')'}"></option>
                                    </select>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('uomId')}" th:errors="*{uomId}"></div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" th:text="#{label.brand}">Brand</label>
                                    <select th:field="*{brandId}" class="form-select">
                                        <option value="" th:text="#{label.product.select.brand}">-- Tanpa Brand --</option>
                                        <option th:each="b : ${brands}" th:value="${b.id}" th:text="${b.name}"></option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label class="form-label" th:text="#{label.product.hscode}">HS Code</label>
                                    <input type="text" th:field="*{hscode}" class="form-control">
                                </div>
                                <div class="mb-3">
                                    <label class="form-check form-switch mt-4">
                                        <input class="form-check-input" type="checkbox" th:field="*{isActive}">
                                        <span class="form-check-label" th:text="#{label.active}">Aktif</span>
                                    </label>
                                </div>
                            </div>

                            <!-- Inventory Section (STOCK only) -->
                            <div class="col-md-12 mt-3 section-stock">
                                <hr class="my-3">
                                <h3 class="card-title" th:text="#{label.product.section.inventory}">Manajemen Inventori</h3>
                            </div>
                            <div class="col-md-4 section-stock">
                                <div class="mb-3">
                                    <label class="form-label" th:text="#{label.product.min.stock}">Batas Stok Minimum</label>
                                    <input type="number" step="0.0001" th:field="*{minStock}" class="form-control">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" th:text="#{label.product.max.stock}">Batas Stok Maksimum</label>
                                    <input type="number" step="0.0001" th:field="*{maxStock}" class="form-control">
                                </div>
                            </div>
                            <div class="col-md-4 section-stock">
                                <div class="mb-3">
                                    <label class="form-check form-switch mt-4">
                                        <input class="form-check-input" type="checkbox" th:field="*{isSerialized}">
                                        <span class="form-check-label" th:text="#{label.product.serialized}">Gunakan Nomor Serial</span>
                                    </label>
                                </div>
                            </div>

                            <!-- Physical / Logistics Section (STOCK only) -->
                            <div class="col-md-12 mt-3 section-stock">
                                <hr class="my-3">
                                <h3 class="card-title" th:text="#{label.product.section.physical}">Fisik & Logistik</h3>
                            </div>
                            <div class="col-md-4 section-stock">
                                <div class="mb-3">
                                    <label class="form-label" th:text="#{label.product.weight.net}">Berat Bersih (Net)</label>
                                    <div class="input-group">
                                        <input type="number" step="0.0001" th:field="*{weightNet}" class="form-control">
                                        <select th:field="*{weightUomId}" class="form-select" style="max-width: 100px;">
                                            <option value="" th:text="#{label.product.select.uom.short}">Unit</option>
                                            <option th:each="u : ${weightUoms}" th:value="${u.id}" th:text="${u.code}"></option>
                                        </select>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" th:text="#{label.product.weight.gross}">Berat Kotor (Gross)</label>
                                    <input type="number" step="0.0001" th:field="*{weightGross}" class="form-control">
                                </div>
                            </div>
                            <div class="col-md-4 section-stock">
                                <div class="mb-3">
                                    <label class="form-label" th:text="#{label.product.dimensions}">Dimensi (P x L x T)</label>
                                    <div class="row g-2 mb-2">
                                        <div class="col-4">
                                            <input type="number" step="0.0001" th:field="*{length}" class="form-control" placeholder="P">
                                        </div>
                                        <div class="col-4">
                                            <input type="number" step="0.0001" th:field="*{width}" class="form-control" placeholder="L">
                                        </div>
                                        <div class="col-4">
                                            <input type="number" step="0.0001" th:field="*{height}" class="form-control" placeholder="T">
                                        </div>
                                    </div>
                                    <select th:field="*{dimensionUomId}" class="form-select">
                                        <option value="" th:text="#{label.product.select.uom.dimension}">-- Pilih Satuan Dimensi --</option>
                                        <option th:each="u : ${lengthUoms}" th:value="${u.id}" th:text="${u.name + ' (' + u.code + ')'}"></option>
                                    </select>
                                </div>
                            </div>

                            <!-- Notes -->
                            <div class="col-md-12 mt-3">
                                <hr class="my-3">
                                <div class="mb-3">
                                    <label class="form-label" th:text="#{label.product.note}">Catatan Tambahan</label>
                                    <textarea th:field="*{note}" class="form-control" rows="3"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer text-end">
                        <div class="d-flex">
                            <a th:href="@{/inventory/products}" class="btn btn-link" th:text="#{label.cancel}">Batal</a>
                            <button type="submit" class="btn btn-primary ms-auto">
                                <i class="ti ti-device-floppy"></i>
                                <span th:text="#{label.save}">Simpan</span>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Conditional UI Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const categorySelect = document.getElementById('category-select');
            const stockSections = document.querySelectorAll('.section-stock');

            function toggleSections() {
                const selectedOption = categorySelect.options[categorySelect.selectedIndex];
                const type = selectedOption ? selectedOption.getAttribute('data-type') : '';
                
                if (type === 'STOCK') {
                    stockSections.forEach(el => el.style.display = 'block');
                } else {
                    stockSections.forEach(el => el.style.display = 'none');
                }
            }

            categorySelect.addEventListener('change', toggleSections);
            toggleSections(); // Run once on load
        });
    </script>
</body>

</html>
