<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/master :: head(${productRequest.id == null
    ? #messages.msg('label.product.add')
    : #messages.msg('label.product.edit')})}">
</head>

<body th:replace="~{layout/master :: layout(~{:: .product-form-content}, ~{:: #page-specific-scripts})}">
    <div class="product-form-content" id="product-form-content" th:fragment="product-form-content">

        <!-- Page Header -->
        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title" th:text="${productRequest.id == null
                            ? #messages.msg('label.product.add')
                            : #messages.msg('label.product.edit')}">
                            Tambah Produk Baru
                        </h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Page Body -->
        <div class="page-body">
            <div class="container-xl">

                <form th:action="${productRequest.id == null
                        ? '/inventory/products/create'
                        : '/inventory/products/edit/' + productRequest.id}"
                      th:object="${productRequest}"
                      method="post"
                      class="card"
                      id="product-form"
                      data-ajax-form="true"
                      data-redirect-on-success="/inventory/products">

                    <!-- CSRF Token (Required for AJAX) -->
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <!-- UI Metadata (Used for display initial labels in Edit Mode) -->
                    <input type="hidden" name="categoryType" id="hidden-category-type" 
                           th:value="${productUIForm != null ? productUIForm.categoryType : ''}">

                    <div class="card-body">
                        <!-- Alert Placeholder inside card-body for global errors -->
                        <div class="alert-container"></div>

                        <div class="row">
                            <!-- Section: Basic Info -->
                            <div class="col-md-12">
                                <h3 class="card-title" th:text="#{label.product.section.basic}">Informasi Dasar</h3>
                            </div>

                            <div class="col-md-4">
                                <div th:replace="~{fragments/inputs :: text(field='code', label=#{label.product.code}, isReadonly=true, placeholder=${productRequest.id == null ? '[ Auto Generated ]' : ''})}"></div>
                                <div th:replace="~{fragments/inputs :: text(field='name', label=#{label.product.name}, required=true)}"></div>
                                <div th:replace="~{fragments/inputs :: text(field='barcode', label=#{label.product.barcode}, placeholder=#{placeholder.product.barcode})}"></div>
                            </div>

                            <div class="col-md-4">
                                <div th:insert="~{fragments/inputs :: autocomplete(field='categoryId', label=#{label.product.category}, required=true, id='category-select', path='inventory/product-categories',
                                    initialValue=*{categoryId}, 
                                    initialText=${productUIForm != null ? productUIForm.categoryName : ''}, 
                                    initialSubtext=${productUIForm != null ? productUIForm.categoryCode : ''}, 
                                    initialPayload=${productUIForm != null ? productUIForm.categoryType : ''})}"></div>

                                <div class="mb-3">
                                    <label class="form-label required" th:text="#{label.product.uom}">Satuan Ukur (UoM)</label>
                                    <select th:field="*{uomId}" id="uom-select" class="form-select erp-input">
                                        <option value="" th:text="#{label.product.select.uom}">-- Pilih UoM --</option>
                                        <option th:each="u : ${uoms}" th:value="${u.id}"
                                            th:text="${u.name + ' (' + u.code + ')'}"></option>
                                    </select>
                                </div>

                                <div th:insert="~{fragments/inputs :: autocomplete(field='brandId', label=#{label.brand}, id='brand-select', path='inventory/brands',
                                    initialValue=*{brandId}, 
                                    initialText=${productUIForm != null ? productUIForm.brandName : ''}, 
                                    initialSubtext=${productUIForm != null ? productUIForm.brandCode : ''})}"></div>
                            </div>

                            <div class="col-md-4">
                                <div th:replace="~{fragments/inputs :: text(field='hscode', label=#{label.product.hscode})}"></div>
                                <div class="mb-3">
                                    <label class="form-check form-switch mt-4">
                                        <input class="form-check-input" type="checkbox" th:field="*{isActive}">
                                        <span class="form-check-label" th:text="#{label.active}">Aktif</span>
                                    </label>
                                </div>
                            </div>

                            <!-- Section: Inventory Mgmt -->
                            <div class="col-md-12 mt-3 section-stock">
                                <hr class="my-3">
                                <h3 class="card-title" th:text="#{label.product.section.inventory}">Manajemen Inventori</h3>
                            </div>

                            <div class="col-md-4 section-stock">
                                <div th:replace="~{fragments/inputs :: decimal(field='minStock', label=#{label.product.min.stock})}"></div>
                                <div th:replace="~{fragments/inputs :: decimal(field='maxStock', label=#{label.product.max.stock})}"></div>
                            </div>

                            <div class="col-md-4 section-stock">
                                <div class="mb-3">
                                    <label class="form-check form-switch mt-4">
                                        <input class="form-check-input" type="checkbox" th:field="*{isSerialized}">
                                        <span class="form-check-label" th:text="#{label.product.serialized}">Gunakan Nomor Serial</span>
                                    </label>
                                </div>
                            </div>

                            <!-- Section: Physical/Logistics -->
                            <div class="col-md-12 mt-3 section-stock">
                                <hr class="my-3">
                                <h3 class="card-title" th:text="#{label.product.section.physical}">Fisik &amp; Logistik</h3>
                            </div>

                            <div class="col-md-6 section-stock">
                                <div class="mb-3">
                                    <div class="row g-2 mb-2">
                                        <div class="col-6">
                                            <div th:replace="~{fragments/inputs :: decimal(field='weightNet', label=#{label.product.weight.net})}"></div>
                                        </div>
                                        <div class="col-6">
                                            <div th:replace="~{fragments/inputs :: decimal(field='weightGross', label=#{label.product.weight.gross})}"></div>
                                        </div>
                                    </div>
                                    <select th:field="*{weightUomId}" class="form-select erp-input">
                                        <option value="" th:text="#{label.product.select.uom.weight}">-- Pilih Satuan Berat --</option>
                                        <option th:each="u : ${weightUoms}" th:value="${u.id}"
                                            th:text="${u.name + ' (' + u.code + ')'}"></option>
                                    </select>
                                </div>
                            </div>

                            <div class="col-md-6 section-stock">
                                <div class="mb-3">
                                    <label class="form-label" th:text="#{label.product.dimensions}">Dimensi (P x L x T)</label>
                                    <div class="row g-2 mb-2">
                                        <div class="col-4"><div th:replace="~{fragments/inputs :: decimal(field='length', label=null)}"></div></div>
                                        <div class="col-4"><div th:replace="~{fragments/inputs :: decimal(field='width', label=null)}"></div></div>
                                        <div class="col-4"><div th:replace="~{fragments/inputs :: decimal(field='height', label=null)}"></div></div>
                                    </div>
                                    <select th:field="*{dimensionUomId}" class="form-select erp-input">
                                        <option value="" th:text="#{label.product.select.uom.dimension}">-- Pilih Satuan Dimensi --</option>
                                        <option th:each="u : ${lengthUoms}" th:value="${u.id}"
                                            th:text="${u.name + ' (' + u.code + ')'}"></option>
                                    </select>
                                </div>
                            </div>

                            <div class="col-md-12 mt-3">
                                <hr class="my-3">
                                <div class="mb-3">
                                    <label class="form-label" th:text="#{label.product.note}">Catatan Tambahan</label>
                                    <textarea th:field="*{note}" class="form-control erp-input" rows="3"></textarea>
                                </div>
                            </div>
                        </div>

                        <!-- Record Info (Edit Mode only) -->
                        <div th:if="${auditInfo != null and auditInfo.id != null}" th:replace="~{fragments/audit-info :: audit-info(${auditInfo})}"></div>
                    </div>

                    <div class="card-footer text-end">
                        <div class="d-flex align-items-center">
                            <div id="loading-indicator" class="spinner-border spinner-border-sm text-primary me-2" role="status" style="display: none;"></div>
                            <a th:href="@{/inventory/products}" class="btn btn-link link-secondary" th:text="#{label.cancel}">Batal</a>
                            <button type="submit" class="btn btn-primary ms-auto">
                                <i class="ti ti-device-floppy"></i>
                                <span th:text="#{label.save}">Simpan</span>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <script id="page-specific-scripts" th:fragment="pageScripts">
            /*<![CDATA[*/
            (function () {
                const formContent = document.getElementById('product-form-content');
                if (!formContent) return;

                const categoryEl = formContent.querySelector('#category-select');
                const stockSections = formContent.querySelectorAll('.section-stock');
                const hiddenCategoryType = formContent.querySelector('#hidden-category-type');

                const toggleSections = (ts) => {
                    let type = '';
                    if (ts && ts.getValue()) {
                        const opt = ts.options[ts.getValue()];
                        type = (opt && opt.payload) ? opt.payload.type : '';
                        if (hiddenCategoryType) hiddenCategoryType.value = type;
                    } else {
                        type = hiddenCategoryType ? hiddenCategoryType.value : '';
                    }
                    const isStock = type === 'STOCK';
                    stockSections.forEach(el => el.style.display = isStock ? 'block' : 'none');
                };

                // Listen for the signal from master.html
                categoryEl.addEventListener('erp:lookup-initialized', function (e) {
                    const ts = e.detail.tomselect;
                    ts.on('change', () => toggleSections(ts));
                    toggleSections(ts);
                });
            })();
            /*]]>*/
        </script>
    </div>
</body>
</html>
