<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layout/master :: head(#{label.product.title})}"></head>

<body th:replace="~{layout/master :: layout(~{:: .product-list-content}, ~{})}">
    <div class="product-list-content">
        <!-- Page Header -->
        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title" th:text="#{label.product.title}">Produk</h2>
                        <div class="text-secondary mt-1" th:text="#{label.product.subtitle}">Kelola master data produk.</div>
                    </div>
                    <!-- Page title actions -->
                    <div class="col-auto ms-auto d-print-none" sec:authorize="hasAuthority('PRODUCT_CREATE')">
                        <div class="btn-list">
                            <a th:href="@{/inventory/products/create}"
                                class="btn btn-primary d-none d-sm-inline-block">
                                <i class="ti ti-plus"></i>
                                <span th:text="#{label.product.add}">Tambah Produk Baru</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Page Body -->
        <div class="page-body">
            <div class="container-xl">
                <!-- Alerts -->
                <div th:replace="~{fragments/alerts :: success}"></div>
                <div th:replace="~{fragments/alerts :: error}"></div>

                <div class="card">
                    <div class="card-body border-bottom py-3">
                        <div class="d-flex align-items-center">
                            <div class="ms-auto text-secondary">
                                <form th:action="@{/inventory/products}" method="get"
                                      hx-get="/inventory/products"
                                      hx-target="#product-table-container"
                                      hx-trigger="keyup changed delay:500ms from:#search-input"
                                      hx-push-url="true">
                                    <div class="input-icon">
                                        <input type="text" id="search-input" name="keyword" th:value="${keyword}"
                                            class="form-control form-control-sm" th:placeholder="#{label.search} + '...'">
                                        <span class="input-icon-addon">
                                            <i class="ti ti-search"></i>
                                        </span>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                    
                    <div id="product-table-container" th:fragment="product-table-container"
                         hx-get="/inventory/products"
                         hx-trigger="refresh-table from:body delay:500ms"
                         hx-include="[name='keyword'], [name='page']">
                        <!-- State Tracking for HTMX Refresh -->
                        <input type="hidden" name="page" th:value="${page.number}">

                        <div class="table-responsive">
                            <table class="table table-vcenter card-table">
                                <thead>
                                    <tr>
                                        <th th:replace="~{fragments/table :: sortable('code', #{label.product.column.code})}">Kode</th>
                                        <th th:replace="~{fragments/table :: sortable('name', #{label.product.column.name})}">Nama</th>
                                        <th th:replace="~{fragments/table :: sortable('category.name', #{label.product.column.category})}">Kategori</th>
                                        <th th:replace="~{fragments/table :: sortable('brand.name', #{label.product.column.brand})}">Brand</th>
                                        <th th:replace="~{fragments/table :: sortable('uom.code', #{label.product.column.uom})}">UoM</th>
                                        <th th:replace="~{fragments/table :: sortable('isActive', #{label.status})}">Status</th>
                                        <th class="w-1 text-end" th:text="#{label.actions}">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="item : ${page.content}" th:id="'product-row-' + ${item.id}">
                                        <td>
                                            <div th:text="${item.code}">CODE</div>
                                            <div class="text-secondary small" th:text="${item.barcode}">BARCODE</div>
                                        </td>
                                        <td class="font-weight-medium" th:text="${item.name}">Name</td>
                                        <td>
                                            <div th:text="${item.categoryName}">Category</div>
                                            <span class="badge" th:classappend="${item.categoryType == 'STOCK' ? 'bg-blue-lt' : (item.categoryType == 'NON_STOCK' ? 'bg-azure-lt' : 'bg-purple-lt')}"
                                                th:text="#{'label.product.category.type.' + ${item.categoryType.toLowerCase()}}">TYPE</span>
                                        </td>
                                        <td th:text="${item.brandName != null ? item.brandName : '-'}">Brand</td>
                                        <td th:text="${item.uomCode}">UoM</td>
                                        <td>
                                            <span class="badge badge-outline text-green" th:if="${item.isActive}">
                                                <span class="badge-dot bg-success me-1"></span>
                                                <span th:text="#{label.active}">Active</span>
                                            </span>
                                            <span class="badge badge-outline text-red" th:unless="${item.isActive}">
                                                <span class="badge-dot bg-danger me-1"></span>
                                                <span th:text="#{label.inactive}">Inactive</span>
                                            </span>
                                        </td>
                                        <td>
                                            <div class="btn-list flex-nowrap justify-content-end">
                                                <a th:href="@{/inventory/products/edit/{id}(id=${item.id})}"
                                                    class="btn btn-white btn-sm"
                                                    sec:authorize="hasAuthority('PRODUCT_UPDATE')">
                                                    <i class="ti ti-edit me-1"></i>
                                                    <span th:text="#{label.edit}">Edit</span>
                                                </a>
                                                <!-- HTMX Inline Delete with Standard Modal -->
                                                <button type="button" class="btn btn-white btn-sm text-danger"
                                                        sec:authorize="hasAuthority('PRODUCT_DELETE')"
                                                        data-bs-toggle="modal" 
                                                        th:data-bs-target="'#modal-delete-' + ${item.id}">
                                                    <i class="ti ti-trash me-1"></i>
                                                    <span th:text="#{label.delete}">Delete</span>
                                                </button>
                                            </div>

                                            <!-- Delete Modal Fragment -->
                                            <div th:replace="~{fragments/modals :: delete-confirm(
                                                id='modal-delete-' + ${item.id},
                                                title=#{label.delete.confirm.title},
                                                message=#{label.product.delete.confirm.text(${item.code})},
                                                actionUrl='/inventory/products/' + ${item.id},
                                                targetId='#product-row-' + ${item.id}
                                            )}"></div>
                                        </td>
                                    </tr>
                                    <tr th:if="${page.totalElements == 0}">
                                        <td colspan="7" class="text-center text-secondary py-4"
                                            th:text="#{label.product.empty}">Tidak ada data.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <!-- Pagination -->
                        <div th:replace="~{fragments/table :: pagination(${page})}"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
