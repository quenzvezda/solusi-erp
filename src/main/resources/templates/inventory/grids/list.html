<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layout/master :: head(#{label.grid.list})}"></head>

<body th:replace="~{layout/master :: layout(~{:: .grid-list-content}, ~{})}">
    <div class="grid-list-content">
        <!-- Page Header -->
        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title" th:text="#{label.grid.list}">Daftar Grid</h2>
                        <div class="text-secondary mt-1">
                            <span th:if="${selectedFacility == null}" th:text="#{label.grid.subtitle}">Kelola area penyimpanan dan zona dalam fasilitas.</span>
                            <nav th:if="${selectedFacility != null}" aria-label="breadcrumb">
                                <ol class="breadcrumb">
                                    <li class="breadcrumb-item"><a th:href="@{/inventory/facilities}" th:text="#{label.facility}">Fasilitas</a></li>
                                    <li class="breadcrumb-item active" aria-current="page" th:text="${selectedFacility.name}">Facility Name</li>
                                </ol>
                            </nav>
                        </div>
                    </div>
                    <!-- Page title actions -->
                    <div class="col-auto ms-auto d-print-none" sec:authorize="hasAuthority('GRID_CREATE')">
                        <div class="btn-list">
                            <a th:href="@{/inventory/grids/create(facilityId=${facilityId})}"
                                class="btn btn-primary d-none d-sm-inline-block">
                                <i class="ti ti-plus"></i>
                                <span th:text="#{label.grid.create}">Tambah Grid</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Page Body -->
        <div class="page-body">
            <div class="container-xl">
                <!-- Alerts -->
                <div th:replace="~{fragments/alerts :: success}"></div>
                <div th:replace="~{fragments/alerts :: error}"></div>

                <div class="card">
                    <div class="card-body border-bottom py-3">
                        <div class="d-flex align-items-center">
                            <!-- Filter Badge -->
                            <div th:if="${selectedFacility != null}" class="d-flex align-items-center">
                                <span class="badge bg-blue-lt me-2 p-2 d-flex align-items-center">
                                    <i class="ti ti-building-warehouse me-1"></i>
                                    <span th:text="${selectedFacility.code + ' - ' + selectedFacility.name}">FAC-001 - Warehouse Utama</span>
                                    <a th:href="@{/inventory/grids}" class="ms-2 text-reset" th:title="#{label.clear.filter}">
                                        <i class="ti ti-x"></i>
                                    </a>
                                </span>
                            </div>

                            <div class="ms-auto text-secondary">
                                <form th:action="@{/inventory/grids}" method="get"
                                      hx-get="/inventory/grids"
                                      hx-target="#grid-table-container"
                                      hx-trigger="keyup changed delay:500ms from:#search-input"
                                      hx-push-url="true">
                                    <input type="hidden" name="facilityId" th:value="${facilityId}" th:if="${facilityId != null}">
                                    <div class="input-icon">
                                        <input type="text" id="search-input" name="keyword" th:value="${keyword}"
                                            class="form-control form-control-sm" th:placeholder="#{label.search} + '...'">
                                        <span class="input-icon-addon">
                                            <i class="ti ti-search"></i>
                                        </span>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                    
                    <div id="grid-table-container" th:fragment="grid-table">
                        <div class="table-responsive">
                            <table class="table table-vcenter card-table datatable">
                                <thead>
                                    <tr>
                                        <th th:replace="~{fragments/table :: sortable('code', #{label.grid.code})}">Kode</th>
                                        <th th:replace="~{fragments/table :: sortable('name', #{label.grid.name})}">Nama</th>
                                        <th th:replace="~{fragments/table :: sortable('facility.name', #{label.grid.facility})}">Fasilitas</th>
                                        <th th:replace="~{fragments/table :: sortable('isActive', #{label.status})}">Status</th>
                                        <th class="w-1 text-end" th:text="#{label.actions}">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="item : ${page.content}">
                                        <td>
                                            <span class="font-weight-medium" th:text="${item.code}">CODE</span>
                                        </td>
                                        <td th:text="${item.name}">Name</td>
                                        <td th:text="${item.facilityName}">Facility</td>
                                        <td>
                                            <span class="badge badge-outline text-green" th:if="${item.isActive}">
                                                <span class="badge-dot bg-success me-1"></span>
                                                <span th:text="#{label.active}">Active</span>
                                            </span>
                                            <span class="badge badge-outline text-red" th:unless="${item.isActive}">
                                                <span class="badge-dot bg-danger me-1"></span>
                                                <span th:text="#{label.inactive}">Inactive</span>
                                            </span>
                                        </td>
                                        <td>
                                            <div class="btn-list flex-nowrap justify-content-end">
                                                <a th:href="@{/inventory/containers(gridId=${item.id})}" class="btn btn-white btn-sm">
                                                    <i class="ti ti-box"></i>
                                                    <span>Containers</span>
                                                </a>
                                                <a th:href="@{/inventory/grids/edit/{id}(id=${item.id})}"
                                                    class="btn btn-white btn-sm" sec:authorize="hasAuthority('GRID_UPDATE')">
                                                    <i class="ti ti-edit"></i>
                                                    <span th:text="#{label.edit}">Edit</span>
                                                </a>
                                                <form th:action="@{/inventory/grids/delete/{id}(id=${item.id})}"
                                                      method="post" 
                                                      th:data-confirm-msg="#{msg.confirm.delete}"
                                                      onsubmit="return confirm(this.getAttribute('data-confirm-msg'))"
                                                      sec:authorize="hasAuthority('GRID_DELETE')">
                                                    <button type="submit" class="btn btn-white btn-sm text-danger">
                                                        <i class="ti ti-trash"></i>
                                                        <span th:text="#{label.delete}">Delete</span>
                                                    </button>
                                                </form>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr th:if="${page.totalElements == 0}">
                                        <td colspan="5" class="text-center text-secondary py-4" th:text="#{msg.error.notfound}">No data found</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <!-- Pagination -->
                        <div th:replace="~{fragments/table :: pagination(${page})}"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
