<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layout/master :: head(${gridRequest.id == null ? #messages.msg('label.grid.create') : #messages.msg('label.grid.edit')})}"></head>

<body th:replace="~{layout/master :: layout(~{:: .grid-form-content}, ~{})}">
    <div class="grid-form-content" id="grid-form-content" th:fragment="grid-form-content">
        
        <!-- Page Header -->
        <div class="page-header d-print-none">
            <div class="row g-2 align-items-center">
                <div class="col">
                    <h2 class="page-title" th:text="${gridRequest.id == null ? #messages.msg('label.grid.create') : #messages.msg('label.grid.edit')}">Tambah Grid</h2>
                </div>
            </div>
        </div>

        <!-- Form Card -->
        <form th:action="${gridRequest.id == null ? '/inventory/grids/create' : '/inventory/grids/edit/' + gridRequest.id}"
            th:object="${gridRequest}" method="post" class="card mt-3"
            id="grid-form"
            data-ajax-form="true"
            data-redirect-on-success="/inventory/grids">

            <!-- CSRF Token -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="card-body">
                <!-- Alert Placeholder -->
                <div class="alert-container"></div>

                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label required" th:text="#{label.grid.facility}">Fasilitas</label>
                            <select th:field="*{facilityId}" class="form-select erp-input">
                                <option value="" th:text="#{label.grid.select.facility}">-- Pilih Fasilitas --</option>
                                <option th:each="f : ${facilities}" th:value="${f.id}" th:text="${f.name + ' (' + f.code + ')'}"></option>
                            </select>
                        </div>

                        <div th:replace="~{fragments/inputs :: text(field='code', label=#{label.grid.code}, required=true, placeholder=#{placeholder.grid.code})}"></div>
                        <div th:replace="~{fragments/inputs :: text(field='name', label=#{label.grid.name}, required=true, placeholder=#{placeholder.grid.name})}"></div>
                    </div>

                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-check form-switch mt-4">
                                <input class="form-check-input" type="checkbox" th:field="*{isActive}">
                                <span class="form-check-label" th:text="#{label.active}">Aktif</span>
                            </label>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" th:text="#{label.grid.note}">Catatan</label>
                            <textarea th:field="*{note}" class="form-control erp-input" rows="5"></textarea>
                        </div>
                    </div>
                </div>

                <!-- Record Info -->
                <div th:if="${auditInfo != null and auditInfo.id != null}" th:replace="~{fragments/audit-info :: audit-info(${auditInfo})}"></div>
            </div>

            <div class="card-footer text-end">
                <div class="d-flex align-items-center">
                    <div id="loading-indicator" class="spinner-border spinner-border-sm text-primary me-2" role="status" style="display: none;"></div>
                    <a th:href="@{/inventory/grids}" class="btn btn-link link-secondary" th:text="#{label.cancel}">Batal</a>
                    <button type="submit" class="btn btn-primary ms-auto">
                        <i class="ti ti-device-floppy"></i>
                        <span th:text="#{label.save}">Simpan</span>
                    </button>
                </div>
            </div>
        </form>
    </div>
</body>

</html>
