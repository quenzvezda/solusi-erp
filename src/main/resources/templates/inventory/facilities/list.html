<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layout/master :: head(#{label.facility.list})}"></head>

<body th:replace="~{layout/master :: layout(~{:: .facility-list-content}, ~{})}">
    <div class="facility-list-content">
        <!-- Page Header -->
        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title" th:text="#{label.facility.list}">Daftar Fasilitas</h2>
                        <div class="text-secondary mt-1" th:text="#{label.facility.subtitle}">Kelola gedung dan gudang penyimpanan.</div>
                    </div>
                    <!-- Page title actions -->
                    <div class="col-auto ms-auto d-print-none" sec:authorize="hasAuthority('FACILITY_CREATE')">
                        <div class="btn-list">
                            <a th:href="@{/inventory/facilities/create}"
                                class="btn btn-primary d-none d-sm-inline-block">
                                <i class="ti ti-plus"></i>
                                <span th:text="#{label.facility.create}">Tambah Fasilitas</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Page Body -->
        <div class="page-body">
            <div class="container-xl">
                <!-- Alerts -->
                <div th:replace="~{fragments/alerts :: success}"></div>
                <div th:replace="~{fragments/alerts :: error}"></div>

                <div class="card">
                    <div class="card-body border-bottom py-3">
                        <div class="d-flex">
                            <div class="ms-auto text-secondary">
                                <form th:action="@{/inventory/facilities}" method="get" class="input-icon"
                                      hx-get="/inventory/facilities"
                                      hx-target="#facility-table-container"
                                      hx-trigger="keyup changed delay:500ms from:#search-input"
                                      hx-push-url="true">
                                    <input type="text" id="search-input" name="keyword" th:value="${keyword}"
                                        class="form-control form-control-sm" th:placeholder="#{label.search}">
                                    <span class="input-icon-addon">
                                        <i class="ti ti-search"></i>
                                    </span>
                                </form>
                            </div>
                        </div>
                    </div>
                    
                    <div id="facility-table-container" th:fragment="facility-table-container"
                         hx-get="/inventory/facilities"
                         hx-trigger="refresh-table from:body delay:500ms"
                         hx-include="[name='keyword'], [name='page']">
                        <!-- State Tracking -->
                        <input type="hidden" name="page" th:value="${page.number}">

                        <div class="table-responsive">
                            <table class="table table-vcenter card-table">
                                <thead>
                                    <tr>
                                        <th th:replace="~{fragments/table :: sortable('code', #{label.facility.code})}">Kode</th>
                                        <th th:replace="~{fragments/table :: sortable('name', #{label.facility.name})}">Nama</th>
                                        <th th:replace="~{fragments/table :: sortable('owner.name', #{label.facility.owner})}">Pemilik</th>
                                        <th th:text="#{label.facility.address}">Alamat</th>
                                        <th th:replace="~{fragments/table :: sortable('isActive', #{label.status})}">Status</th>
                                        <th class="w-1 text-end" th:text="#{label.actions}">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="item : ${page.content}" th:id="'facility-row-' + ${item.id}">
                                        <td th:text="${item.code}">CODE</td>
                                        <td class="font-weight-medium" th:text="${item.name}">Name</td>
                                        <td th:text="${item.ownerName}">Owner</td>
                                        <td>
                                            <div th:text="${item.addressLine1}">Address</div>
                                            <div class="text-secondary small" th:text="${item.cityName}">City</div>
                                        </td>
                                        <td>
                                            <span class="badge badge-outline text-green" th:if="${item.isActive}">
                                                <span class="badge-dot bg-success me-1"></span>
                                                <span th:text="#{label.active}">Active</span>
                                            </span>
                                            <span class="badge badge-outline text-red" th:unless="${item.isActive}">
                                                <span class="badge-dot bg-danger me-1"></span>
                                                <span th:text="#{label.inactive}">Inactive</span>
                                            </span>
                                        </td>
                                        <td>
                                            <div class="btn-list flex-nowrap justify-content-end">
                                                <a th:href="@{/inventory/grids(facilityId=${item.id})}" class="btn btn-white btn-sm">
                                                    <i class="ti ti-layers-intersect"></i>
                                                    Grids
                                                </a>
                                                <a th:href="@{/inventory/facilities/edit/{id}(id=${item.id})}"
                                                    class="btn btn-white btn-sm" sec:authorize="hasAuthority('FACILITY_UPDATE')">
                                                    <i class="ti ti-edit me-1"></i>
                                                    <span th:text="#{label.edit}">Edit</span>
                                                </a>
                                                <!-- Standard Modal Delete -->
                                                <button type="button" class="btn btn-white btn-sm text-danger"
                                                        sec:authorize="hasAuthority('FACILITY_DELETE')"
                                                        data-bs-toggle="modal" 
                                                        th:data-bs-target="'#modal-delete-' + ${item.id}">
                                                    <i class="ti ti-trash me-1"></i>
                                                    <span th:text="#{label.delete}">Delete</span>
                                                </button>
                                            </div>

                                            <!-- Delete Modal Fragment -->
                                            <div th:replace="~{fragments/modals :: delete-confirm(
                                                id='modal-delete-' + ${item.id},
                                                title=#{label.delete.confirm.title},
                                                message=#{label.product.category.delete.confirm.text(${item.code})},
                                                actionUrl='/inventory/facilities/' + ${item.id},
                                                targetId='#facility-row-' + ${item.id}
                                            )}"></div>
                                        </td>
                                    </tr>
                                    <tr th:if="${page.totalElements == 0}">
                                        <td colspan="6" class="text-center text-secondary py-4" th:text="#{msg.error.notfound}">No data found</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <!-- Pagination -->
                        <div th:replace="~{fragments/table :: pagination(${page})}"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
