<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layout/master :: head(${facilityRequest.id == null ? #messages.msg('label.facility.create') : #messages.msg('label.facility.edit')})}"></head>

<body th:replace="~{layout/master :: layout(~{:: .facility-form-content}, ~{})}">
    <div class="facility-form-content">
        <!-- Page Header -->
        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title" th:text="${facilityRequest.id == null ? #messages.msg('label.facility.create') : #messages.msg('label.facility.edit') + ': ' + facilityRequest.name}">
                            Form Fasilitas
                        </h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Page Body -->
        <div class="page-body">
            <div class="container-xl">
                <form th:action="${facilityRequest.id == null ? '/inventory/facilities/create' : '/inventory/facilities/edit/' + facilityRequest.id}"
                      th:object="${facilityRequest}" method="post" class="card"
                      data-ajax-form="true"
                      data-redirect-on-success="/inventory/facilities">
                    
                    <input type="hidden" th:field="*{id}" />
                    <input type="hidden" th:field="*{version}" />

                    <div class="card-body">
                        <div class="row">
                            <!-- Basic Information -->
                            <div class="col-md-6">
                                <h3 class="card-title" th:text="#{label.product.section.basic}">Informasi Dasar</h3>
                                
                                <div th:replace="~{fragments/inputs :: text(field='code', label=#{label.facility.code}, isReadonly=true, placeholder='[ Auto Generated ]')}"></div>
                                
                                <div th:replace="~{fragments/inputs :: text(field='name', label=#{label.facility.name}, required=true)}"></div>

                                <div th:replace="~{fragments/inputs :: autocomplete(field='ownerId', label=#{label.facility.owner}, path='parties', required=true,
                                    initialValue=${facilityRequest.ownerId}, 
                                    initialText=${facilityUI != null ? facilityUI.ownerName : ''}, 
                                    initialSubtext=${facilityUI != null ? facilityUI.ownerCode : ''})}"></div>

                                <div class="mb-3">
                                    <label class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" th:field="*{isActive}">
                                        <span class="form-check-label" th:text="#{label.active}">Aktif</span>
                                    </label>
                                </div>
                            </div>

                            <!-- Address & Logistics -->
                            <div class="col-md-6 border-start-md">
                                <h3 class="card-title" th:text="#{label.party.address}">Alamat & Logistik</h3>
                                
                                <div th:replace="~{fragments/inputs :: text(field='addressLine1', label=#{label.party.address}, required=true)}"></div>

                                <div th:replace="~{fragments/inputs :: autocomplete(field='cityId', label=#{label.geographic.city}, path='geographics/cities', required=true,
                                    initialValue=${facilityRequest.cityId}, 
                                    initialText=${facilityUI != null ? facilityUI.cityName : ''}, 
                                    initialSubtext=${facilityUI != null ? facilityUI.cityCode : ''})}"></div>

                                <div th:replace="~{fragments/inputs :: text(field='postalCode', label=#{label.party.address.postal_code}, required=true)}"></div>

                                <div class="mb-3">
                                    <label class="form-label" th:text="#{label.facility.note}">Catatan</label>
                                    <textarea th:field="*{note}" class="form-control erp-input" rows="3"></textarea>
                                </div>
                            </div>
                        </div>

                        <!-- Audit Info -->
                        <th:block th:if="${auditInfo != null and auditInfo.id != null}">
                             <div th:replace="~{fragments/audit-info :: audit-info(${auditInfo})}"></div>
                        </th:block>
                    </div>

                    <div class="card-footer text-end">
                        <div class="d-flex">
                            <a th:href="@{/inventory/facilities}" class="btn btn-link" th:text="#{label.cancel}">Batal</a>
                            <button type="submit" class="btn btn-primary ms-auto">
                                <i class="ti ti-device-floppy me-1"></i>
                                <span th:text="#{label.save}">Simpan</span>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
