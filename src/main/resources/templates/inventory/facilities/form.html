<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layout/master :: head(${facilityRequest.id == null ? #messages.msg('label.facility.create') : #messages.msg('label.facility.edit')})}"></head>

<body th:replace="~{layout/master :: layout(~{:: .facility-form-content}, ~{})}">
    <div class="facility-form-content" id="facility-form-content" th:fragment="facility-form-content">
        <!-- Page Header -->
        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title" th:text="${facilityRequest.id == null ? #messages.msg('label.facility.create') : #messages.msg('label.facility.edit')}">Tambah Fasilitas</h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Page Body -->
        <div class="page-body">
            <div class="container-xl">
                <form th:action="${facilityRequest.id == null ? '/inventory/facilities/create' : '/inventory/facilities/edit/' + facilityRequest.id}"
                    th:object="${facilityRequest}" method="post" class="card"
                    id="facility-form"
                    data-ajax-form="true"
                    data-redirect-on-success="/inventory/facilities">

                    <!-- CSRF Token -->
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <div class="card-body">
                        <!-- Alert Placeholder inside card-body for global errors -->
                        <div class="alert-container"></div>

                        <div class="row">
                            <!-- Basic Information -->
                            <div class="col-md-12">
                                <h3 class="card-title" th:text="#{label.party.section.basic}">Informasi Dasar</h3>
                            </div>
                            <div class="col-md-6">
                                <div th:replace="~{fragments/inputs :: text(field='code', label=#{label.geographic.code}, isReadonly=true, extraClass='bg-light', placeholder=${facilityRequest.id == null ? '[ Auto Generated ]' : ''})}"></div>
                                <div th:replace="~{fragments/inputs :: text(field='name', label=#{label.geographic.name}, required=true)}"></div>
                                <div class="mb-3">
                                    <label class="form-label required" th:text="#{label.facility.owner}">Pemilik</label>
                                    <select th:field="*{ownerId}" class="form-select erp-input">
                                        <option value="" th:text="#{label.facility.select.owner}">-- Pilih Pemilik --</option>
                                        <option th:each="p : ${owners}" th:value="${p.id}" th:text="${p.name}"></option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-check form-switch mt-4">
                                        <input class="form-check-input" type="checkbox" th:field="*{isActive}">
                                        <span class="form-check-label" th:text="#{label.active}">Aktif</span>
                                    </label>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" th:text="#{label.facility.note}">Catatan</label>
                                    <textarea th:field="*{note}" class="form-control erp-input" rows="3"></textarea>
                                </div>
                            </div>

                            <!-- Address Section -->
                            <div class="col-md-12 mt-3">
                                <hr class="my-3">
                                <h3 class="card-title" th:text="#{label.party.address}">Alamat</h3>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label required" th:text="#{label.party.address}">Alamat</label>
                                    <textarea th:field="*{addressLine1}" class="form-control erp-input" rows="3" th:placeholder="#{placeholder.party.address}"></textarea>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label required" th:text="#{label.geographic.city}">Kota</label>
                                    <select th:field="*{cityId}" class="form-select erp-input">
                                        <option value="" th:text="#{label.party.address.select.city}">-- Pilih Kota --</option>
                                        <option th:each="c : ${cities}" th:value="${c.id}" th:text="${c.name}"></option>
                                    </select>
                                </div>
                                <div th:replace="~{fragments/inputs :: text(field='postalCode', label=#{label.party.address.postal_code}, required=true)}"></div>
                            </div>
                        </div>

                        <!-- Record Info (Edit Mode only) -->
                        <div th:if="${auditInfo != null and auditInfo.id != null}" th:replace="~{fragments/audit-info :: audit-info(${auditInfo})}"></div>
                    </div>

                    <div class="card-footer text-end">
                        <div class="d-flex align-items-center">
                            <div id="loading-indicator" class="spinner-border spinner-border-sm text-primary me-2" role="status" style="display: none;"></div>
                            <a th:href="@{/inventory/facilities}" class="btn btn-link link-secondary" th:text="#{label.cancel}">Batal</a>
                            <button type="submit" class="btn btn-primary ms-auto">
                                <i class="ti ti-device-floppy"></i>
                                <span th:text="#{label.save}">Simpan</span>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
