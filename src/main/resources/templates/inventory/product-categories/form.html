<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/master :: head(${productCategoryRequest.id == null
    ? #messages.msg('label.product.category.add')
    : #messages.msg('label.product.category.edit')})}">
</head>

<body th:replace="~{layout/master :: layout(~{:: .product-category-form-content}, ~{:: #page-specific-scripts})}">
    <div class="product-category-form-content" id="product-category-form-content" th:fragment="product-category-form-content">

        <!-- Page Header -->
        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title" th:text="${productCategoryRequest.id == null
                            ? #messages.msg('label.product.category.add')
                            : #messages.msg('label.product.category.edit')}">
                            Tambah Kategori Baru
                        </h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Page Body -->
        <div class="page-body">
            <div class="container-xl">

                <form th:action="${productCategoryRequest.id == null
                        ? '/inventory/product-categories/create'
                        : '/inventory/product-categories/edit/' + productCategoryRequest.id}"
                    th:object="${productCategoryRequest}"
                    method="post"
                    class="card"
                    id="product-category-form"
                    data-ajax-form="true"
                    data-redirect-on-success="/inventory/product-categories">

                    <!-- CSRF Token -->
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <div class="card-body">
                        <!-- Alert Placeholder inside card-body for global errors -->
                        <div class="alert-container"></div>

                        <div class="row">
                            <div class="col-md-6">
                                <div th:replace="~{fragments/inputs :: text(field='code', label=#{label.product.category.code}, isReadonly=true, extraClass='bg-light', placeholder=${productCategoryRequest.id == null ? '[ Auto Generated ]' : ''})}"></div>

                                <div th:replace="~{fragments/inputs :: text(field='name', label=#{label.product.category.name}, required=true)}"></div>

                                <div class="mb-3">
                                    <label class="form-label required" th:text="#{label.product.category.type}">Tipe</label>
                                    <select th:field="*{type}" class="form-select erp-input">
                                        <option value="" th:text="#{label.product.select.category}">-- Pilih Tipe --</option>
                                        <option th:each="t : ${types}" th:value="${t}"
                                            th:text="${#messages.msg('label.product.category.type.' + t.name().toLowerCase())}"></option>
                                    </select>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label" th:text="#{label.product.category.note}">Catatan</label>
                                    <textarea th:field="*{note}" class="form-control erp-input" rows="5" th:placeholder="#{placeholder.product.category.note}"></textarea>
                                </div>
                            </div>
                        </div>

                        <!-- Record Info (Edit Mode only) -->
                        <div th:if="${auditInfo != null and auditInfo.id != null}" th:replace="~{fragments/audit-info :: audit-info(${auditInfo})}"></div>
                    </div>

                    <div class="card-footer text-end">
                        <div class="d-flex align-items-center">
                            <div id="loading-indicator" class="spinner-border spinner-border-sm text-primary me-2" role="status" style="display: none;"></div>
                            <a th:href="@{/inventory/product-categories}" class="btn btn-link link-secondary" th:text="#{label.cancel}">Batal</a>
                            <button type="submit" class="btn btn-primary ms-auto">
                                <i class="ti ti-device-floppy"></i>
                                <span th:text="#{label.save}">Simpan</span>
                            </button>
                        </div>
                    </div>

                </form>
            </div>
        </div>

    </div>

    <div id="page-specific-scripts" th:fragment="pageScripts">
        <!-- Any page specific logic here, but AJAX is now global -->
    </div>
</body>

</html>
