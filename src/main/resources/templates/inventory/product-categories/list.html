<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/master :: head(#{label.product.category.title})}"></head>
<body th:replace="~{layout/master :: layout(~{:: .product-category-list-content})}">
    <div class="product-category-list-content">
        <!-- Page Header -->
        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title" th:text="#{label.product.category.title}">Kategori Produk</h2>
                        <div class="text-secondary mt-1" th:text="#{label.product.category.subtitle}">Kelola kategori produk dan tipenya.</div>
                    </div>
                    <!-- Page title actions -->
                    <div class="col-auto ms-auto d-print-none" sec:authorize="hasAuthority('PRODUCT-CATEGORY_CREATE')">
                        <div class="btn-list">
                            <a th:href="@{/inventory/product-categories/create}" class="btn btn-primary d-none d-sm-inline-block">
                                <i class="ti ti-plus"></i>
                                <span th:text="#{label.product.category.add}">Tambah Kategori Baru</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Page Body -->
        <div class="page-body">
            <div class="container-xl">
                <!-- Alerts -->
                <div th:if="${successMessage}" class="alert alert-success alert-dismissible" role="alert">
                    <div class="d-flex">
                        <div><i class="ti ti-check icon alert-icon"></i></div>
                        <div th:text="${successMessage}">Success!</div>
                    </div>
                    <a class="btn-close" data-bs-dismiss="alert" aria-label="close"></a>
                </div>
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible" role="alert">
                    <div class="d-flex">
                        <div><i class="ti ti-alert-circle icon alert-icon"></i></div>
                        <div th:text="${errorMessage}">Error!</div>
                    </div>
                    <a class="btn-close" data-bs-dismiss="alert" aria-label="close"></a>
                </div>

                <div class="card">
                    <div class="card-body border-bottom py-3">
                        <div class="d-flex">
                            <div class="text-secondary">
                                <!-- Future: Page Size Selector -->
                            </div>
                            <div class="ms-auto text-secondary">
                                <form th:action="@{/inventory/product-categories}" method="get" class="input-icon">
                                    <input type="text" name="keyword" th:value="${keyword}" class="form-control form-control-sm" th:placeholder="#{label.search}">
                                    <span class="input-icon-addon">
                                        <i class="ti ti-search"></i>
                                    </span>
                                </form>
                            </div>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-vcenter card-table">
                            <thead>
                                <tr>
                                    <th th:text="#{label.product.category.column.code}">Kode</th>
                                    <th th:text="#{label.product.category.column.name}">Nama</th>
                                    <th th:text="#{label.product.category.column.type}">Tipe</th>
                                    <th th:text="#{label.product.category.column.note}">Catatan</th>
                                    <th class="w-1" th:text="#{label.actions}">Aksi</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item : ${page.content}">
                                    <td th:text="${item.code}">CODE</td>
                                    <td class="font-weight-medium" th:text="${item.name}">Name</td>
                                    <td>
                                        <span class="font-weight-medium" 
                                              th:classappend="${item.type.name() == 'STOCK' ? 'text-blue' : (item.type.name() == 'NON_STOCK' ? 'text-azure' : 'text-purple')}"
                                              th:text="#{'label.product.category.type.' + ${item.type.name().toLowerCase()}}">
                                            TYPE
                                        </span>
                                    </td>
                                    <td class="text-secondary small" th:text="${#strings.abbreviate(item.note, 50)}">Note</td>
                                    <td>
                                        <div class="btn-list flex-nowrap">
                                            <a th:href="@{/inventory/product-categories/edit/{id}(id=${item.id})}" 
                                               class="btn btn-white btn-sm"
                                               sec:authorize="hasAuthority('PRODUCT-CATEGORY_UPDATE')"
                                               th:text="#{label.edit}">
                                                Edit
                                            </a>
                                            <button class="btn btn-danger btn-sm"
                                                    data-bs-toggle="modal" 
                                                    th:data-bs-target="'#modal-delete-' + ${item.id}"
                                                    sec:authorize="hasAuthority('PRODUCT-CATEGORY_DELETE')"
                                                    th:text="#{label.delete}">
                                                Hapus
                                            </button>
                                        </div>

                                        <!-- Delete Modal -->
                                        <div class="modal modal-blur fade" th:id="'modal-delete-' + ${item.id}" tabindex="-1" role="dialog" aria-hidden="true">
                                            <div class="modal-dialog modal-sm modal-dialog-centered" role="document">
                                                <div class="modal-content">
                                                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                                    <div class="modal-status bg-danger"></div>
                                                    <div class="modal-body text-center py-4">
                                                        <i class="ti ti-alert-triangle icon mb-2 text-danger icon-lg"></i>
                                                        <h3 th:text="#{label.product.category.delete.confirm.title}">Konfirmasi Hapus</h3>
                                                        <div class="text-secondary" th:text="#{label.product.category.delete.confirm.text(${item.code})}">Apakah Anda yakin ingin menghapus kategori?</div>
                                                    </div>
                                                    <div class="modal-footer">
                                                        <div class="w-100">
                                                            <div class="row">
                                                                <div class="col"><a href="#" class="btn w-100" data-bs-dismiss="modal" th:text="#{label.cancel}">Batal</a></div>
                                                                <div class="col">
                                                                    <form th:action="@{/inventory/product-categories/delete/{id}(id=${item.id})}" method="post">
                                                                        <button type="submit" class="btn btn-danger w-100" th:text="#{label.delete}">Hapus</button>
                                                                    </form>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${page.totalElements == 0}">
                                    <td colspan="5" class="text-center text-secondary py-4" th:text="#{label.product.category.empty}">Tidak ada data.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <!-- Pagination -->
                    <div class="card-footer d-flex align-items-center" th:if="${page.totalPages > 0}">
                        <p class="m-0 text-secondary">
                            <span th:text="#{label.pagination.showing}">Showing</span> 
                            <span th:text="${page.number * page.size + 1}">1</span> 
                            <span th:text="#{label.pagination.to}">to</span> 
                            <span th:text="${(page.number + 1) * page.size > page.totalElements ? page.totalElements : (page.number + 1) * page.size}">10</span> 
                            <span th:text="#{label.pagination.of}">of</span> 
                            <span th:text="${page.totalElements}">100</span> 
                            <span th:text="#{label.pagination.entries}">entries</span>
                        </p>
                        <ul class="pagination m-0 ms-auto">
                            <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                                <a class="page-link" th:href="@{/inventory/product-categories(page=${page.number - 1}, keyword=${keyword})}" tabindex="-1" aria-disabled="true">
                                    <i class="ti ti-chevron-left"></i>
                                    <span th:text="#{label.pagination.previous}">prev</span>
                                </a>
                            </li>
                            <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}" th:classappend="${i == page.number} ? 'active'">
                                <a class="page-link" th:href="@{/inventory/product-categories(page=${i}, keyword=${keyword})}" th:text="${i + 1}">1</a>
                            </li>
                            <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                                <a class="page-link" th:href="@{/inventory/product-categories(page=${page.number + 1}, keyword=${keyword})}">
                                    <span th:text="#{label.pagination.next}">next</span>
                                    <i class="ti ti-chevron-right"></i>
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
