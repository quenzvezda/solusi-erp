<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layout/master :: head(${uomConversionRequest.id == null ? #messages.msg('label.uom-conversion.add') : #messages.msg('label.uom-conversion.edit')})}"></head>

<body th:replace="~{layout/master :: layout(~{:: .uom-conversion-form-content}, ~{:: #page-specific-scripts})}">
    <div class="uom-conversion-form-content" id="uom-conversion-form-content" th:fragment="uom-conversion-form-content">
        <!-- Page Header -->
        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title" th:text="${uomConversionRequest.id == null ? #messages.msg('label.uom-conversion.add') : #messages.msg('label.uom-conversion.edit')}">Tambah Konversi</h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Page Body -->
        <div class="page-body">
            <div class="container-xl">
                <form th:action="${uomConversionRequest.id == null ? '/inventory/uom-conversions/create' : '/inventory/uom-conversions/edit/' + uomConversionRequest.id}"
                    th:object="${uomConversionRequest}" method="post" class="card"
                    id="uom-conversion-form"
                    data-ajax-form="true"
                    data-redirect-on-success="/inventory/uom-conversions">

                    <!-- CSRF Token -->
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <div class="card-body">
                        <!-- Alert Placeholder -->
                        <div class="alert-container"></div>

                        <div class="row">
                            <div class="col-md-6">
                                <div th:insert="~{fragments/inputs :: autocomplete(field='productId', label=#{label.uom-conversion.product}, required=true, id='product-select', path='inventory/products',
                                    initialValue=*{productId}, 
                                    initialText=${uomUIForm != null ? uomUIForm.productName : ''}, 
                                    initialSubtext=${uomUIForm != null ? uomUIForm.productCode : ''})}"></div>

                                <div class="mb-3">
                                    <label class="form-label required" th:text="#{label.uom-conversion.from-uom}">Satuan Asal</label>
                                    <select th:field="*{fromUomId}" class="form-select erp-input">
                                        <option value="" th:text="#{label.product.select.uom}">-- Pilih Satuan --</option>
                                        <option th:each="u : ${uoms}" th:value="${u.id}" th:text="${u.name + ' (' + u.code + ')'}"></option>
                                    </select>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <!-- Read Only Base UoM Field -->
                                <div class="mb-3">
                                    <label class="form-label" th:text="#{label.uom-conversion.to-uom}">Satuan Tujuan (Dasar)</label>
                                    <!-- Hidden input for data submission, inside mb-3 so errors attach here -->
                                    <input type="hidden" th:field="*{toUomId}" id="hidden-to-uom-id">
                                    <input type="text" id="display-to-uom-name" class="form-control erp-input bg-light" readonly 
                                           th:value="${uomUIForm != null ? uomUIForm.toUomName : ''}">
                                </div>

                                <div th:replace="~{fragments/inputs :: decimal(field='conversionFactor', label=#{label.uom-conversion.factor}, required=true)}"></div>
                                <div class="text-secondary small mt-n2 mb-3">Contoh: 1 Box = 12 Pieces, maka isi 12.00.</div>
                            </div>
                        </div>

                        <!-- Record Info -->
                        <div th:if="${auditInfo != null and auditInfo.id != null}" th:replace="~{fragments/audit-info :: audit-info(${auditInfo})}"></div>
                    </div>

                    <div class="card-footer text-end">
                        <div class="d-flex align-items-center">
                            <div id="loading-indicator" class="spinner-border spinner-border-sm text-primary me-2" role="status" style="display: none;"></div>
                            <a th:href="@{/inventory/uom-conversions}" class="btn btn-link link-secondary" th:text="#{label.cancel}">Batal</a>
                            <button type="submit" class="btn btn-primary ms-auto">
                                <i class="ti ti-device-floppy"></i>
                                <span th:text="#{label.save}">Simpan</span>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="page-specific-scripts" th:fragment="pageScripts">
        <script th:inline="javascript">
            /*<![CDATA[*/
            (function() {
                const productEl = document.getElementById('product-select');
                if (!productEl) return;

                const hiddenToUomId = document.getElementById('hidden-to-uom-id');
                const displayToUomName = document.getElementById('display-to-uom-name');

                productEl.addEventListener('erp:lookup-initialized', function(e) {
                    const ts = e.detail.tomselect;
                    
                    ts.on('change', function(val) {
                        const opt = ts.options[val];
                        if (opt && opt.payload) {
                            hiddenToUomId.value = opt.payload.uomId || '';
                            displayToUomName.value = opt.payload.uomName || '';
                        } else {
                            hiddenToUomId.value = '';
                            displayToUomName.value = '';
                        }
                    });
                });
            })();
            /*]]>*/
        </script>
    </div>
</body>

</html>
