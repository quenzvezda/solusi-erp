<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layout/master :: head(#{label.uom-conversion.title})}"></head>

<body th:replace="~{layout/master :: layout(~{:: .uom-conversion-list-content}, ~{})}">
    <div class="uom-conversion-list-content">
        <!-- Page Header -->
        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title" th:text="#{label.uom-conversion.title}">Daftar Konversi</h2>
                        <div class="text-secondary mt-1" th:text="#{label.uom-conversion.subtitle}">Kelola faktor konversi satuan untuk produk tertentu.</div>
                    </div>
                    <!-- Page title actions -->
                    <div class="col-auto ms-auto d-print-none" sec:authorize="hasAuthority('UOM-CONVERSION_CREATE')">
                        <div class="btn-list">
                            <a th:href="@{/inventory/uom-conversions/create}"
                                class="btn btn-primary d-none d-sm-inline-block">
                                <i class="ti ti-plus"></i>
                                <span th:text="#{label.uom-conversion.add}">Tambah Konversi</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Page Body -->
        <div class="page-body">
            <div class="container-xl">
                <!-- Alerts -->
                <div th:replace="~{fragments/alerts :: success}"></div>
                <div th:replace="~{fragments/alerts :: error}"></div>

                <div class="card">
                    <div class="card-body border-bottom py-3">
                        <div class="d-flex align-items-center">
                            <div class="ms-auto text-secondary">
                                <form th:action="@{/inventory/uom-conversions}" method="get" class="input-icon"
                                      hx-get="/inventory/uom-conversions"
                                      hx-target="#uom-conversion-table-container"
                                      hx-trigger="keyup changed delay:500ms from:#search-input"
                                      hx-push-url="true">
                                    <input type="text" id="search-input" name="keyword" th:value="${keyword}"
                                        class="form-control form-control-sm" th:placeholder="#{label.search} + '...'">
                                    <span class="input-icon-addon">
                                        <i class="ti ti-search"></i>
                                    </span>
                                </form>
                            </div>
                        </div>
                    </div>

                    <div id="uom-conversion-table-container" th:fragment="uom-conversion-table-container"
                         hx-get="/inventory/uom-conversions"
                         hx-trigger="refresh-table from:body delay:500ms"
                         hx-include="[name='keyword'], [name='page']">
                        <!-- State Tracking -->
                        <input type="hidden" name="page" th:value="${page.number}">

                        <div class="table-responsive">
                            <table class="table table-vcenter card-table">
                                <thead>
                                    <tr>
                                        <th th:replace="~{fragments/table :: sortable('product.name', #{label.uom-conversion.product})}">Produk</th>
                                        <th th:replace="~{fragments/table :: sortable('fromUom.name', #{label.uom-conversion.from-uom})}">Satuan Asal</th>
                                        <th th:replace="~{fragments/table :: sortable('toUom.name', #{label.uom-conversion.to-uom})}">Tujuan (Dasar)</th>
                                        <th th:replace="~{fragments/table :: sortable('conversionFactor', #{label.uom-conversion.factor})}">Faktor</th>
                                        <th class="w-1 text-end" th:text="#{label.actions}">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="item : ${page.content}" th:id="'uom-conv-row-' + ${item.id}">
                                        <td>
                                            <div class="font-weight-medium" th:text="${item.productName}">Product Name</div>
                                            <div class="text-secondary small" th:text="${item.productCode}">CODE</div>
                                        </td>
                                        <td th:text="${item.fromUomName}">From UOM</td>
                                        <td th:text="${item.toUomName}">To UOM</td>
                                        <td>
                                            <span class="badge bg-blue-lt" th:text="${item.conversionFactor}">1.00</span>
                                        </td>
                                        <td>
                                            <div class="btn-list flex-nowrap justify-content-end">
                                                <a th:href="@{/inventory/uom-conversions/edit/{id}(id=${item.id})}"
                                                    class="btn btn-white btn-sm" sec:authorize="hasAuthority('UOM-CONVERSION_UPDATE')">
                                                    <i class="ti ti-edit me-1"></i>
                                                    <span th:text="#{label.edit}">Edit</span>
                                                </a>
                                                <!-- Standard Modal Delete -->
                                                <button type="button" class="btn btn-white btn-sm text-danger"
                                                        sec:authorize="hasAuthority('UOM-CONVERSION_DELETE')"
                                                        data-bs-toggle="modal" 
                                                        th:data-bs-target="'#modal-delete-' + ${item.id}">
                                                    <i class="ti ti-trash me-1"></i>
                                                    <span th:text="#{label.delete}">Delete</span>
                                                </button>
                                            </div>

                                            <!-- Delete Modal Fragment -->
                                            <div th:replace="~{fragments/modals :: delete-confirm(
                                                id='modal-delete-' + ${item.id},
                                                title=#{label.delete.confirm.title},
                                                message=#{msg.delete.confirm(${item.productName})},
                                                actionUrl='/inventory/uom-conversions/' + ${item.id},
                                                targetId='#row-' + ${item.id}
                                            )}"></div>
                                        </td>
                                    </tr>
                                    <tr th:if="${page.totalElements == 0}">
                                        <td colspan="5" class="text-center text-secondary py-4" th:text="#{label.uom-conversion.empty}">Tidak ada data konversi.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <!-- Pagination -->
                        <div th:replace="~{fragments/table :: pagination(${page})}"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
