<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layout/master :: head(#{label.brand.title})}">
</head>

<body th:replace="~{layout/master :: layout(~{:: .brand-list-content}, ~{:: #page-specific-scripts})}">
    <div class="brand-list-content">

        <!-- Page Header -->
        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title" th:text="#{label.brand.title}">
                            Manajemen Brand
                        </h2>
                        <div class="text-secondary mt-1" th:text="#{label.brand.subtitle}">
                            Kelola data brand produk.
                        </div>
                    </div>
                    <div class="col-auto ms-auto d-print-none" sec:authorize="hasAuthority('BRAND_CREATE')">
                        <div class="btn-list">
                            <a th:href="@{/inventory/brands/create}" class="btn btn-primary d-none d-sm-inline-block">
                                <i class="ti ti-plus icon"></i>
                                <span th:text="#{label.brand.add}">Tambah Baru</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Page Body -->
        <div class="page-body">
            <div class="container-xl">

                <div th:replace="~{fragments/alerts :: success}"></div>
                <div th:replace="~{fragments/alerts :: error}"></div>

                <div class="card">
                    <div class="card-body border-bottom py-3">
                        <div class="d-flex">
                            <div class="ms-auto text-secondary">
                                <form th:action="@{/inventory/brands}" method="get" class="input-icon"
                                      hx-get="/inventory/brands"
                                      hx-target="#brand-table-container"
                                      hx-trigger="keyup changed delay:500ms from:#search-input"
                                      hx-push-url="true">
                                    <input type="text" id="search-input" name="keyword" th:value="${keyword}" 
                                           class="form-control form-control-sm"
                                           th:placeholder="#{label.search} + '...'">
                                    <span class="input-icon-addon">
                                        <i class="ti ti-search"></i>
                                    </span>
                                </form>
                            </div>
                        </div>
                    </div>

                    <div id="brand-table-container" th:fragment="brand-table-container"
                         hx-get="/inventory/brands"
                         hx-trigger="refresh-table from:body delay:500ms"
                         hx-include="[name='keyword'], [name='page']">
                        <!-- State Tracking -->
                        <input type="hidden" name="page" th:value="${page.number}">

                        <div class="table-responsive">
                            <table class="table card-table table-vcenter text-nowrap datatable">
                                <thead>
                                    <tr>
                                        <th th:replace="~{fragments/table :: sortable('code', #{label.brand.column.code})}">Kode</th>
                                        <th th:replace="~{fragments/table :: sortable('name', #{label.brand.column.name})}">Nama</th>
                                        <th th:text="#{label.brand.column.note}">Catatan</th>
                                        <th class="text-end" th:text="#{label.actions}">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="item : ${page.content}" th:id="'brand-row-' + ${item.id}">
                                        <td>
                                            <span class="font-weight-medium" th:text="${item.code}">BRD-001</span>
                                        </td>
                                        <td th:text="${item.name}">Brand Name</td>
                                        <td class="text-secondary text-truncate" style="max-width: 300px;" th:text="${item.note}">Note content</td>
                                        <td>
                                            <div class="btn-list flex-nowrap justify-content-end">
                                                <a th:href="@{/inventory/brands/edit/{id}(id=${item.id})}"
                                                   class="btn btn-white btn-sm" sec:authorize="hasAuthority('BRAND_UPDATE')">
                                                    <i class="ti ti-edit me-1"></i>
                                                    <span th:text="#{label.edit}">Edit</span>
                                                </a>
                                                <!-- Standard Modal Delete -->
                                                <button type="button" class="btn btn-white btn-sm text-danger"
                                                        sec:authorize="hasAuthority('BRAND_DELETE')"
                                                        data-bs-toggle="modal" 
                                                        th:data-bs-target="'#modal-delete-' + ${item.id}">
                                                    <i class="ti ti-trash me-1"></i>
                                                    <span th:text="#{label.delete}">Delete</span>
                                                </button>
                                            </div>

                                            <!-- Delete Modal Fragment -->
                                            <div th:replace="~{fragments/modals :: delete-confirm(
                                                id='modal-delete-' + ${item.id},
                                                title=#{label.delete.confirm.title},
                                                message=#{msg.delete.confirm(${item.name})},
                                                actionUrl='/inventory/brands/' + ${item.id},
                                                targetId='#row-' + ${item.id}
                                            )}"></div>
                                        </td>
                                    </tr>
                                    <tr th:if="${page.empty}">
                                        <td colspan="4" class="text-center py-4 text-secondary" th:text="#{label.brand.empty}">
                                            Tidak ada data brand.
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div th:replace="~{fragments/table :: pagination(${page})}"></div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <div id="page-specific-scripts" th:fragment="pageScripts">
    </div>
</body>

</html>
