<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layout/master :: head(${giRequest.id == null ? #messages.msg('label.gi.create') : #messages.msg('label.gi.edit')})}">
</head>

<body th:replace="~{layout/master :: layout(~{:: .gi-form-content}, ~{:: #page-specific-scripts})}">
    <div class="gi-form-content" id="gi-form-content">
        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title">
                            <span th:if="${giRequest.id == null}" th:text="#{label.gi.create}">Create Goods Issue</span>
                            <span th:if="${giRequest.id != null}" th:text="#{label.gi.edit}">Edit Goods Issue</span>
                        </h2>
                    </div>
                    <div class="col-auto ms-auto" th:if="${giRequest.id != null}">
                        <div class="btn-list">
                            <button type="button" id="btn-complete"
                                    class="btn btn-outline-success"
                                    th:if="${giRequest.status == 'DRAFT'}"
                                    sec:authorize="hasAuthority('GOODS-ISSUE_COMPLETE')"
                                    th:data-action-url="@{'/inventory/goods-issues/' + ${giRequest.id} + '/complete'}"
                                    th:data-redirect-url="@{'/inventory/goods-issues/' + ${giRequest.id}}"
                                    th:data-confirm-message="#{msg.confirm.gi.complete}"
                                    onclick="ErpForm.postAction(this)">
                                <i class="ti ti-check me-1"></i><span th:text="#{label.gi.complete}">Complete</span>
                            </button>
                            <a id="btn-cancel-gi"
                                    class="btn btn-outline-warning"
                                    th:if="${giRequest.status == 'COMPLETED' && giRequest.referenceType != null && giRequest.referenceType.name() == 'MANUAL'}"
                                    sec:authorize="hasAuthority('GOODS-ISSUE_CANCEL')"
                                    th:href="@{'/inventory/goods-issues/' + ${giRequest.id} + '/cancel'}">
                                <i class="ti ti-rotate-clockwise me-1"></i><span th:text="#{label.gi.cancel}">Cancel</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="page-body">
            <div class="container-xl">
                <form th:action="@{/inventory/goods-issues}"
                      th:object="${giRequest}"
                      method="post"
                      id="gi-form"
                      data-ajax-form="true"
                      data-redirect-on-success="/inventory/goods-issues"
                      th:data-readonly="${giRequest.status == 'COMPLETED' || giRequest.status == 'CANCELLED'}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <input type="hidden" th:field="*{id}">
                    <input type="hidden" th:field="*{referenceType}">
                    <input type="hidden" th:field="*{referenceId}">
                    <input type="hidden" th:field="*{referenceCode}">
                    <input type="hidden" th:field="*{partyId}">
                    <input type="hidden" th:field="*{partyType}">
                    <input type="hidden" th:field="*{facilityId}">
                    <input type="hidden" th:field="*{currencyId}">
                    <input type="hidden" th:field="*{exchangeRate}">

                    <div class="card mb-3">
                        <div class="card-body">
                            <div class="alert-container">
                                <div th:replace="~{fragments/alerts :: success}"></div>
                                <div th:replace="~{fragments/alerts :: error}"></div>
                            </div>
                            <div class="row g-3">
                                <div class="col-md-3">
                                    <label class="form-label text-secondary" th:text="#{label.gi.referenceType}">Reference Type</label>
                                    <div class="form-control-plaintext" th:text="${giRequest.referenceType ?: '-'}">PURCHASE_RETURN</div>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label text-secondary" th:text="#{label.gi.referenceCode}">Reference Code</label>
                                    <div class="form-control-plaintext" th:text="${giRequest.referenceCode ?: '-'}">PRTN-001</div>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label text-secondary" th:text="#{label.gi.partyType}">Party Type</label>
                                    <div class="form-control-plaintext" th:text="${giRequest.partyType ?: '-'}">SUPPLIER</div>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label text-secondary" th:text="#{label.gi.party}">Party</label>
                                    <div class="form-control-plaintext" th:text="${giRequest.partyName ?: '-'}">Supplier</div>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label text-secondary" th:text="#{label.gi.facility}">Facility</label>
                                    <div class="form-control-plaintext" th:text="${giRequest.facilityName ?: '-'}">Main WH</div>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label text-secondary" th:text="#{label.gi.currency}">Currency</label>
                                    <div class="form-control-plaintext" th:text="${giRequest.currencyCode ?: '-'}">IDR</div>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label text-secondary" th:text="#{label.gi.exchangeRate}">Exchange Rate</label>
                                    <div class="form-control-plaintext" th:text="${giRequest.exchangeRate != null ? #numbers.formatDecimal(giRequest.exchangeRate, 1, 'COMMA', 4, 'POINT') : '-'}">1.0000</div>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label required" th:text="#{label.gi.issueDate}">Issue Date</label>
                                    <input type="date" th:field="*{issueDate}" data-picker="date" class="form-control erp-input" required>
                                </div>
                                <div class="col-md-12">
                                    <label class="form-label" th:text="#{label.gi.notes}">Notes</label>
                                    <textarea class="form-control erp-input" th:field="*{notes}" rows="2"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row row-cards">
                        <div class="col-lg-9">
                            <div class="card">
                                <div class="card-header">
                                    <h3 class="card-title" th:text="#{label.gi.line.title}">Issue Lines</h3>
                                    <div class="card-actions">
                                        <button type="button" class="btn btn-primary btn-sm" id="btn-add-line">
                                            <i class="ti ti-plus"></i><span th:text="#{label.gi.line.add}">Add Line</span>
                                        </button>
                                    </div>
                                </div>
                                <div class="table-responsive">
                                    <table class="table table-vcenter card-table" id="table-lines">
                                        <thead>
                                            <tr>
                                                <th class="required" th:text="#{label.product}">Product</th>
                                                <th class="text-end required" th:text="#{label.qty.issued}">Qty Issued</th>
                                                <th class="text-end required" th:text="#{label.base.qty}">Base Qty</th>
                                                <th class="required" th:text="#{label.uom}">UoM</th>
                                                <th th:text="#{label.gi.facility}">Facility</th>
                                                <th class="required" th:text="#{label.grid}">Grid</th>
                                                <th class="required" th:text="#{label.container}">Container</th>
                                                <th th:text="#{label.serial}">Serial</th>
                                                <th class="text-end" th:text="#{label.unit.cost}">Unit Cost</th>
                                                <th class="text-end" th:text="#{label.inventory.amount}">Inventory Amt</th>
                                                <th class="w-1"></th>
                                            </tr>
                                        </thead>
                                        <tbody id="line-container">
                                            <tr th:each="line, stat : *{lines}" class="line-row" th:data-index="${stat.index}" th:data-source-derived="${line.referenceLineId != null}">
                                                <td>
                                                    <input type="hidden" th:name="'lines[' + ${stat.index} + '].id'" th:value="${line.id}">
                                                    <input type="hidden" th:name="'lines[' + ${stat.index} + '].referenceLineId'" th:value="${line.referenceLineId}">
                                                    <input type="hidden" th:name="'lines[' + ${stat.index} + '].serialized'" th:value="${line.serialized}" class="input-serialized">
                                                    <input type="hidden" th:name="'lines[' + ${stat.index} + '].uomId'" th:value="${line.uomId}" class="input-uom-id">
                                                    <input type="hidden" th:name="'lines[' + ${stat.index} + '].facilityId'" th:value="${line.facilityId}" class="input-facility-id">
                                                    <input type="hidden" th:name="'lines[' + ${stat.index} + '].serialNumber'" th:value="${line.serialNumber}" class="input-serial-csv">
                                                    <input type="hidden" th:name="'lines[' + ${stat.index} + '].valuationRefType'" th:value="${line.valuationRefType}" class="input-valuation-ref-type">
                                                    <input type="hidden" th:name="'lines[' + ${stat.index} + '].valuationRefId'" th:value="${line.valuationRefId}" class="input-valuation-ref-id">
                                                    <input type="hidden" th:name="'lines[' + ${stat.index} + '].valuationRefLineId'" th:value="${line.valuationRefLineId}" class="input-valuation-ref-line-id">
                                                    <div th:if="${line.referenceLineId != null}" class="form-control-plaintext source-locked" th:text="${line.productName ?: '-'}">Product</div>
                                                    <div th:if="${line.referenceLineId == null}" th:replace="~{fragments/inputs :: table-autocomplete(name='lines[' + __${stat.index}__ + '].productId', id='select-product-' + __${stat.index}__, isReadonly=false, extraClass='select-product', path='inventory/products',
                                                        initialValue=${line.productId}, initialText=${line.productName}, initialSubtext=${line.productCode})}"></div>
                                                </td>
                                                <td><input type="text" th:name="'lines[' + ${stat.index} + '].quantityIssued'" th:value="${line.quantityIssued}" class="form-control form-control-sm erp-input-sm erp-number-decimal text-end input-qty" required></td>
                                                <td><input type="text" th:name="'lines[' + ${stat.index} + '].baseQuantity'" th:value="${line.baseQuantity}" class="form-control form-control-sm erp-input-sm erp-number-decimal text-end input-base-qty" readonly required></td>
                                                <td><input type="text" class="form-control form-control-sm erp-input-sm input-uom-display source-locked" th:value="${line.uomName ?: line.uomCode}" readonly></td>
                                                <td><div class="form-control-plaintext" th:text="${line.facilityName ?: '-'}">Main WH</div></td>
                                                <td>
                                                    <div th:replace="~{fragments/inputs :: table-autocomplete(name='lines[' + __${stat.index}__ + '].gridId', id='select-grid-' + __${stat.index}__, isReadonly=false, extraClass='select-grid', path='inventory/grids',
                                                        initialValue=${line.gridId}, initialText=${line.gridName}, initialSubtext=${line.gridCode})}"></div>
                                                </td>
                                                <td>
                                                    <div th:replace="~{fragments/inputs :: table-autocomplete(name='lines[' + __${stat.index}__ + '].containerId', id='select-container-' + __${stat.index}__, isReadonly=false, extraClass='select-container', path='inventory/containers',
                                                        initialValue=${line.containerId}, initialText=${line.containerName}, initialSubtext=${line.containerCode})}"></div>
                                                </td>
                                                <td><button type="button" class="btn btn-white btn-sm btn-edit-detail" th:text="${line.serialized} ? #{label.serial} : #{label.detail}">Detail</button></td>
                                                <td><input type="text" th:name="'lines[' + ${stat.index} + '].unitCost'" th:value="${line.unitCost}" class="form-control form-control-sm erp-input-sm erp-number-decimal text-end input-unit-cost" readonly></td>
                                                <td><input type="text" class="form-control form-control-sm erp-input-sm erp-number-decimal text-end input-inventory-amount" readonly></td>
                                                <td><button type="button" class="btn btn-white btn-icon btn-remove-line text-danger"><i class="ti ti-trash"></i></button></td>
                                            </tr>
                                        </tbody>
                                    </table>
                                    <div id="empty-msg" class="text-center py-4 text-secondary" th:style="${#lists.isEmpty(giRequest.lines)} ? '' : 'display:none'" th:text="#{label.gi.line.empty}">No lines.</div>
                                </div>
                            </div>
                        </div>
                        <div class="col-lg-3">
                            <div class="card bg-secondary-lt">
                                <div class="card-body">
                                    <div class="text-secondary" th:text="#{label.gi.column.lines}">Lines</div>
                                    <div class="h2 mb-3" id="summary-line-count">0</div>
                                    <div class="text-secondary">Base Qty</div>
                                    <div class="h3 mb-3" id="summary-base-qty">0.0000</div>
                                    <div class="text-secondary" th:text="#{label.inventory.amount}">Inventory Amt</div>
                                    <div class="h3 mb-0" id="summary-inventory-amount">0.00</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card mt-3">
                        <div class="card-footer">
                            <div id="loading-indicator" class="spinner-border spinner-border-sm text-primary me-2" role="status" style="display:none;"></div>
                            <a th:href="@{/inventory/goods-issues}" class="btn btn-link link-secondary" th:text="#{label.cancel}">Cancel</a>
                            <button type="submit" class="btn btn-primary ms-auto" sec:authorize="hasAnyAuthority('GOODS-ISSUE_CREATE', 'GOODS-ISSUE_UPDATE')">
                                <i class="ti ti-device-floppy me-1"></i><span th:text="#{label.save}">Save</span>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <table style="display:none">
            <tbody id="row-template-source">
                <tr class="line-row" data-source-derived="false">
                    <td>
                        <input type="hidden" name="lines[INDEX].id">
                        <input type="hidden" name="lines[INDEX].referenceLineId">
                        <input type="hidden" name="lines[INDEX].serialized" value="false" class="input-serialized">
                        <input type="hidden" name="lines[INDEX].uomId" class="input-uom-id">
                        <input type="hidden" name="lines[INDEX].facilityId" class="input-facility-id">
                        <input type="hidden" name="lines[INDEX].serialNumber" class="input-serial-csv">
                        <input type="hidden" name="lines[INDEX].valuationRefType" class="input-valuation-ref-type">
                        <input type="hidden" name="lines[INDEX].valuationRefId" class="input-valuation-ref-id">
                        <input type="hidden" name="lines[INDEX].valuationRefLineId" class="input-valuation-ref-line-id">
                        <div th:replace="~{fragments/inputs :: table-autocomplete(name='lines[INDEX].productId', id='', isReadonly=false, extraClass='select-product', path='inventory/products',
                            initialValue=null, initialText=null, initialSubtext=null)}"></div>
                    </td>
                    <td><input type="text" name="lines[INDEX].quantityIssued" class="form-control form-control-sm erp-input-sm erp-number-decimal text-end input-qty" required></td>
                    <td><input type="text" name="lines[INDEX].baseQuantity" class="form-control form-control-sm erp-input-sm erp-number-decimal text-end input-base-qty" readonly required></td>
                    <td><input type="text" class="form-control form-control-sm erp-input-sm input-uom-display source-locked" readonly></td>
                    <td><div class="form-control-plaintext line-facility-display"></div></td>
                    <td><div th:replace="~{fragments/inputs :: table-autocomplete(name='lines[INDEX].gridId', id='', isReadonly=false, extraClass='select-grid', path='inventory/grids',
                        initialValue=null, initialText=null, initialSubtext=null)}"></div></td>
                    <td><div th:replace="~{fragments/inputs :: table-autocomplete(name='lines[INDEX].containerId', id='', isReadonly=false, extraClass='select-container', path='inventory/containers',
                        initialValue=null, initialText=null, initialSubtext=null)}"></div></td>
                    <td><button type="button" class="btn btn-white btn-sm btn-edit-detail" th:text="#{label.detail}">Detail</button></td>
                    <td><input type="text" name="lines[INDEX].unitCost" class="form-control form-control-sm erp-input-sm erp-number-decimal text-end input-unit-cost" readonly></td>
                    <td><input type="text" class="form-control form-control-sm erp-input-sm erp-number-decimal text-end input-inventory-amount" readonly></td>
                    <td><button type="button" class="btn btn-white btn-icon btn-remove-line text-danger"><i class="ti ti-trash"></i></button></td>
                </tr>
            </tbody>
        </table>

        <div class="offcanvas offcanvas-end" tabindex="-1" id="drawer-non-serial">
            <div class="offcanvas-header border-bottom">
                <h2 class="offcanvas-title" th:text="#{label.detail}">Detail</h2>
                <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas"></button>
            </div>
            <div class="offcanvas-body">
                <label class="form-label required" th:text="#{label.qty.issued}">Qty Issued</label>
                <input type="text" class="form-control erp-number-decimal input-qty-target">
                <label class="form-label mt-3 required" th:text="#{label.uom}">UoM</label>
                <select class="form-select select-uom-target"></select>
                <input type="hidden" class="input-qty-base erp-number-decimal">
            </div>
            <div class="offcanvas-footer p-3 border-top bg-body-tertiary">
                <button type="button" class="btn btn-primary w-100 btn-save-drawer" th:text="#{label.apply}">Apply</button>
            </div>
        </div>

        <div class="offcanvas offcanvas-end" tabindex="-1" id="drawer-serial">
            <div class="offcanvas-header border-bottom">
                <h2 class="offcanvas-title" th:text="#{label.serial}">Serial</h2>
                <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas"></button>
            </div>
            <div class="offcanvas-body">
                <input type="text" class="form-control erp-number-decimal input-qty-target">
                <input type="hidden" class="input-qty-base erp-number-decimal">
                <div class="serial-input-container mt-3"></div>
            </div>
            <div class="offcanvas-footer p-3 border-top bg-body-tertiary">
                <button type="button" class="btn btn-primary w-100 btn-save-drawer" th:text="#{label.apply}">Apply</button>
            </div>
        </div>

        <div th:replace="~{fragments/modal-selector :: shell('modal-gi-source-line-selector', #{label.gi.line.add}, 'gi-source-line-selector-results', 'modal-xl')}"></div>
    </div>

    <div id="page-specific-scripts" th:fragment="pageScripts">
        <script th:inline="javascript">
            window.GoodsIssuePageConfig = {
                sourceLineSelectorUrl: /*[[@{/inventory/goods-issues/selectors/source-lines}]]*/ '',
                referenceType: /*[[${giRequest.referenceType}]]*/ null,
                referenceId: /*[[${giRequest.referenceId}]]*/ null,
                manualReferenceType: 'MANUAL'
            };
        </script>
        <script th:src="@{/js/shared/erp-modal-selector.js}" defer></script>
        <script th:src="@{/js/inventory/goods-issue/goods-issue-form.js}" defer></script>
    </div>
</body>

</html>
