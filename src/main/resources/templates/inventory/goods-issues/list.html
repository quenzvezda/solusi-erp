<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layout/master :: head(#{label.gi.title})}">
</head>

<body th:replace="~{layout/master :: layout(~{:: .gi-list-content}, ~{:: #page-specific-scripts})}">
    <div class="gi-list-content">
        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title" th:text="#{label.gi.title}">Goods Issues</h2>
                        <div class="text-secondary mt-1" th:text="#{label.gi.subtitle}">Manage goods issue documents.</div>
                    </div>
                    <div class="col-auto ms-auto">
                        <a th:href="@{/inventory/goods-issues/create}" class="btn btn-primary" sec:authorize="hasAuthority('GOODS-ISSUE_CREATE')">
                            <i class="ti ti-plus me-1"></i><span th:text="#{label.gi.create}">Create Goods Issue</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div class="page-body">
            <div class="container-xl">
                <div th:replace="~{fragments/alerts :: success}"></div>
                <div th:replace="~{fragments/alerts :: error}"></div>

                <div class="card">
                    <div class="card-body border-bottom py-3">
                        <div class="d-flex flex-wrap align-items-center gap-2">
                            <div th:if="${activeReferenceType != null && activeReferenceId != null}" class="d-inline-flex align-items-center gap-2">
                                <span class="badge bg-blue-lt text-blue d-inline-flex align-items-center gap-1">
                                    <span th:text="#{label.gi.filter.reference}">Reference</span>
                                    <span class="fw-bold" th:text="${activeReferenceCode ?: '#' + activeReferenceId}">REF-001</span>
                                </span>
                                <a th:href="@{/inventory/goods-issues(keyword=${keyword})}" class="btn btn-sm btn-ghost-secondary" th:title="#{label.gi.filter.clear}">
                                    <i class="ti ti-x"></i>
                                </a>
                            </div>
                            <div class="ms-auto text-secondary">
                                <form th:action="@{/inventory/goods-issues}" method="get" class="input-icon"
                                      hx-get="/inventory/goods-issues"
                                      hx-target="#gi-table-container"
                                      hx-trigger="keyup changed delay:500ms from:#search-input"
                                      hx-push-url="true">
                                    <input type="text" id="search-input" name="keyword" th:value="${keyword}"
                                           class="form-control form-control-sm" th:placeholder="#{label.search} + '...'">
                                    <input type="hidden" name="referenceType" th:if="${activeReferenceType != null}" th:value="${activeReferenceType}">
                                    <input type="hidden" name="referenceId" th:if="${activeReferenceId != null}" th:value="${activeReferenceId}">
                                    <span class="input-icon-addon"><i class="ti ti-search"></i></span>
                                </form>
                            </div>
                        </div>
                    </div>

                    <div id="gi-table-container" th:fragment="gi-table-container"
                         hx-get="/inventory/goods-issues"
                         hx-trigger="refresh-table from:body delay:500ms"
                         hx-include="[name='keyword'], [name='page'], [name='referenceType'], [name='referenceId']">
                        <input type="hidden" name="page" th:value="${page.number}">
                        <div class="table-responsive">
                            <table class="table card-table table-vcenter text-nowrap datatable" id="table-gi-list">
                                <thead>
                                    <tr>
                                        <th th:replace="~{fragments/table :: sortable('code', #{label.gi.column.code})}">Code</th>
                                        <th th:text="#{label.gi.column.issueDate}">Issue Date</th>
                                        <th th:text="#{label.gi.column.referenceType}">Reference Type</th>
                                        <th th:text="#{label.gi.column.referenceCode}">Reference Code</th>
                                        <th th:text="#{label.gi.column.party}">Party</th>
                                        <th th:text="#{label.gi.column.facility}">Facility</th>
                                        <th th:text="#{label.gi.column.status}">Status</th>
                                        <th th:text="#{label.gi.column.lines}">Lines</th>
                                        <th class="text-end" th:text="#{label.gi.column.totalAmount}">Total Amount</th>
                                        <th class="text-end" th:text="#{label.actions}">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="item : ${page.content}" th:id="'row-' + ${item.id}">
                                        <td><span class="font-weight-medium" th:text="${item.code}">GI-001</span></td>
                                        <td th:text="${#temporals.format(item.issueDate, 'dd MMM yyyy')}">01 Jun 2026</td>
                                        <td th:text="${item.referenceType ?: '-'}">PURCHASE_RETURN</td>
                                        <td th:text="${item.referenceCode ?: '-'}">PRTN-001</td>
                                        <td th:text="${item.partyName ?: '-'}">Supplier</td>
                                        <td th:text="${item.facilityName ?: '-'}">Main</td>
                                        <td>
                                            <span class="badge"
                                                  th:classappend="${item.status == 'DRAFT'} ? 'bg-warning-lt' : (${item.status == 'COMPLETED'} ? 'bg-success-lt' : 'bg-secondary-lt')"
                                                  th:text="${item.status}">DRAFT</span>
                                        </td>
                                        <td th:text="${item.lineCount}">0</td>
                                        <td class="text-end" th:text="${item.totalAmount != null ? #numbers.formatDecimal(item.totalAmount, 1, 'COMMA', 2, 'POINT') : '-'}">0.00</td>
                                        <td>
                                            <div class="btn-list flex-nowrap justify-content-end">
                                                <a th:if="${item.status == 'DRAFT'}" th:href="@{/inventory/goods-issues/edit/{id}(id=${item.id})}"
                                                   class="btn btn-white btn-sm" sec:authorize="hasAuthority('GOODS-ISSUE_UPDATE')">
                                                    <i class="ti ti-edit me-1"></i><span th:text="#{label.edit}">Edit</span>
                                                </a>
                                                <a th:href="@{/inventory/goods-issues/{id}(id=${item.id})}"
                                                   class="btn btn-white btn-sm" sec:authorize="hasAuthority('GOODS-ISSUE_READ')">
                                                    <i class="ti ti-eye me-1"></i><span th:text="#{label.view}">View</span>
                                                </a>
                                                <button th:if="${item.status == 'DRAFT'}" type="button"
                                                        class="btn btn-white btn-sm text-danger"
                                                        sec:authorize="hasAuthority('GOODS-ISSUE_DELETE')"
                                                        data-bs-toggle="modal"
                                                        th:data-bs-target="'#modal-delete-' + ${item.id}">
                                                    <i class="ti ti-trash me-1"></i><span th:text="#{label.delete}">Delete</span>
                                                </button>
                                            </div>
                                            <div th:if="${item.status == 'DRAFT'}"
                                                 th:replace="~{fragments/modals :: delete-confirm(
                                                    id='modal-delete-' + ${item.id},
                                                    title=#{label.delete.confirm.title},
                                                    message=#{msg.delete.confirm(${item.code})},
                                                    actionUrl='/inventory/goods-issues/' + ${item.id},
                                                    targetId='#row-' + ${item.id}
                                                )}"></div>
                                        </td>
                                    </tr>
                                    <tr th:if="${page.empty}">
                                        <td colspan="10" class="text-center py-4 text-secondary" th:text="#{label.gi.empty}">No goods issue data found.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div th:replace="~{fragments/table :: pagination(${page})}"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="page-specific-scripts"></div>
</body>

</html>
