<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/master :: head(${containerRequest.id == null
    ? #messages.msg('label.container.create')
    : #messages.msg('label.container.edit')})}">
</head>

<body th:replace="~{layout/master :: layout(~{:: .container-form-content}, ~{})}">
    <div class="container-form-content">

        <!-- Page Header -->
        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title" th:text="${containerRequest.id == null
                            ? #messages.msg('label.container.create')
                            : #messages.msg('label.container.edit') + ': ' + containerRequest.name}">
                            Form Kontainer
                        </h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Page Body -->
        <div class="page-body">
            <div class="container-xl">
                <form th:action="${containerRequest.id == null
                        ? '/inventory/containers/create'
                        : '/inventory/containers/edit/' + containerRequest.id}" th:object="${containerRequest}" method="post"
                    class="card"
                    data-ajax-form="true"
                    data-redirect-on-success="/inventory/containers">
                    
                    <input type="hidden" th:field="*{id}" />
                    <input type="hidden" th:field="*{version}" />

                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-4">
                                <div th:replace="~{fragments/inputs :: autocomplete(field='gridId', label=#{label.container.grid}, path='inventory/grids', required=true,
                                    initialValue=${containerRequest.gridId}, 
                                    initialText=${containerUI != null ? containerUI.gridName : ''}, 
                                    initialSubtext=${containerUI != null ? containerUI.gridCode : ''})}"></div>

                                <div th:replace="~{fragments/inputs :: text(field='code', label=#{label.container.code}, isReadonly=true, placeholder='[ Auto Generated ]')}"></div>
                                
                                <div th:replace="~{fragments/inputs :: text(field='name', label=#{label.container.name}, required=true)}"></div>
                                
                                <div th:replace="~{fragments/inputs :: text(field='barcode', label=#{label.container.barcode})}"></div>
                            </div>

                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label class="form-label" th:text="#{label.container.dimensions}">Dimensi (P x L x T)</label>
                                    <div class="row g-2">
                                        <div class="col-4">
                                            <input type="text" th:field="*{length}" class="form-control erp-input erp-number-decimal text-end" placeholder="P">
                                        </div>
                                        <div class="col-4">
                                            <input type="text" th:field="*{width}" class="form-control erp-input erp-number-decimal text-end" placeholder="L">
                                        </div>
                                        <div class="col-4">
                                            <input type="text" th:field="*{height}" class="form-control erp-input erp-number-decimal text-end" placeholder="T">
                                        </div>
                                    </div>
                                </div>
                                
                                <div th:replace="~{fragments/inputs :: decimal(field='maxWeight', label=#{label.container.maxweight})}"></div>

                                <div class="mb-3">
                                    <label class="form-check form-switch mt-4">
                                        <input class="form-check-input" type="checkbox" th:field="*{isActive}">
                                        <span class="form-check-label" th:text="#{label.active}">Aktif</span>
                                    </label>
                                </div>
                            </div>

                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label class="form-label" th:text="#{label.container.note}">Catatan</label>
                                    <textarea th:field="*{note}" class="form-control erp-input" rows="8"></textarea>
                                </div>
                            </div>
                        </div>

                        <!-- Audit Info -->
                        <th:block th:if="${auditInfo != null and auditInfo.id != null}">
                             <div th:replace="~{fragments/audit-info :: audit-info(${auditInfo})}"></div>
                        </th:block>
                    </div>

                    <div class="card-footer text-end">
                        <div class="d-flex">
                            <a th:href="@{/inventory/containers}" class="btn btn-link" th:text="#{label.cancel}">Batal</a>
                            <button type="submit" class="btn btn-primary ms-auto">
                                <i class="ti ti-device-floppy me-1"></i>
                                <span th:text="#{label.save}">Simpan</span>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
