<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/master :: head(#{label.journal})}"></head>
<body th:replace="~{layout/master :: layout(~{:: .journal-list-content}, ~{:: #page-specific-scripts})}">
    <div class="journal-list-content">
        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title" th:text="#{label.journal}">Journal Entries</h2>
                    </div>
                    <div class="col-auto ms-auto" sec:authorize="hasAuthority('JOURNAL-ENTRY_CREATE')">
                        <a th:href="@{/accounting/journal-entries/create}" class="btn btn-primary">
                            <i class="ti ti-plus me-1"></i> <span th:text="#{label.create}">Create</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
        <div class="page-body">
            <div class="container-xl">
                <div class="card">
                    <div class="card-body border-bottom py-3">
                        <form method="get" class="d-flex flex-wrap gap-2 align-items-end" id="filterForm">
                            <div>
                                <label class="form-label" th:text="#{label.journal.sourceType}">Source Type</label>
                                <select name="sourceType" class="form-select form-select-sm" onchange="this.form.submit()">
                                    <option value="" th:text="#{label.all}">All</option>
                                    <option th:each="type : ${eventTypes}"
                                            th:val="${type}"
                                            th:text="#{${'label.schema.event.' + type}}"
                                            th:selected="${filter.sourceType == type}">
                                        Goods Receipt
                                    </option>
                                </select>
                            </div>
                            <div>
                                <label class="form-label" th:text="#{label.journal.sourceCode}">Source Code</label>
                                <input type="text" name="sourceCode" class="form-control form-control-sm" th:val="${filter.sourceCode}" th:placeholder="#{placeholder.journal.sourceCode}">
                            </div>
                            <div>
                                <label class="form-label" th:text="#{label.journal.code}">Journal Code</label>
                                <input type="text" name="journalCode" class="form-control form-control-sm" th:val="${filter.journalCode}" th:placeholder="#{placeholder.journal.code}">
                            </div>
                            <div>
                                <button type="submit" class="btn btn-sm btn-primary"><i class="ti ti-search me-1"></i> <span th:text="#{label.search}">Search</span></button>
                                <a th:href="@{/accounting/journal-entries}" class="btn btn-sm btn-link" th:text="#{label.clear}">Clear</a>
                            </div>
                        </form>
                    </div>
                    <div class="table-responsive">
                        <table class="table card-table table-vcenter text-nowrap datatable">
                            <thead>
                                <tr>
                                    <th th:text="#{label.journal.code}">Journal Code</th>
                                    <th th:text="#{label.journal.sourceType}">Source Type</th>
                                    <th th:text="#{label.journal.sourceCode}">Source Code</th>
                                    <th th:text="#{label.journal.postingDate}">Posting Date</th>
                                    <th class="text-end" th:text="#{label.journal.totalDebit}">Total Debit</th>
                                    <th class="text-end" th:text="#{label.journal.totalCredit}">Total Credit</th>
                                    <th th:text="#{label.status}">Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${page.empty}">
                                    <td colspan="7" class="text-center text-muted" th:text="#{msg.no.data.found}">No data found</td>
                                </tr>
                                <tr th:each="entry : ${page.content}">
                                    <td><a th:href="@{/accounting/journal-entries/{id}(id=${entry.id})}" th:text="${entry.journalCode}">JNL-001</a></td>
                                    <td th:text="#{${'label.schema.event.' + entry.eventType}}">Goods Receipt</td>
                                    <td th:text="${entry.sourceCode}">GR-001</td>
                                    <td th:text="${entry.postingDate != null ? #temporals.format(entry.postingDate, 'dd/MM/yyyy') : '-'}">01/01/2026</td>
                                    <td class="text-end" th:text="${#numbers.formatDecimal(entry.totalDebit, 1, 'COMMA', 2, 'POINT')}">100.00</td>
                                    <td class="text-end" th:text="${#numbers.formatDecimal(entry.totalCredit, 1, 'COMMA', 2, 'POINT')}">100.00</td>
                                    <td><span class="badge bg-success" th:text="${entry.status}">POSTED</span></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="card-footer d-flex align-items-center" th:if="${page.totalPages > 1}">
                        <div th:replace="~{fragments/pagination :: pagination(${page}, '/accounting/journal-entries')}"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="page-specific-scripts" th:fragment="pageScripts"></div>
</body>
</html>
