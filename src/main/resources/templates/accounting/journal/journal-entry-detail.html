<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/master :: head(#{label.journal} + ' - ' + ${journal.journalCode})}"></head>
<body th:replace="~{layout/master :: layout(~{:: .journal-detail-content}, ~{:: #page-specific-scripts})}">
    <div class="journal-detail-content">
        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <div class="page-pretitle" th:text="#{label.journal}">Journal Entry</div>
                        <h2 class="page-title" th:text="${journal.journalCode}">JNL-000001</h2>
                    </div>
                    <div class="col-auto ms-auto d-print-none">
                        <div class="btn-list">
                            <a th:href="@{/accounting/journal-entries}" class="btn btn-outline-secondary">
                                <i class="ti ti-arrow-left me-1"></i> <span th:text="#{label.back}">Back</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="page-body">
            <div class="container-xl">
                <div class="card mb-3">
                    <div class="card-header">
                        <h3 class="card-title" th:text="#{label.detail}">Detail</h3>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-muted" th:text="#{label.journal.sourceType}">Source Type</label>
                                <div class="form-control-plaintext" th:text="${journal.eventType}">GOODS_RECEIPT</div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-muted" th:text="#{label.journal.sourceCode}">Source Code</label>
                                <div class="form-control-plaintext">
                                    <a th:if="${journal.eventType == 'GOODS_RECEIPT'}" th:href="@{/inventory/goods-receipts/view/{id}(id=${journal.sourceCode})}" th:text="${journal.sourceCode}" class="text-primary">GR-001</a>
                                    <span th:unless="${journal.eventType == 'GOODS_RECEIPT'}" th:text="${journal.sourceCode}">SRC-001</span>
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-muted" th:text="#{label.journal.postingDate}">Posting Date</label>
                                <div class="form-control-plaintext" th:text="${#temporals.format(journal.postingDate, 'dd/MM/yyyy')}">01/01/2026</div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-muted" th:text="#{label.status}">Status</label>
                                <div><span class="badge bg-success" th:text="${journal.status}">POSTED</span></div>
                            </div>
                            <div class="col-12 mb-3">
                                <label class="form-label text-muted" th:text="#{label.description}">Description</label>
                                <div class="form-control-plaintext" th:text="${journal.description}">Auto Journal</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card mb-3">
                    <div class="card-header">
                        <h3 class="card-title" th:text="#{label.journal.lines}">Journal Lines</h3>
                    </div>
                    <div class="table-responsive">
                        <table class="table card-table table-vcenter text-nowrap">
                            <thead>
                                <tr>
                                    <th th:text="#{label.journal.account}">Account</th>
                                    <th class="text-end" th:text="#{label.journal.debit}">Debit</th>
                                    <th class="text-end" th:text="#{label.journal.credit}">Credit</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="line : ${journal.lines}">
                                    <td th:text="${line.accountId}">101</td>
                                    <td class="text-end" th:text="${#numbers.formatDecimal(line.debitAmount, 1, 'COMMA', 4, 'POINT')}">100.00</td>
                                    <td class="text-end" th:text="${#numbers.formatDecimal(line.creditAmount, 1, 'COMMA', 4, 'POINT')}">0.00</td>
                                </tr>
                            </tbody>
                            <tfoot>
                                <tr>
                                    <th class="text-end" th:text="#{label.total}">Total</th>
                                    <th class="text-end fw-bold" th:text="${#numbers.formatDecimal(journal.totalDebit, 1, 'COMMA', 4, 'POINT')}">100.00</th>
                                    <th class="text-end fw-bold" th:text="${#numbers.formatDecimal(journal.totalCredit, 1, 'COMMA', 4, 'POINT')}">100.00</th>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                </div>

                <div th:replace="~{fragments/audit-info :: audit-info(${journal})}"></div>
            </div>
        </div>
    </div>
    <div id="page-specific-scripts" th:fragment="pageScripts"></div>
</body>
</html>
