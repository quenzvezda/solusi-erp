<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div id="coa-parent-selector-results" th:fragment="coa-parent-selector-results">
    <div class="card-header border-0 pb-0">
        <form class="row g-2"
              hx-get="/accounting/coa/selectors/parent"
              hx-target="#coa-parent-selector-results"
              hx-swap="outerHTML">
            <div class="col">
                <input type="search"
                       class="form-control"
                       name="keyword"
                       th:value="${keyword}"
                       th:placeholder="#{label.coa.selector.search.placeholder}">
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-primary">
                    <i class="ti ti-search"></i>
                    <span class="ms-1" th:text="#{label.search}">Search</span>
                </button>
            </div>
        </form>
    </div>

    <div class="table-responsive">
        <table class="table table-vcenter card-table">
            <thead>
            <tr>
                <th th:text="#{label.coa.column.code}">Code</th>
                <th th:text="#{label.coa.column.name}">Name</th>
                <th th:text="#{label.coa.column.type}">Type</th>
                <th th:text="#{label.coa.column.level}">Level</th>
                <th th:text="#{label.coa.column.header}">Header</th>
                <th class="w-1"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(selectorRows)}">
                <td colspan="6" class="text-center text-secondary py-4"
                    th:text="#{label.coa.selector.empty}">No accounts found.</td>
            </tr>
            <tr th:each="row : ${selectorRows}"
                th:attr="data-id=${row.id},
                         data-code=${row.code},
                         data-name=${row.name},
                         data-level=${row.level},
                         data-is-header=${row.isHeader},
                         data-account-type=${row.accountType}">
                <td>
                    <div class="fw-semibold" th:text="${row.code}">1000</div>
                </td>
                <td>
                    <span th:style="'padding-left: ' + (${row.level} - 1) * 20 + 'px'"
                          th:text="${row.name}">Account Name</span>
                </td>
                <td>
                    <span class="badge bg-azure-lt" th:if="${row.accountType != null}"
                          th:text="#{${'label.coa.type.' + row.accountType}}">Asset</span>
                </td>
                <td th:text="${row.level}">1</td>
                <td>
                    <span th:if="${row.isHeader}" class="badge bg-purple-lt"
                          th:text="#{label.yes}">Yes</span>
                    <span th:unless="${row.isHeader}" class="text-secondary">-</span>
                </td>
                <td>
                    <button type="button" class="btn btn-primary btn-sm js-coa-parent-pick"
                            th:text="#{label.choose}">Choose</button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
