<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layout/master :: head(${fyRequest.id == null ? #messages.msg('label.period.add') : #messages.msg('label.period.edit')})}"></head>

<body th:replace="~{layout/master :: layout(~{:: .period-form-content}, ~{})}">
    <div class="period-form-content">
        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title" th:text="${fyRequest.id == null ? #messages.msg('label.period.add') : #messages.msg('label.period.edit') + ': ' + fyRequest.name}">
                            Form Fiscal Year
                        </h2>
                    </div>
                </div>
            </div>
        </div>

        <div class="page-body">
            <div class="container-xl">
                <form th:action="${fyRequest.id == null ? '/accounting/periods/create' : '/accounting/periods/edit/' + fyRequest.id}"
                      th:object="${fyRequest}" method="post" class="card"
                      data-ajax-form="true"
                      data-redirect-on-success="/accounting/periods">

                    <input type="hidden" th:field="*{version}" />

                    <div class="card-body">
                        <div class="alert-container"></div>

                        <div class="alert alert-info" th:if="${fyRequest.id == null}">
                            <i class="ti ti-info-circle me-1"></i>
                            <span th:text="#{label.period.auto.generate.note}">12 monthly periods will be auto-generated.</span>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <h3 class="card-title" th:text="#{label.product.section.basic}">Basic Info</h3>

                                <div th:replace="~{fragments/inputs :: text(field='name', label=#{label.period.fy.name}, required=true, placeholder=#{placeholder.period.fy.name})}"></div>

                                <div class="mb-3">
                                    <label class="form-label required" th:text="#{label.period.fy.start}">Start Date</label>
                                    <input type="date" th:field="*{startDate}" class="form-control erp-input"
                                           th:readonly="${fyRequest.id != null}"
                                           th:classappend="${fyRequest.id != null ? 'bg-body-tertiary' : ''}">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label required" th:text="#{label.period.fy.end}">End Date</label>
                                    <input type="date" th:field="*{endDate}" class="form-control erp-input"
                                           th:readonly="${fyRequest.id != null}"
                                           th:classappend="${fyRequest.id != null ? 'bg-body-tertiary' : ''}">
                                </div>
                            </div>

                            <div class="col-md-6 border-start-md">
                                <h3 class="card-title" th:text="#{label.general.settings}">Settings</h3>

                                <div class="mb-3">
                                    <label class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" th:field="*{isActive}">
                                        <span class="form-check-label" th:text="#{label.active}">Active</span>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div th:if="${auditInfo != null and auditInfo.id != null}"
                             th:replace="~{fragments/audit-info :: audit-info(${auditInfo})}"></div>
                    </div>

                    <div class="card-footer text-end">
                        <div class="d-flex align-items-center">
                            <div id="loading-indicator" class="spinner-border spinner-border-sm text-primary me-2" role="status" style="display: none;"></div>
                            <a th:href="@{/accounting/periods}" class="btn btn-link link-secondary" th:text="#{label.cancel}">Cancel</a>
                            <button type="submit" class="btn btn-primary ms-auto">
                                <i class="ti ti-device-floppy me-1"></i>
                                <span th:text="#{label.save}">Save</span>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
