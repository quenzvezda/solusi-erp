<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/master :: head(#{label.vb.create})}">
</head>

<body th:replace="~{layout/master :: layout(~{:: .vendor-bill-form-content}, ~{:: #page-specific-scripts})}">
    <div class="vendor-bill-form-content">
        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title" th:text="#{label.vb.create}">Create Vendor Bill</h2>
                    </div>
                    <div class="col-auto ms-auto">
                        <a th:href="@{/accounts-payable/vendor-bills}" class="btn btn-secondary">
                            <i class="ti ti-arrow-left me-1"></i><span th:text="#{label.back}">Back</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div class="page-body">
            <div class="container-xl">
                <form th:action="@{/accounts-payable/vendor-bills}" th:object="${form.request}" method="post" id="vendor-bill-form" data-ajax-form="true"
                      data-redirect-on-success="/accounts-payable/vendor-bills"
                      th:data-line-required-message="#{msg.err.vb.lines.required}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="id" th:value="*{id}">
                    <div id="selected-gr-ids">
                        <input th:each="grId, stat : *{grIds}"
                               type="hidden"
                               th:name="'grIds[' + ${stat.index} + ']'"
                               th:value="${grId}">
                    </div>

                    <div class="card mb-3">
                        <div class="card-body">
                            <div class="row g-3">
                                <div class="col-md-3">
                                    <label class="form-label required" th:text="#{label.vendor}">Vendor</label>
                                    <input type="hidden" name="vendorId" th:value="*{vendorId}">
                                    <input type="text" class="form-control bg-light" th:value="${form.vendorName != null ? form.vendorName : form.request.vendorId}" readonly>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label required" th:text="#{label.currency}">Currency</label>
                                    <input type="hidden" name="currencyId" th:value="*{currencyId}">
                                    <input type="text" class="form-control bg-light" th:value="${form.currencyCode != null ? form.currencyCode : form.request.currencyId}" readonly>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label required" th:text="#{label.vb.exchangeRate}">Exchange Rate</label>
                                    <input type="text" class="form-control text-end" name="exchangeRate" th:value="*{exchangeRate}" data-autonumeric="decimal" required>
                                    <div class="form-hint" th:if="${form.exchangeRateRequired}" th:text="#{label.vb.exchangeRate.mixedHint}">Selected references use mixed rates; enter invoice rate manually.</div>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label required" th:text="#{label.vb.vendorInvoiceNumber}">Vendor Invoice</label>
                                    <input type="text" class="form-control" name="vendorInvoiceNumber" th:value="*{vendorInvoiceNumber}" required>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label required" th:text="#{label.vb.billDate}">Bill Date</label>
                                    <input type="date" class="form-control" name="billDate" th:value="*{billDate}" data-picker="date" required>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label required" th:text="#{label.vb.dueDate}">Due Date</label>
                                    <input type="date" class="form-control" name="dueDate" th:value="*{dueDate}" data-picker="date" required>
                                </div>
                                <div class="col-md-9">
                                    <label class="form-label" th:text="#{label.notes}">Notes</label>
                                    <input type="text" class="form-control" name="notes" th:value="*{notes}">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title" th:text="#{label.vb.lines}">Bill Lines</h3>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-vcenter card-table">
                                <thead>
                                    <tr>
                                        <th th:text="#{label.product}">Product</th>
                                        <th class="text-end" style="width: 8rem;" th:text="#{label.qty}">Qty</th>
                                        <th th:text="#{label.uom}">UoM</th>
                                        <th class="text-end" th:text="#{label.unit.price}">Unit Price</th>
                                        <th class="text-end" th:text="#{label.vb.recap.dpp}">DPP</th>
                                        <th class="text-end" th:text="#{label.tax.amount}">Tax</th>
                                        <th class="text-end" th:text="#{label.actions}">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="vendor-bill-lines-body">
                                    <tr th:each="line, stat : *{lines}" class="vendor-bill-line-row"
                                        th:data-gr-line-id="${line.grLineId}"
                                        th:data-quantity-received="${line.qtyBilled}"
                                        th:data-inventory-amount="${line.inventoryAmount}"
                                        th:data-tax-amount="${line.taxAmount}">
                                        <td>
                                            <input type="hidden" th:name="'lines[' + ${stat.index} + '].id'" th:value="${line.id}">
                                            <input type="hidden" th:name="'lines[' + ${stat.index} + '].grLineId'" th:value="${line.grLineId}">
                                            <input type="hidden" th:name="'lines[' + ${stat.index} + '].productId'" th:value="${line.productId}">
                                            <input type="hidden" th:name="'lines[' + ${stat.index} + '].productName'" th:value="${line.productName}">
                                            <input type="hidden" th:name="'lines[' + ${stat.index} + '].description'" th:value="${line.description}">
                                            <input type="hidden" th:name="'lines[' + ${stat.index} + '].unitPrice'" th:value="${line.unitPrice}">
                                            <input type="hidden" th:name="'lines[' + ${stat.index} + '].inventoryAmount'" th:value="${line.inventoryAmount}">
                                            <input type="hidden" th:name="'lines[' + ${stat.index} + '].taxAmount'" th:value="${line.taxAmount}">
                                            <span th:text="${line.productName}">Product</span>
                                        </td>
                                        <td><input type="text" class="form-control form-control-sm erp-input-sm erp-number-decimal text-end js-vb-qty" th:name="'lines[' + ${stat.index} + '].qtyBilled'" th:value="${line.qtyBilled != null ? #numbers.formatDecimal(line.qtyBilled, 1, 'COMMA', 2, 'POINT') : '0.00'}"></td>
                                        <td>
                                            <input type="hidden" th:name="'lines[' + ${stat.index} + '].uomId'" th:value="${line.uomId}">
                                            <input type="hidden" th:name="'lines[' + ${stat.index} + '].uomName'" th:value="${line.uomName}">
                                            <span th:text="${line.uomName}">PCS</span>
                                        </td>
                                        <td class="text-end" th:text="${line.unitPrice != null ? #numbers.formatDecimal(line.unitPrice, 1, 'COMMA', 2, 'POINT') : '-'}">0.00</td>
                                        <td class="text-end js-vb-line-dpp">0.00</td>
                                        <td class="text-end js-vb-line-tax" th:text="${line.taxAmount != null ? #numbers.formatDecimal(line.taxAmount, 1, 'COMMA', 2, 'POINT') : '-'}">0.00</td>
                                        <td class="text-end">
                                            <button type="button" class="btn btn-white btn-icon text-danger js-vb-line-remove">
                                                <i class="ti ti-trash"></i>
                                            </button>
                                        </td>
                                    </tr>
                                    <tr id="vendor-bill-lines-empty" th:if="${#lists.isEmpty(form.request.lines)}">
                                        <td colspan="7" class="text-center py-4 text-secondary" th:text="#{label.vb.lines.empty}">No lines selected.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="card-body border-top">
                            <div class="row justify-content-end">
                                <div class="col-md-5 col-lg-4">
                                    <div class="d-flex justify-content-between mb-2">
                                        <span class="text-secondary" th:text="#{label.vb.recap.dpp}">DPP</span>
                                        <strong id="vb-recap-dpp">0.00</strong>
                                    </div>
                                    <div class="d-flex justify-content-between mb-2">
                                        <span class="text-secondary" th:text="#{label.vb.recap.tax}">Tax</span>
                                        <strong id="vb-recap-tax">0.00</strong>
                                    </div>
                                    <div class="d-flex justify-content-between mb-2">
                                        <span class="text-secondary" th:text="#{label.vb.recap.total}">Total Invoice</span>
                                        <strong id="vb-recap-total">0.00</strong>
                                    </div>
                                    <div class="d-flex justify-content-between">
                                        <span class="text-secondary" th:text="#{label.vb.recap.totalBase}">Total Base</span>
                                        <strong id="vb-recap-total-base">0.00</strong>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="card-footer text-end">
                            <button type="submit" class="btn btn-primary">
                                <i class="ti ti-device-floppy me-1"></i><span th:text="#{label.save}">Save</span>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <th:block id="page-specific-scripts">
        <script th:src="@{/js/accountspayable/vendor-bills/form.js}"></script>
    </th:block>
</body>

</html>
