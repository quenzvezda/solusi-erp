<div id="vendor-bill-selector-body" xmlns:th="http://www.thymeleaf.org">
    <div class="table-responsive">
        <table class="table table-hover table-vcenter">
            <thead><tr><th th:text="#{label.vb.title}">Vendor Bill</th><th class="text-end" th:text="#{label.vb.outstandingAmount}">Outstanding</th><th class="text-end" th:text="#{label.exchange.rate}">Rate</th></tr></thead>
            <tbody>
            <tr th:each="row : ${page.content}" class="js-dma-vendor-bill-option"
                th:data-id="${row.id}" th:data-code="${row.code}" th:data-outstanding="${row.outstandingAmount}" th:data-exchange-rate="${row.exchangeRate}">
                <td th:text="${row.code}">VB-001</td>
                <td class="text-end" th:text="${#numbers.formatDecimal(row.outstandingAmount, 1, 'COMMA', 2, 'POINT')}">0.00</td>
                <td class="text-end" th:text="${row.exchangeRate}">1.000000</td>
            </tr>
            <tr th:if="${page == null || #lists.isEmpty(page.content)}"><td colspan="3" class="text-center text-secondary py-4" th:text="#{label.no.data}">No data.</td></tr>
            </tbody>
        </table>
    </div>
</div>
