<div id="debit-memo-selector-body" th:fragment="debit-memo-selector-body" xmlns:th="http://www.thymeleaf.org">
    <div class="table-responsive">
        <table class="table table-hover table-vcenter">
            <thead><tr><th th:text="#{label.debit-memo.title}">Debit Memo</th><th class="text-end" th:text="#{label.debit-memo.gross}">Gross</th><th class="text-end" th:text="#{label.debit-memo.remaining}">Remaining</th></tr></thead>
            <tbody>
            <tr th:each="row : ${page.content}" class="js-dma-debit-memo-option"
                th:data-id="${row.id}" th:data-code="${row.code}" th:data-remaining="${row.remainingAmountOriginal}">
                <td th:text="${row.code}">DM-001</td>
                <td class="text-end" th:text="${#numbers.formatDecimal(row.grossAmountOriginal, 1, 'COMMA', 2, 'POINT')}">0.00</td>
                <td class="text-end" th:text="${#numbers.formatDecimal(row.remainingAmountOriginal, 1, 'COMMA', 2, 'POINT')}">0.00</td>
            </tr>
            <tr th:if="${page == null || #lists.isEmpty(page.content)}"><td colspan="3" class="text-center text-secondary py-4" th:text="#{label.no.data}">No data.</td></tr>
            </tbody>
        </table>
    </div>
</div>
