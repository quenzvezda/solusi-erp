<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
    <th:block th:replace="~{fragments/head :: core(${title})}"></th:block>

    <!-- TomSelect (Autocomplete) CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2/dist/css/tom-select.bootstrap5.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/tomselect-custom.css}">
</head>


<body th:fragment="layout(content)">
    <div class="page">
        <!-- Sidebar Fragment -->
        <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

        <div class="page-wrapper">
            <!-- Header Fragment -->
            <header th:replace="~{fragments/header :: header}"></header>

            <!-- Main Content -->
            <main class="page-body">
                <div class="container-xl">
                    <!-- This will replace with the content fragment passed from pages -->
                    <div th:replace="${content}"></div>
                </div>
            </main>

            <footer class="footer footer-transparent d-print-none">
                <div class="container-xl text-center">
                    Copyright &copy; 2026 Solusi ERP.
                </div>
            </footer>
        </div>
    </div>

    <!-- Tabler Core JS (CDN Latest) -->
    <script src="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/js/tabler.min.js" defer></script>
    <!-- ApexCharts JS (CDN Latest) -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts@latest/dist/apexcharts.min.js" defer></script>
    <!-- TomSelect (Autocomplete) JS -->
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2/dist/js/tom-select.complete.min.js" defer></script>
    
    <!-- Global Utilities & Autocomplete Initialization -->
    <script>
        // Global Debounce Function
        function debounce(fn, delay) {
            let timer;
            return function (...args) {
                clearTimeout(timer);
                timer = setTimeout(() => fn.apply(this, args), delay);
            };
        }

        // Global TomSelect Initialization (Golden Standard)
        function initLookup(el, type, parentProvider = null) {
            if (!el) return null;
            if (el.tomselect) el.tomselect.destroy();
            
            const ts = new TomSelect(el, {
                valueField: 'id',
                labelField: 'name',
                searchField: ['name'],
                placeholder: '-- Select --',
                allowEmptyOption: false,
                preload: 'focus', 
                dropdownParent: 'body',
                onInitialize: function() {
                    // Apply ERP Standard wrapper class
                    this.wrapper.classList.add('erp-input-ts');
                    
                    // Check if this element is inside a table line
                    if (el.closest('.line-row')) {
                        this.wrapper.classList.add('erp-input-ts-sm');
                    }
                    this.control.style.width = '100%';
                    
                    // Map data-subtext from initial option if exists (SSR Sync)
                    const initialOption = el.querySelector('option[selected], option[value]:not([value=""])');
                    if (initialOption) {
                        const val = initialOption.value;
                        const subText = initialOption.getAttribute('data-subtext');
                        if (subText && this.options[val]) {
                            this.options[val].subText = subText;
                            this.refreshOptions(false);
                        }
                    }
                },
                load: debounce(function(q, callback) {
                    let url = `/api/lookup/${type}?q=${encodeURIComponent(q)}&limit=10`;
                    if (parentProvider) {
                        const parent = parentProvider();
                        if (parent && parent.id) {
                            url += `&${parent.key || 'parentId'}=${parent.id}`;
                        }
                    }
                    fetch(url).then(r => r.json()).then(callback).catch(() => callback([]));
                }, 150),
                render: {
                    option: (data, escape) => {
                        if (!data.id) return '';
                        let sub = data.subText ? `<small class="text-muted d-block" style="font-size:0.75em">${escape(data.subText)}</small>` : '';
                        return `<div class="py-1"><div>${escape(data.name)}</div>${sub}</div>`;
                    },
                    item: (data, escape) => {
                        return `<span>${escape(data.name)}</span>`;
                    }
                }
            });

            if (parentProvider) {
                ts.on('dropdown_open', () => {
                    ts.clearCache();
                    ts.clearOptions();
                    ts.load('');
                });
            }

            return ts;
        }

        document.addEventListener('DOMContentLoaded', function () {
            const menuSearchEl = document.getElementById('global-menu-search');
            if (menuSearchEl) {
                new TomSelect('#global-menu-search', {
                    valueField: 'urlPath',
                    labelField: 'name',
                    searchField: ['name'],
                    openOnFocus: true,
                    preload: false,
                    load: debounce(function (q, callback) {
                        fetch(`/api/lookup/menus?q=${encodeURIComponent(q)}&limit=10`)
                            .then(r => r.json())
                            .then(callback)
                            .catch(() => callback([]));
                    }, 100),
                    render: {
                        option: function(data, escape) {
                            const sub = data.subText ? `<small class="text-muted d-block" style="font-size:0.75em;line-height:1.2">${escape(data.subText)}</small>` : '';
                            return `<div class="py-1">${escape(data.name)}${sub}</div>`;
                        },
                        item: function(data, escape) {
                            return `<span>${escape(data.name)}</span>`;
                        }
                    },
                    onChange: function(value) {
                        if (value) {
                            window.location.href = value;
                        }
                    }
                });
            }
        });
    </script>
</body>

</html>
