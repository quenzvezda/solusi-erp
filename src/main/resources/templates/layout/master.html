<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
    <th:block th:replace="~{fragments/head :: core(${title})}"></th:block>

    <!-- TomSelect (Autocomplete) CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2/dist/css/tom-select.bootstrap5.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/tomselect-custom.css}">
</head>


<body th:fragment="layout(content, pageScripts)" 
      th:attr="hx-headers='{&quot;' + ${_csrf.headerName} + '&quot;: &quot;' + ${_csrf.token} + '&quot;}'">
    
    <!-- Global Modals -->
    <div th:replace="~{fragments/modals :: standard-modals}"></div>
    
    <!-- Global Drawers -->
    <div th:replace="~{fragments/drawers :: item-detail-drawer('drawer-item-detail', 'Detail Item')}"></div>
    <button id="btn-trigger-drawer-item-detail" class="d-none" data-bs-toggle="offcanvas" data-bs-target="#drawer-item-detail"></button>

    <div class="page">
        <!-- Sidebar Fragment -->
        <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

        <div class="page-wrapper">
            <!-- Header Fragment -->
            <header th:replace="~{fragments/header :: header}"></header>

            <!-- Main Content -->
            <main class="page-body">
                <div class="container-xl">
                    <!-- This will replace with the content fragment passed from pages -->
                    <div th:replace="${content}"></div>
                </div>
            </main>

            <footer class="footer footer-transparent d-print-none">
                <div class="container-xl text-center">
                    Copyright &copy; 2026 Solusi ERP.
                </div>
            </footer>
        </div>
    </div>

    <!-- Tabler Core JS (CDN Latest) -->
    <script src="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/js/tabler.min.js" defer></script>
    <!-- ApexCharts JS (CDN Latest) -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts@latest/dist/apexcharts.min.js" defer></script>
    <!-- TomSelect (Autocomplete) JS -->
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2/dist/js/tom-select.complete.min.js" defer></script>
    
    <!-- Global i18n for JavaScript -->
    <script th:inline="javascript">
        window.ErpI18n = {
            errorTitle: /*[[#{msg.error.ajax.title}]]*/ 'An Error Occurred',
            serverError: /*[[#{msg.error.ajax.server}]]*/ 'An unexpected server error occurred.',
            networkError: /*[[#{msg.error.ajax.network}]]*/ 'Connection error. Please check your network.',
            successGeneric: /*[[#{msg.success.ajax.generic}]]*/ 'Action completed successfully.'
        };
    </script>

    <!-- ERP Global Helpers & Utilities -->
    <script th:src="@{/js/erp-common-handler.js}" defer></script>
    <!-- ERP Form Handler (AJAX) -->
    <script th:src="@{/js/erp-form-handler.js}" defer></script>
    
    <!-- Global Page Lifecycle & HTMX Handlers -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            initNumericInputs();
            initAllLookups();

            const menuSearchEl = document.getElementById('global-menu-search');
            if (menuSearchEl) {
                new TomSelect('#global-menu-search', {
                    valueField: 'urlPath',
                    labelField: 'name',
                    searchField: ['name'],
                    openOnFocus: true,
                    preload: false,
                    load: debounce(function (q, callback) {
                        fetch(`/api/lookup/menus?q=${encodeURIComponent(q)}&limit=10`)
                            .then(r => r.json())
                            .then(callback)
                            .catch(() => callback([]));
                    }, 100),
                    render: {
                        option: function(data, escape) {
                            const sub = data.subText ? `<small class="text-muted d-block" style="font-size:0.75em;line-height:1.2">${escape(data.subText)}</small>` : '';
                            return `<div class="py-1">${escape(data.name)}${sub}</div>`;
                        },
                        item: function(data, escape) {
                            return `<span>${escape(data.name)}</span>`;
                        }
                    },
                    onChange: function(value) {
                        if (value) window.location.href = value;
                    }
                });
            }
        });

        document.body.addEventListener('htmx:afterSwap', function (evt) {
            initNumericInputs(evt.detail.target);
            initAllLookups(evt.detail.target);
        });

        /**
         * Global HTMX Error Listener
         * Handles non-200 responses and displays error messages from ApiResponse
         */
        document.body.addEventListener('htmx:responseError', function(evt) {
            const xhr = evt.detail.xhr;
            let errorMessage = window.ErpI18n.serverError;

            try {
                const response = JSON.parse(xhr.responseText);
                if (response && response.message) {
                    errorMessage = response.message;
                }
            } catch (e) {
                if (xhr.responseText && xhr.responseText.length < 200) {
                    errorMessage = xhr.responseText;
                } else if (xhr.statusText) {
                    errorMessage = xhr.statusText;
                }
            }

            // Trigger modal using global helper
            if (window.ErpModal) {
                ErpModal.showError(errorMessage);
            } else {
                alert(errorMessage);
            }
        });
    </script>

    <!-- Hidden Trigger for Error Modal -->
    <button id="btn-trigger-global-error" class="d-none" data-bs-toggle="modal" data-bs-target="#modal-global-error"></button>

    <!-- Optional Page-specific scripts -->
    <th:block th:replace="${pageScripts} ?: ~{}"></th:block>
</body>

</html>
