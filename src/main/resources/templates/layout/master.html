<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
    <th:block th:replace="~{fragments/head :: core(${title})}"></th:block>

    <!-- TomSelect (Autocomplete) CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2/dist/css/tom-select.bootstrap5.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/tomselect-custom.css}">
</head>


<body th:fragment="layout(content, pageScripts)">
    <div class="page">
        <!-- Sidebar Fragment -->
        <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

        <div class="page-wrapper">
            <!-- Header Fragment -->
            <header th:replace="~{fragments/header :: header}"></header>

            <!-- Main Content -->
            <main class="page-body">
                <div class="container-xl">
                    <!-- This will replace with the content fragment passed from pages -->
                    <div th:replace="${content}"></div>
                </div>
            </main>

            <footer class="footer footer-transparent d-print-none">
                <div class="container-xl text-center">
                    Copyright &copy; 2026 Solusi ERP.
                </div>
            </footer>
        </div>
    </div>

    <!-- Tabler Core JS (CDN Latest) -->
    <script src="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/js/tabler.min.js" defer></script>
    <!-- ApexCharts JS (CDN Latest) -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts@latest/dist/apexcharts.min.js" defer></script>
    <!-- TomSelect (Autocomplete) JS -->
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2/dist/js/tom-select.complete.min.js" defer></script>
    
    <!-- Global Utilities & Autocomplete Initialization -->
    <script>
        // Global Debounce Function
        function debounce(fn, delay) {
            let timer;
            return function (...args) {
                clearTimeout(timer);
                timer = setTimeout(() => fn.apply(this, args), delay);
            };
        }

        /**
         * Initialize AutoNumeric for all inputs with numeric classes
         */
        function initNumericInputs(container = document) {
            if (typeof AutoNumeric === 'undefined') return;

            const decimalOptions = {
                digitGroupSeparator: ',',
                decimalCharacter: '.',
                decimalPlaces: 2,
                minimumValue: '0',
                unformatOnSubmit: false,
                modifyValueOnWheel: false
            };

            const integerOptions = {
                digitGroupSeparator: ',',
                decimalPlaces: 0,
                minimumValue: '0',
                unformatOnSubmit: false,
                modifyValueOnWheel: false
            };

            container.querySelectorAll('.erp-number-decimal:not([data-autonumeric])').forEach(el => {
                new AutoNumeric(el, decimalOptions);
                el.setAttribute('data-autonumeric', 'true');
            });

            container.querySelectorAll('.erp-number-integer:not([data-autonumeric])').forEach(el => {
                new AutoNumeric(el, integerOptions);
                el.setAttribute('data-autonumeric', 'true');
            });
        }

        /**
         * Initialize TomSelect for generic lookups
         * @param {HTMLElement} el - Select element
         * @param {string} lookupPath - API path (e.g., 'inventory/products')
         * @param {function} parentProvider - Callback for cascading lookups
         */
        function initLookup(el, lookupPath, parentProvider = null) {
            if (!el || typeof TomSelect === 'undefined') return null;
            if (el.tomselect) el.tomselect.destroy();

            const ts = new TomSelect(el, {
                valueField: 'id',
                labelField: 'name',
                searchField: ['name'],
                placeholder: '-- Select --',
                allowEmptyOption: false,
                preload: 'focus', 
                dropdownParent: 'body',
                onInitialize: function() {
                    this.wrapper.classList.add('erp-input-ts');
                    if (el.closest('.line-row')) {
                        this.wrapper.classList.add('erp-input-ts-sm');
                    }
                    this.control.style.width = '100%';
                    
                    // Map data-subtext from initial option if exists (SSR Sync)
                    const initialOption = el.querySelector('option[selected], option[value]:not([value=""])');
                    if (initialOption) {
                        const val = initialOption.value;
                        if (this.options[val]) {
                            // SubText
                            const subText = initialOption.getAttribute('data-subtext');
                            if (subText) this.options[val].subText = subText;

                            // Generic Payload Mapping (data-payload-*)
                            const payload = {};
                            Array.from(initialOption.attributes).forEach(attr => {
                                if (attr.name.startsWith('data-payload-')) {
                                    const key = attr.name.replace('data-payload-', '');
                                    payload[key] = attr.value;
                                }
                            });
                            this.options[val].payload = payload;
                            this.refreshOptions(false);
                        }
                    }
                },
                load: debounce(function(q, callback) {
                    let url = `/api/lookup/${lookupPath}?q=${encodeURIComponent(q)}&limit=10`;
                    if (parentProvider) {
                        const parent = parentProvider();
                        if (parent && parent.id) {
                            url += `&${parent.key || 'parentId'}=${parent.id}`;
                        }
                    }
                    fetch(url).then(r => r.json()).then(callback).catch(() => callback([]));
                }, 150),
                render: {
                    option: (data, escape) => {
                        if (!data.id) return '';
                        let sub = data.subText ? `<small class="text-muted d-block" style="font-size:0.75em">${escape(data.subText)}</small>` : '';
                        return `<div class="py-1"><div>${escape(data.name)}</div>${sub}</div>`;
                    },
                    item: (data, escape) => {
                        return `<span>${escape(data.name)}</span>`;
                    }
                }
            });

            if (parentProvider) {
                ts.on('dropdown_open', () => {
                    ts.clearCache();
                    ts.clearOptions();
                    ts.load('');
                });
            }

            return ts;
        }

        /**
         * Automatically initialize all lookups with data-lookup-path attribute
         */
        function initAllLookups(container = document) {
            container.querySelectorAll('select.erp-input-ts[data-lookup-path]:not(.tomselect-initialized)').forEach(el => {
                const path = el.getAttribute('data-lookup-path');
                initLookup(el, path);
                el.classList.add('tomselect-initialized');
            });
        }

        document.addEventListener('DOMContentLoaded', function () {
            initNumericInputs();
            initAllLookups();

            const menuSearchEl = document.getElementById('global-menu-search');
            if (menuSearchEl) {
                new TomSelect('#global-menu-search', {
                    valueField: 'urlPath',
                    labelField: 'name',
                    searchField: ['name'],
                    openOnFocus: true,
                    preload: false,
                    load: debounce(function (q, callback) {
                        fetch(`/api/lookup/menus?q=${encodeURIComponent(q)}&limit=10`)
                            .then(r => r.json())
                            .then(callback)
                            .catch(() => callback([]));
                    }, 100),
                    render: {
                        option: function(data, escape) {
                            const sub = data.subText ? `<small class="text-muted d-block" style="font-size:0.75em;line-height:1.2">${escape(data.subText)}</small>` : '';
                            return `<div class="py-1">${escape(data.name)}${sub}</div>`;
                        },
                        item: function(data, escape) {
                            return `<span>${escape(data.name)}</span>`;
                        }
                    },
                    onChange: function(value) {
                        if (value) window.location.href = value;
                    }
                });
            }
        });

        document.body.addEventListener('htmx:afterSwap', function (evt) {
            initNumericInputs(evt.detail.target);
            initAllLookups(evt.detail.target);
        });
    </script>

    <!-- Optional Page-specific scripts -->
    <th:block th:replace="${pageScripts} ?: ~{}"></th:block>
</body>

</html>
