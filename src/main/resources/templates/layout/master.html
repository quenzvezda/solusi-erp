<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <meta http-equiv="X-UA-Compatible" content="ie=edge"/>
    <title th:text="${title} + ' - Solusi ERP'">Solusi ERP</title>

    <!-- Performance: DNS Prefetch & Preconnect -->
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

    <!-- Tabler Core CSS (CDN Latest) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css">
    <!-- Tabler Icons CSS (CDN Latest) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    <!-- Inter Font (CDN) -->
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    
    <style>
        :root {
            --tblr-font-sans-serif: 'Inter var', -apple-system, BlinkMacSystemFont, San Francisco, Segoe UI, Roboto, Helvetica Neue, sans-serif;
        }
        .ti {
            display: inline-block;
            vertical-align: middle;
        }
    </style>
</head>
<body th:fragment="layout(content)">
    <div class="page">
        <!-- Sidebar Fragment -->
        <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

        <div class="page-wrapper">
            <!-- Header Fragment -->
            <header th:replace="~{fragments/header :: header}"></header>

            <!-- Main Content -->
            <main class="page-body">
                <div class="container-xl">
                    <!-- This will replace with the content fragment passed from pages -->
                    <div th:replace="${content}"></div>
                </div>
            </main>

            <footer class="footer footer-transparent d-print-none">
                <div class="container-xl text-center">
                    Copyright &copy; 2026 Solusi ERP.
                </div>
            </footer>
        </div>
    </div>

    <!-- Tabler Core JS (CDN Latest) -->
    <script src="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/js/tabler.min.js" defer></script>
    <!-- ApexCharts JS (CDN Latest) -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts@latest/dist/apexcharts.min.js" defer></script>
</body>
</html>
