<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layout/master :: head(#{label.approval.manage.title})}"></head>

<body th:replace="~{layout/master :: layout(~{:: .approval-manage-content}, ~{:: #page-specific-scripts})}">
<div class="approval-manage-content">

    <div class="page-header d-print-none">
        <div class="container-xl">
            <div class="row g-2 align-items-center">
                <div class="col">
                    <h2 class="page-title" th:text="#{label.approval.manage.title}">Kelola Persetujuan</h2>
                    <div class="text-secondary mt-1" th:text="#{label.approval.manage.subtitle}">
                        Semua approval request di sistem.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="page-body">
        <div class="container-xl">
            <div class="card">
                <div class="card-body border-bottom py-3">
                    <div class="d-flex">
                        <div class="ms-auto text-secondary">
                            <form th:action="@{/common/approval/manage}" method="get" class="input-icon"
                                  hx-get="/common/approval/manage"
                                  hx-target="#approval-manage-table-container"
                                  hx-trigger="keyup changed delay:500ms from:#approval-manage-search-input">
                                <input id="approval-manage-search-input" type="text" name="keyword" th:value="${keyword}"
                                       class="form-control form-control-sm"
                                       th:placeholder="#{label.approval.search.placeholder}">
                                <span class="input-icon-addon">
                                    <i class="ti ti-search"></i>
                                </span>
                            </form>
                        </div>
                    </div>
                </div>
                <div id="approval-manage-table-container" th:fragment="approval-manage-table-container">
                <div class="table-responsive">
                    <table class="table card-table table-vcenter">
                        <thead>
                            <tr>
                                <th th:text="#{label.approval.reference-type}">Tipe Dokumen</th>
                                <th th:text="#{label.approval.reference-code}">Kode Dokumen</th>
                                <th th:text="#{label.approval.assigned-to}">Ditugaskan ke</th>
                                <th th:text="#{label.approval.status}">Status</th>
                                <th th:text="#{label.approval.submitted-date}">Tanggal Diajukan</th>
                                <th class="w-1" th:text="#{label.actions}">Aksi</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${page.content}">
                                <td>
                                    <span class="badge bg-blue-lt"
                                          th:text="${#messages.msgOrNull('label.approval.reference-type.' + #strings.toLowerCase(item.referenceType)) ?: item.referenceType}">NEWS</span>
                                </td>
                                <td th:text="${item.referenceCode ?: '#' + item.referenceId}">#1</td>
                                <td th:text="${item.currentApproverName ?: '-'}">-</td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${item.status == 'PENDING' ? 'bg-warning-lt' :
                                                          (item.status == 'COMPLETED' ? 'bg-success-lt' :
                                                          (item.status == 'REJECTED' ? 'bg-danger-lt' : 'bg-secondary-lt'))}"
                                          th:text="${#messages.msg('label.approval.status.' + #strings.toLowerCase(item.status))}">
                                        Pending
                                    </span>
                                </td>
                                <td th:text="${item.histories != null and !item.histories.isEmpty() ?
                                               #temporals.format(item.histories[0].actionDate, 'dd MMM yyyy HH:mm') : '-'}">-</td>
                                <td>
                                    <div class="btn-list flex-nowrap justify-content-end">
                                        <a th:href="@{/common/approval/{id}/view(id=${item.requestId})}"
                                           class="btn btn-sm btn-white">
                                            <i class="ti ti-list-details me-1"></i>
                                            <span th:text="#{label.view}">View</span>
                                        </a>
                                        <a th:if="${item.referenceType == 'NEWS'}"
                                           th:href="@{/common/news/{id}(id=${item.referenceId})}"
                                           class="btn btn-sm btn-outline-secondary">
                                            <i class="ti ti-eye me-1"></i>
                                            <span th:text="#{label.news.module}">News</span>
                                        </a>
                                        <button th:if="${item.status == 'PENDING'}"
                                                type="button"
                                                class="btn btn-sm btn-outline-primary"
                                                th:attr="data-request-id=${item.requestId}"
                                                onclick="openReassignModal(this.dataset.requestId)">
                                            <i class="ti ti-user-share me-1"></i>
                                            <span th:text="#{label.approval.btn.reassign}">Reassign</span>
                                        </button>
                                        <span th:if="${item.referenceType != 'NEWS'}"
                                              class="text-secondary small"
                                              th:text="'#' + ${item.referenceId}"></span>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${page.isEmpty()}">
                                <td colspan="6" class="text-center py-4 text-secondary">
                                    <i class="ti ti-inbox me-2"></i>
                                    <span th:text="#{label.approval.manage.empty}">Tidak ada approval request.</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div th:replace="~{fragments/table :: pagination(${page})}"></div>
                </div><!-- end #approval-manage-table-container -->
            </div>
        </div>
    </div>

</div>

<div id="page-specific-scripts" th:fragment="pageScripts">
    <button id="btn-trigger-modal-reassign" class="d-none" data-bs-toggle="modal" data-bs-target="#modal-reassign-approval"></button>
    <div class="modal fade" id="modal-reassign-approval" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" th:text="#{label.approval.reassign.title}">Reassign Approval</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="reassign-request-id"/>
                    <div class="mb-3">
                        <label class="form-label">
                            <span th:text="#{label.approval.assigned-to}">Assigned To</span>
                            <span class="text-danger ms-1">*</span>
                        </label>
                        <select id="reassign-approver" class="erp-input-ts"
                                data-lookup-path="parties/by-role-type?roleTypeCode=APPROVER">
                            <option value="">-- Select Approver --</option>
                        </select>
                        <div class="invalid-feedback d-block d-none" id="reassign-approver-error"
                             th:text="#{label.approval.reassign.approver-required}">Please select an approver.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">
                            <span th:text="#{label.approval.notes}">Notes</span>
                            <span class="text-danger ms-1">*</span>
                        </label>
                        <textarea id="reassign-notes" class="form-control" rows="3"></textarea>
                        <div class="invalid-feedback d-block d-none" id="reassign-notes-error"
                             th:text="#{label.approval.reassign.notes-required}">Notes are required.</div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" th:text="#{label.cancel}">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="submitReassign()">
                        <i class="ti ti-device-floppy me-1"></i>
                        <span th:text="#{label.save}">Save</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        const csrfHeader = /*[[${_csrf.headerName}]]*/ '';
        const csrfToken = /*[[${_csrf.token}]]*/ '';

        function openReassignModal(requestId) {
            document.getElementById('reassign-request-id').value = requestId;
            document.getElementById('reassign-notes').value = '';
            hideReassignError('reassign-notes-error');
            hideReassignError('reassign-approver-error');

            const selectEl = document.getElementById('reassign-approver');
            if (selectEl && !selectEl.tomselect && typeof initLookup === 'function') {
                initLookup(selectEl, selectEl.getAttribute('data-lookup-path'));
            }
            if (selectEl && selectEl.tomselect) {
                selectEl.tomselect.clear();
            }

            document.getElementById('btn-trigger-modal-reassign').click();
        }

        function submitReassign() {
            const requestId = document.getElementById('reassign-request-id').value;
            const notes = document.getElementById('reassign-notes').value.trim();
            const selectEl = document.getElementById('reassign-approver');
            const targetApproverId = selectEl.tomselect ? selectEl.tomselect.getValue() : selectEl.value;

            let hasError = false;
            if (!notes) {
                showReassignError('reassign-notes-error');
                hasError = true;
            } else {
                hideReassignError('reassign-notes-error');
            }

            if (!targetApproverId) {
                showReassignError('reassign-approver-error');
                hasError = true;
            } else {
                hideReassignError('reassign-approver-error');
            }

            if (hasError) return;

            fetch(`/common/approval/${requestId}/reassign`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json',
                    [csrfHeader]: csrfToken
                },
                body: JSON.stringify({
                    targetApproverId: parseInt(targetApproverId, 10),
                    notes: notes
                })
            })
            .then(async res => {
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || 'Error');
                window.location.reload();
            })
            .catch(err => {
                if (window.ErpModal) ErpModal.showError(err.message);
                else alert(err.message);
            });
        }

        function showReassignError(id) {
            const el = document.getElementById(id);
            if (el) el.classList.remove('d-none');
        }

        function hideReassignError(id) {
            const el = document.getElementById(id);
            if (el) el.classList.add('d-none');
        }
    </script>
</div>
</body>
</html>
