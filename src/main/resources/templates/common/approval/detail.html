<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layout/master :: head(#{label.approval.detail.title})}"></head>

<body th:replace="~{layout/master :: layout(~{:: .approval-detail-content}, ~{:: #page-specific-scripts})}">
<div class="approval-detail-content">

    <div class="page-header d-print-none">
        <div class="container-xl">
            <div class="row g-2 align-items-center">
                <div class="col">
                    <div class="page-pretitle" th:text="#{label.approval.manage.title}">Manage Approvals</div>
                    <h2 class="page-title" th:text="#{label.approval.detail.title}">Approval Detail</h2>
                </div>
                <div class="col-auto ms-auto d-print-none">
                    <div class="btn-list">
                        <a href="javascript:history.back()" class="btn btn-outline-secondary">
                            <i class="ti ti-arrow-left me-1"></i>
                            <span th:text="#{label.approval.detail.back}">Back to List</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="page-body">
        <div class="container-xl">
            <div class="row g-3">

                <!-- Left: Request Info -->
                <div class="col-lg-4">
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">
                                <i class="ti ti-file-description me-1"></i>
                                <span th:text="#{label.approval.reference-type}">Document Info</span>
                            </h3>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <div class="text-secondary small mb-1" th:text="#{label.approval.reference-type}">Type</div>
                                <span class="badge bg-blue-lt fs-5"
                                      th:text="${#messages.msgOrNull('label.approval.reference-type.' + #strings.toLowerCase(approval.referenceType)) ?: approval.referenceType}">
                                    NEWS
                                </span>
                            </div>
                            <div class="mb-3">
                                <div class="text-secondary small mb-1" th:text="#{label.approval.reference-code}">Code</div>
                                <div class="fw-bold" th:text="${approval.referenceCode ?: '#' + approval.referenceId}">#1</div>
                            </div>
                            <div class="mb-3">
                                <div class="text-secondary small mb-1" th:text="#{label.approval.status}">Status</div>
                                <span class="badge fs-6"
                                      th:classappend="${approval.status == 'PENDING' ? 'bg-warning-lt' :
                                                      (approval.status == 'COMPLETED' ? 'bg-success-lt' :
                                                      (approval.status == 'REJECTED' ? 'bg-danger-lt' : 'bg-secondary-lt'))}"
                                      th:text="${#messages.msg('label.approval.status.' + #strings.toLowerCase(approval.status))}">
                                    Status
                                </span>
                            </div>
                            <div class="mb-3" th:if="${approval.currentApproverName != null and approval.status == 'PENDING'}">
                                <div class="text-secondary small mb-1" th:text="#{label.approval.assigned-to}">Assigned To</div>
                                <div class="fw-bold" th:text="${approval.currentApproverName}">Approver</div>
                            </div>
                            <div class="mt-3 d-flex gap-2">
                                <a th:if="${approval.documentUrl != null}"
                                   th:href="@{${approval.documentUrl}}"
                                   class="btn btn-sm btn-primary">
                                    <i class="ti ti-file-text me-1"></i>
                                    <span th:text="#{label.approval.view-document}">View Document</span>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right: Full History Timeline -->
                <div class="col-lg-8">
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">
                                <i class="ti ti-history me-1"></i>
                                <span th:text="#{label.approval.history}">Approval History</span>
                            </h3>
                        </div>
                        <div class="card-body">
                            <th:block th:if="${approval == null or approval.histories == null or approval.histories.isEmpty()}">
                                <p class="text-muted small mb-0" th:text="#{label.approval.empty}">No history yet.</p>
                            </th:block>

                            <div class="timeline" th:unless="${approval == null or approval.histories == null or approval.histories.isEmpty()}">
                                <div class="timeline-event" th:each="h : ${approval.histories}">
                                    <div class="timeline-event-icon"
                                         th:classappend="${h.action == 'REQUESTED' ? 'bg-blue-lt' :
                                                          (h.action == 'APPROVE_AND_FINISH' ? 'bg-success-lt' :
                                                           (h.action == 'APPROVE_AND_FORWARD' ? 'bg-success-lt' :
                                                            (h.action == 'FORWARD' ? 'bg-azure-lt' : 'bg-danger-lt')))}">
                                        <i class="ti"
                                           th:classappend="${h.action == 'REQUESTED' ? 'ti-send' :
                                                            (h.action == 'APPROVE_AND_FINISH' ? 'ti-check' :
                                                             (h.action == 'APPROVE_AND_FORWARD' ? 'ti-checks' :
                                                              (h.action == 'FORWARD' ? 'ti-arrow-forward' : 'ti-x')))}"></i>
                                    </div>
                                    <div class="card timeline-event-card">
                                        <div class="card-body">
                                            <div class="d-flex align-items-center mb-1">
                                                <strong class="me-auto"
                                                        th:text="${#messages.msg('label.approval.action.' + #strings.toLowerCase(h.action))}">Action</strong>
                                                <span class="text-muted small" th:text="${#temporals.format(h.actionDate, 'dd MMM yyyy HH:mm')}">Date</span>
                                            </div>
                                            <!-- Actor → Target layout: actor left, arrow center, target right -->
                                            <div th:if="${h.actorName != null}" class="text-muted small mb-2">
                                                <div class="d-flex align-items-center">
                                                    <div class="d-flex align-items-center gap-1 flex-fill" style="min-width:0">
                                                        <i class="ti ti-user flex-shrink-0" style="font-size: 12px;"></i>
                                                        <span class="text-truncate" th:text="${h.actorName}">Actor Name</span>
                                                    </div>
                                                    <th:block th:if="${h.targetApproverName != null}">
                                                        <i class="ti ti-arrow-right flex-shrink-0 mx-2" style="font-size: 12px;"></i>
                                                        <div class="d-flex align-items-center gap-1 flex-fill justify-content-end" style="min-width:0">
                                                            <i class="ti ti-user flex-shrink-0" style="font-size: 12px;"></i>
                                                            <span class="text-truncate text-end" th:text="${h.targetApproverName}">Assignee Name</span>
                                                        </div>
                                                    </th:block>
                                                </div>
                                            </div>
                                            <p class="text-secondary small mb-0" th:text="${h.notes ?: '-'}">Notes</p>
                                            <!-- Signature button: shown on approval actions, loaded via proxy -->
                                            <div th:if="${h.action == 'APPROVE_AND_FINISH' or h.action == 'APPROVE_AND_FORWARD'}"
                                                 class="mt-2 signature-slot" th:attr="data-actor-id=${h.actorId}">
                                                <div class="text-muted small">
                                                    <div class="spinner-border spinner-border-sm me-1" role="status" style="width:.75rem;height:.75rem;"></div>
                                                    Loading...
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Signature popup modal — must be inside this fragment so Thymeleaf layout renders it -->
    <div class="modal fade" id="modal-signature-view" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="ti ti-signature me-1"></i>
                        <span th:text="#{label.approval.detail.signature}">Decision Signature</span>
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center py-4" id="modal-signature-body">
                    <!-- Content injected by JS -->
                </div>
            </div>
        </div>
    </div>

</div>

<div id="page-specific-scripts" th:fragment="pageScripts">
    <script th:inline="javascript">
        const approvalRequestId = /*[[${approval.requestId}]]*/ null;
        const noSignatureMsg = /*[[#{label.approval.detail.no-signature}]]*/ 'No signature recorded.';
        const loadErrorMsg = /*[[#{label.approval.signature-load-error}]]*/ 'Failed to load signature image.';
        const viewSignatureLabel = /*[[#{label.approval.view-signature}]]*/ 'Signature';

        document.addEventListener('DOMContentLoaded', function () {
            if (!approvalRequestId) return;
            const slots = document.querySelectorAll('.signature-slot');

            // Fetch signature metadata — signatureUrl is a presigned MinIO URL
            // valid for 1 hour. <img src> loads it directly without CORS issues.
            fetch('/common/approval/' + approvalRequestId + '/signature', {
                headers: { 'Accept': 'application/json' }
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (data && data.data && data.data.signatureUrl) {
                    var presignedUrl = data.data.signatureUrl;
                    var signerUserId = data.data.signerUserId;
                    var matched = false;
                    slots.forEach(function(slot) {
                        var actorId = parseInt(slot.getAttribute('data-actor-id'), 10);
                        if (actorId === signerUserId || !matched) {
                            slot.innerHTML =
                                '<button type="button" class="btn btn-sm btn-outline-primary btn-view-signature">' +
                                '<i class="ti ti-signature me-1"></i>' + viewSignatureLabel +
                                '</button>';
                            slot.querySelector('.btn-view-signature').addEventListener('click', function() {
                                var modalBody = document.getElementById('modal-signature-body');
                                modalBody.innerHTML = '';

                                var img = new Image();
                                img.alt = 'Signature';
                                img.className = 'img-fluid border rounded';
                                img.style.cssText = 'max-height:300px; background:#fff;';
                                img.onerror = function() {
                                    img.style.display = 'none';
                                    var errDiv = document.createElement('div');
                                    errDiv.className = 'text-danger small py-3';
                                    errDiv.innerHTML =
                                        '<i class="ti ti-alert-triangle me-1"></i>' + loadErrorMsg;
                                    modalBody.appendChild(errDiv);
                                };
                                img.src = presignedUrl;
                                modalBody.appendChild(img);

                                new tabler.Modal(
                                    document.getElementById('modal-signature-view')).show();
                            });
                            matched = true;
                        } else {
                            slot.innerHTML =
                                '<span class="text-muted small"><i class="ti ti-signature-off me-1"></i>' +
                                noSignatureMsg + '</span>';
                        }
                    });
                } else {
                    slots.forEach(function(slot) {
                        slot.innerHTML =
                            '<span class="text-muted small"><i class="ti ti-signature-off me-1"></i>' +
                            noSignatureMsg + '</span>';
                    });
                }
            })
            .catch(function() {
                slots.forEach(function(slot) {
                    slot.innerHTML =
                        '<span class="text-danger small"><i class="ti ti-alert-triangle me-1"></i>' +
                        loadErrorMsg + '</span>';
                });
            });
        });
    </script>
</div>
</body>
</html>
