<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/master :: head(${isEdit != null and isEdit} ? #{label.news.form.edit.title} : #{label.news.form.create.title})}"></head>

<body th:replace="~{layout/master :: layout(~{:: .news-form-content}, ~{:: #page-specific-scripts})}">
<div class="news-form-content">

    <div class="page-header d-print-none">
        <div class="container-xl">
            <div class="row g-2 align-items-center">
                <div class="col">
                    <h2 class="page-title"
                        th:text="${isEdit != null and isEdit} ? #{label.news.form.edit.title} : #{label.news.form.create.title}">
                        Create News
                    </h2>
                </div>
            </div>
        </div>
    </div>

    <div class="page-body">
        <div class="container-xl">

            <form th:action="${news.id == null} ? '/common/news/create' : '/common/news/update/' + ${news.id}"
                  th:object="${news}"
                  method="post"
                  class="card"
                  id="news-form"
                  data-ajax-form="true"
                  th:attr="data-redirect-on-success=${news.id != null ? '/common/news/' + news.id : '/common/news'}">

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" th:field="*{id}"/>
                <input type="hidden" th:field="*{version}"/>

                <div class="card-body">
                    <div class="alert-container"></div>

                    <div class="mb-3">
                        <label class="form-label" th:text="#{label.news.title}">Title
                            <span class="text-danger ms-1">*</span>
                        </label>
                        <input type="text" th:field="*{title}" class="form-control erp-input"
                               th:placeholder="#{label.news.title}" required/>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}"
                             th:errors="*{title}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" th:text="#{label.news.content}">Content
                            <span class="text-danger ms-1">*</span>
                        </label>
                        <!-- Quill editor container -->
                        <div id="quill-editor" style="min-height: 250px;"></div>
                        <!-- Hidden input carries the HTML value to the server -->
                        <input type="hidden" id="content-input" th:field="*{content}" required/>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('content')}"
                             th:errors="*{content}"></div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label" th:text="#{label.news.publish-date}">Publish Date</label>
                            <input type="datetime-local" th:field="*{publishDate}" data-picker="datetime" class="form-control erp-input" required/>
                            <div class="form-text text-muted" th:text="#{label.news.publish-date.hint}">Set this while draft; it will be used when approved.</div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label" th:text="#{label.news.expiry-date}">Expiry Date</label>
                            <input type="datetime-local" th:field="*{expiryDate}" data-picker="datetime" class="form-control erp-input"/>
                        </div>
                    </div>

                    <div th:if="${news.id != null}" th:replace="~{fragments/audit-info :: audit-info(${news})}"></div>
                </div>

                <div class="card-footer text-end">
                    <div class="d-flex align-items-center">
                        <div id="loading-indicator" class="spinner-border spinner-border-sm text-primary me-2"
                             role="status" style="display: none;"></div>
                        <a th:href="@{/common/news}" class="btn btn-link link-secondary"
                           th:text="#{label.cancel}">Cancel</a>
                        <button type="submit" class="btn btn-primary ms-auto">
                            <i class="ti ti-device-floppy me-1"></i>
                            <span th:text="#{label.save}">Save</span>
                        </button>
                    </div>
                </div>

            </form>
        </div>
    </div>

</div>

<div id="page-specific-scripts" th:fragment="pageScripts">
    <!-- Quill rich text editor -->
    <link href="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.snow.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.js"></script>
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function () {
            const quill = new Quill('#quill-editor', {
                theme: 'snow',
                modules: {
                    toolbar: [
                        [{ header: [1, 2, 3, false] }],
                        ['bold', 'italic', 'underline', 'strike'],
                        [{ list: 'ordered' }, { list: 'bullet' }],
                        ['blockquote', 'link'],
                        ['clean']
                    ]
                }
            });

            // Seed existing content into Quill on edit
            const existingContent = document.getElementById('content-input').value;
            if (existingContent) {
                quill.clipboard.dangerouslyPasteHTML(existingContent);
            }

            // Copy Quill HTML to hidden input before form submit (capturing phase = runs first)
            const form = document.getElementById('news-form');
            form.addEventListener('submit', function () {
                document.getElementById('content-input').value = quill.getSemanticHTML();
            }, true);
        });
    </script>
</div>
</body>
</html>
