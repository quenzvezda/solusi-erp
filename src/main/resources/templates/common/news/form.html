<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/master :: head(${isEdit != null and isEdit} ? #{label.news.form.edit.title} : #{label.news.form.create.title})}"></head>

<body th:replace="~{layout/master :: layout(~{:: .news-form-content}, ~{:: #page-specific-scripts})}">
<div class="news-form-content">

    <div class="page-header d-print-none">
        <div class="container-xl">
            <div class="row g-2 align-items-center">
                <div class="col">
                    <h2 class="page-title"
                        th:text="${isEdit != null and isEdit} ? #{label.news.form.edit.title} : #{label.news.form.create.title}">
                        Create News
                    </h2>
                </div>
            </div>
        </div>
    </div>

    <div class="page-body">
        <div class="container-xl">

            <form th:action="${news.id == null} ? '/common/news/create' : '/common/news/update/' + ${news.id}"
                  th:object="${news}"
                  method="post"
                  class="card"
                  id="news-form"
                  data-ajax-form="true"
                  th:attr="data-redirect-on-success=${news.id != null ? '/common/news/' + news.id : '/common/news'}">

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" th:field="*{id}"/>
                <input type="hidden" th:field="*{version}"/>

                <div class="card-body">
                    <div class="alert-container"></div>

                    <div class="mb-3">
                        <label class="form-label" th:text="#{label.news.title}">Title
                            <span class="text-danger ms-1">*</span>
                        </label>
                        <input type="text" th:field="*{title}" class="form-control erp-input"
                               th:placeholder="#{label.news.title}" required/>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}"
                             th:errors="*{title}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" th:text="#{label.news.content}">Content
                            <span class="text-danger ms-1">*</span>
                        </label>
                        <textarea th:field="*{content}" class="form-control erp-input" rows="10"
                                  th:placeholder="#{label.news.content}" required></textarea>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('content')}"
                             th:errors="*{content}"></div>
                    </div>

                    <div th:if="${news.id != null}" th:replace="~{fragments/audit-info :: audit-info(${news})}"></div>
                </div>

                <div class="card-footer text-end">
                    <div class="d-flex align-items-center">
                        <div id="loading-indicator" class="spinner-border spinner-border-sm text-primary me-2"
                             role="status" style="display: none;"></div>
                        <a th:href="@{/common/news}" class="btn btn-link link-secondary"
                           th:text="#{label.cancel}">Cancel</a>
                        <button type="submit" class="btn btn-primary ms-auto">
                            <i class="ti ti-device-floppy me-1"></i>
                            <span th:text="#{label.save}">Save</span>
                        </button>
                    </div>
                </div>

            </form>
        </div>
    </div>

</div>

<div id="page-specific-scripts" th:fragment="pageScripts">
</div>
</body>
</html>
