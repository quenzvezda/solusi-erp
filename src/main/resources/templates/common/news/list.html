<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layout/master :: head(#{label.news.list.title})}"></head>

<body th:replace="~{layout/master :: layout(~{:: .news-list-content}, ~{})}">
<div class="news-list-content">

    <div class="page-header d-print-none">
        <div class="container-xl">
            <div class="row g-2 align-items-center">
                <div class="col">
                    <h2 class="page-title" th:text="#{label.news.list.title}">News</h2>
                </div>
                <div class="col-auto ms-auto d-print-none" sec:authorize="hasAuthority('NEWS_CREATE')">
                    <a th:href="@{/common/news/create}" class="btn btn-primary">
                        <i class="ti ti-plus icon"></i>
                        <span th:text="#{label.news.add}">Tambah Berita</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="page-body">
        <div class="container-xl">
            <div class="card">
                <div class="card-body border-bottom py-3">
                    <div class="d-flex">
                        <div class="ms-auto text-secondary">
                            <form th:action="@{/common/news}" method="get" class="input-icon"
                                  hx-get="/common/news"
                                  hx-target="#news-table-container"
                                  hx-trigger="keyup changed delay:500ms from:#news-search-input">
                                <input id="news-search-input" type="text" name="keyword" th:value="${keyword}"
                                       class="form-control form-control-sm" th:placeholder="#{label.search}">
                                <span class="input-icon-addon">
                                    <i class="ti ti-search"></i>
                                </span>
                            </form>
                        </div>
                    </div>
                </div>
                <div id="news-table-container" th:fragment="news-table-container"
                     hx-get="/common/news"
                     hx-trigger="refresh-table from:body delay:500ms"
                     hx-include="[name='keyword'], [name='page']">
                    <input type="hidden" name="page" th:value="${page.number}">
                    <div class="table-responsive">
                        <table class="table card-table table-vcenter">
                            <thead>
                                <tr>
                                    <th th:text="#{label.news.title}">Title</th>
                                    <th th:text="#{label.news.author}">Author</th>
                                    <th th:text="#{label.news.status}">Status</th>
                                    <th th:text="#{label.news.publish-date}">Publish Date</th>
                                    <th class="w-1" th:text="#{label.actions}">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item : ${page.content}">
                                    <td>
                                        <a th:href="@{/common/news/{id}(id=${item.id})}"
                                           class="font-weight-medium text-decoration-none"
                                           th:text="${item.title}">News Title</a>
                                    </td>
                                    <td th:text="${item.author ?: '-'}">Author</td>
                                    <td>
                                        <span class="badge"
                                              th:classappend="${item.status.name() == 'DRAFT' ? 'bg-secondary-lt' :
                                                              (item.status.name() == 'PENDING_APPROVAL' ? 'bg-warning-lt' :
                                                              (item.status.name() == 'PUBLISHED' ? 'bg-success-lt' : 'bg-muted-lt'))}"
                                              th:text="${item.status}">DRAFT</span>
                                    </td>
                                    <td th:text="${item.publishDate != null ? #temporals.format(item.publishDate, 'dd MMM yyyy') : '-'}">-</td>
                                    <td>
                                        <div class="btn-list flex-nowrap justify-content-end">
                                            <a th:href="@{/common/news/{id}(id=${item.id})}"
                                               class="btn btn-white btn-sm">
                                                <i class="ti ti-eye"></i>
                                            </a>
                                            <a th:if="${item.status.name() == 'DRAFT'}"
                                               th:href="@{/common/news/edit/{id}(id=${item.id})}"
                                               class="btn btn-white btn-sm"
                                               sec:authorize="hasAuthority('NEWS_UPDATE')">
                                                <i class="ti ti-edit"></i>
                                            </a>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${page.isEmpty()}">
                                    <td colspan="5" class="text-center py-4 text-secondary"
                                        th:text="#{label.news.empty}">No news found.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div th:replace="~{fragments/table :: pagination(${page})}"></div>
                </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
