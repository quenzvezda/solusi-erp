<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head
    th:replace="~{layout/master :: head(${tax.id == null ? #messages.msg('label.tax.add') : #messages.msg('label.tax.edit')})}">
</head>

<body th:replace="~{layout/master :: layout(~{:: .tax-form-content})}">
    <div class="tax-form-content">
        <!-- Page Header -->
        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title"
                            th:text="${tax.id == null ? #messages.msg('label.tax.add') : #messages.msg('label.tax.edit') + ': ' + tax.name}">
                            Form Pajak</h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Page Body -->
        <div class="page-body">
            <div class="container-xl">
                <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}">Error message</div>

                <form th:action="${tax.id == null ? '/master/taxes/create' : '/master/taxes/edit/' + tax.id}"
                    th:object="${tax}" method="post" class="card">
                    <input type="hidden" th:field="*{version}" />
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label required" th:text="#{label.tax.code}">Kode</label>
                                    <input type="text" th:field="*{code}" class="form-control"
                                        th:classappend="${#fields.hasErrors('code')} ? 'is-invalid' : (${tax.id != null} ? 'bg-light' : '')"
                                        th:placeholder="#{placeholder.tax.code}" th:readonly="${tax.id != null}">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('code')}"
                                        th:errors="*{code}">Error</div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label required" th:text="#{label.tax.name}">Nama</label>
                                    <input type="text" th:field="*{name}" class="form-control"
                                        th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                                        th:placeholder="#{placeholder.tax.name}">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}"
                                        th:errors="*{name}">Error</div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label required" th:text="#{label.tax.rate}">Rate (%)</label>
                                    <input type="number" step="0.01" th:field="*{rate}" class="form-control"
                                        th:classappend="${#fields.hasErrors('rate')} ? 'is-invalid'"
                                        th:placeholder="#{placeholder.tax.rate}">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('rate')}"
                                        th:errors="*{rate}">Error</div>
                                </div>
                            </div>
                            <div class="col-md-6 border-start-md">
                                <div class="mb-3">
                                    <label class="form-label" th:text="#{label.tax.note}">Catatan</label>
                                    <textarea th:field="*{note}" class="form-control" rows="4"
                                        th:placeholder="#{placeholder.tax.note}"></textarea>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('note')}"
                                        th:errors="*{note}">Error</div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" th:field="*{isActive}" />
                                        <span class="form-check-label" th:text="#{label.tax.is.active}">Aktif</span>
                                    </label>
                                </div>
                                <div class="mb-3">
                                    <label class="form-check">
                                        <input class="form-check-input" type="checkbox" th:field="*{isSubtract}" />
                                        <span class="form-check-label" th:text="#{label.tax.is.subtract}">Sifat
                                            Mengurangi</span>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer text-end">
                        <div class="d-flex">
                            <a th:href="@{/master/taxes}" class="btn btn-link" th:text="#{label.cancel}">Batal</a>
                            <button type="submit" class="btn btn-primary ms-auto" th:text="#{label.save}">Simpan
                                Pajak</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
