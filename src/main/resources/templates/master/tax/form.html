<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layout/master :: head(${taxRequest.id == null ? #messages.msg('label.tax.add') : #messages.msg('label.tax.edit')})}"></head>

<body th:replace="~{layout/master :: layout(~{:: .tax-form-content}, ~{})}">
    <div class="tax-form-content">
        <!-- Page Header -->
        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title" th:text="${taxRequest.id == null ? #messages.msg('label.tax.add') : #messages.msg('label.tax.edit') + ': ' + taxRequest.name}">
                            Form Pajak
                        </h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Page Body -->
        <div class="page-body">
            <div class="container-xl">
                <form th:action="${taxRequest.id == null ? '/master/taxes/create' : '/master/taxes/edit/' + taxRequest.id}"
                      th:object="${taxRequest}" method="post" class="card"
                      data-ajax-form="true"
                      data-redirect-on-success="/master/taxes">
                    
                    <input type="hidden" th:field="*{version}" />

                    <div class="card-body">
                        <!-- Alert Placeholder inside card-body for global errors -->
                        <div class="alert-container"></div>

                        <div class="row">
                            <!-- Left Column: Basic Info -->
                            <div class="col-md-6">
                                <h3 class="card-title" th:text="#{label.product.section.basic}">Informasi Dasar</h3>
                                
                                <div th:replace="~{fragments/inputs :: text(field='code', label=#{label.tax.code}, required=true, isReadonly=${taxRequest.id != null}, extraClass=${taxRequest.id != null ? 'bg-body-tertiary' : ''}, placeholder=#{placeholder.tax.code})}"></div>
                                
                                <div th:replace="~{fragments/inputs :: text(field='name', label=#{label.tax.name}, required=true, placeholder=#{placeholder.tax.name})}"></div>
                                
                                <div th:replace="~{fragments/inputs :: decimal(field='rate', label=#{label.tax.rate}, required=true, placeholder=#{placeholder.tax.rate})}"></div>
                            </div>

                            <!-- Right Column: Settings -->
                            <div class="col-md-6 border-start-md">
                                <h3 class="card-title" th:text="#{label.general.settings}">Pengaturan</h3>
                                
                                <div class="mb-3">
                                    <label class="form-label" th:text="#{label.tax.note}">Catatan</label>
                                    <textarea th:field="*{note}" class="form-control erp-input" rows="3" th:placeholder="#{placeholder.tax.note}"></textarea>
                                </div>

                                <div class="mb-3">
                                    <label class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" th:field="*{isActive}">
                                        <span class="form-check-label" th:text="#{label.active}">Aktif</span>
                                    </label>
                                </div>

                                <div class="mb-3">
                                    <label class="form-check">
                                        <input class="form-check-input" type="checkbox" th:field="*{isSubtract}">
                                        <span class="form-check-label" th:text="#{label.tax.is.subtract}">Sifat Mengurangi</span>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <!-- Record Info (Edit Mode) -->
                        <div th:if="${auditInfo != null and auditInfo.id != null}" 
                             th:replace="~{fragments/audit-info :: audit-info(${auditInfo})}"></div>
                    </div>

                    <!-- Card Footer -->
                    <div class="card-footer text-end">
                        <div class="d-flex align-items-center">
                            <div id="loading-indicator" class="spinner-border spinner-border-sm text-primary me-2" role="status" style="display: none;"></div>
                            <a th:href="@{/master/taxes}" class="btn btn-link link-secondary" th:text="#{label.cancel}">Batal</a>
                            <button type="submit" class="btn btn-primary ms-auto">
                                <i class="ti ti-device-floppy me-1"></i>
                                <span th:text="#{label.save}">Simpan</span>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
