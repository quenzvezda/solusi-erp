<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layout/master :: head(#{label.tax.title})}"></head>

<body th:replace="~{layout/master :: layout(~{:: .tax-list-content}, ~{})}">
    <div class="tax-list-content">
        <!-- Page Header -->
        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title" th:text="#{label.tax.title}">Manajemen Pajak</h2>
                        <div class="text-secondary mt-1" th:text="#{label.tax.subtitle}">Kelola data pajak.</div>
                    </div>
                    <!-- Page title actions -->
                    <div class="col-auto ms-auto d-print-none" sec:authorize="hasAuthority('TAX_CREATE')">
                        <div class="btn-list">
                            <a th:href="@{/master/taxes/create}" class="btn btn-primary d-none d-sm-inline-block">
                                <i class="ti ti-plus"></i>
                                <span th:text="#{label.tax.add}">Tambah Pajak Baru</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Page Body -->
        <div class="page-body">
            <div class="container-xl">
                <!-- Alerts -->
                <div th:if="${successMessage}" class="alert alert-success alert-dismissible" role="alert">
                    <div class="d-flex">
                        <div><i class="ti ti-check icon alert-icon"></i></div>
                        <div th:text="${successMessage}">Success!</div>
                    </div>
                    <a class="btn-close" data-bs-dismiss="alert" aria-label="close"></a>
                </div>
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible" role="alert">
                    <div class="d-flex">
                        <div><i class="ti ti-alert-circle icon alert-icon"></i></div>
                        <div th:text="${errorMessage}">Error!</div>
                    </div>
                    <a class="btn-close" data-bs-dismiss="alert" aria-label="close"></a>
                </div>

                <div class="card">
                    <div class="card-body border-bottom py-3">
                        <div class="d-flex">
                            <div class="text-secondary">
                                <!-- Future: Page Size Selector -->
                            </div>
                            <div class="ms-auto text-secondary">
                                <form th:action="@{/master/taxes}" method="get" class="input-icon"
                                      hx-get="/master/taxes" 
                                      hx-target="#tax-table-container" 
                                      hx-trigger="keyup changed delay:500ms from:#search-input">
                                    <input id="search-input" type="text" name="keyword" th:value="${keyword}"
                                        class="form-control form-control-sm" th:placeholder="#{label.search}">
                                    <span class="input-icon-addon">
                                        <i class="ti ti-search"></i>
                                    </span>
                                </form>
                            </div>
                        </div>
                    </div>
                    <div id="tax-table-container" th:fragment="tax-table-container"
                         hx-get="/master/taxes" 
                         hx-trigger="refresh-table from:body delay:500ms"
                         hx-include="[name='keyword'], [name='page']">
                        <input type="hidden" name="page" th:value="${page.number}">
                        <div class="table-responsive">
                            <table class="table table-vcenter card-table">
                                <thead>
                                    <tr>
                                        <th th:replace="~{fragments/table :: sortable('code', #{label.tax.column.code})}">
                                            Kode</th>
                                        <th th:replace="~{fragments/table :: sortable('name', #{label.tax.column.name})}">
                                            Nama</th>
                                        <th th:replace="~{fragments/table :: sortable('rate', #{label.tax.column.rate})}">
                                            Rate (%)</th>
                                        <th
                                            th:replace="~{fragments/table :: sortable('isSubtract', #{label.tax.is.subtract})}">
                                            Sifat Mengurangi</th>
                                        <th th:text="#{label.tax.column.status}">Status</th>
                                        <th class="w-1" th:text="#{label.actions}">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="item : ${page.content}" th:id="'tax-row-' + ${item.id}">
                                        <td th:text="${item.code}">CODE</td>
                                        <td class="font-weight-medium" th:text="${item.name}">Name</td>
                                        <td th:text="${item.rate + '%'}">Rate</td>
                                        <td>
                                            <span th:if="${item.isSubtract}" class="badge bg-warning text-warning-fg"
                                                th:text="#{label.yes}">Ya</span>
                                            <span th:unless="${item.isSubtract}"
                                                class="badge bg-secondary text-secondary-fg"
                                                th:text="#{label.no}">Tidak</span>
                                        </td>
                                        <td>
                                            <span class="badge badge-outline text-green" th:if="${item.isActive}">
                                                <span class="badge-dot bg-success me-1"></span>
                                                <span th:text="#{label.active}">Aktif</span>
                                            </span>
                                            <span class="badge badge-outline text-red" th:unless="${item.isActive}">
                                                <span class="badge-dot bg-danger me-1"></span>
                                                <span th:text="#{label.inactive}">Tidak Aktif</span>
                                            </span>
                                        </td>
                                        <td class="text-end">
                                            <div class="btn-list flex-nowrap justify-content-end">
                                                <a th:href="@{/master/taxes/edit/{id}(id=${item.id})}"
                                                    class="btn btn-white btn-sm" sec:authorize="hasAuthority('TAX_UPDATE')"
                                                    th:text="#{label.edit}">
                                                    Edit
                                                </a>
                                                <button class="btn btn-white btn-sm text-danger" data-bs-toggle="modal"
                                                    th:data-bs-target="'#modal-delete-' + ${item.id}"
                                                    sec:authorize="hasAuthority('TAX_DELETE')">
                                                    <i class="ti ti-trash me-1"></i> <span th:text="#{label.delete}">Hapus</span>
                                                </button>
                                            </div>

                                            <!-- Delete Modal Fragment -->
                                            <div th:replace="~{fragments/modals :: delete-confirm(
                                                id='modal-delete-' + ${item.id},
                                                title=#{label.delete.confirm.title},
                                                message=#{msg.delete.confirm(${item.name})},
                                                actionUrl='/master/taxes/' + ${item.id},
                                                targetId='#tax-row-' + ${item.id}
                                            )}"></div>
                                        </td>
                                    </tr>
                                    <tr th:if="${page.isEmpty()}">
                                        <td colspan="6" class="text-center py-4 text-secondary"
                                            th:text="#{label.tax.empty}">Tidak ada data.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <!-- Pagination -->
                        <div th:replace="~{fragments/table :: pagination(${page})}"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
