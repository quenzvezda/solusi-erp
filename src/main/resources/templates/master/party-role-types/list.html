<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layout/master :: head(#{label.party-role-type.title})}"></head>

<body th:replace="~{layout/master :: layout(~{:: .prt-list-content}, ~{})}">
    <div class="prt-list-content">
        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title" th:text="#{label.party-role-type.title}">Tipe Peran Partner</h2>
                        <div class="text-secondary mt-1" th:text="#{label.party-role-type.subtitle}">Kelola kategori peran untuk partner bisnis.</div>
                    </div>
                    <div class="col-auto ms-auto d-print-none" sec:authorize="hasAuthority('PARTY-ROLE-TYPE_CREATE')">
                        <a th:href="@{/master/party-role-types/create}" class="btn btn-primary">
                            <i class="ti ti-plus me-1"></i>
                            <span th:text="#{label.party-role-type.add}">Tambah</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div class="page-body">
            <div class="container-xl">
                <div class="card">
                    <div class="card-body border-bottom py-3">
                        <div class="d-flex">
                            <div class="ms-auto text-secondary">
                                <form th:action="@{/master/party-role-types}" method="get"
                                      hx-get="/master/party-role-types"
                                      hx-target="#party-role-type-table-container"
                                      hx-trigger="keyup changed delay:500ms from:#search-input">
                                    <div class="input-icon">
                                        <input id="search-input" type="text" name="keyword" th:value="${keyword}"
                                               class="form-control form-control-sm" th:placeholder="#{label.search} + '...'">
                                        <span class="input-icon-addon">
                                            <i class="ti ti-search"></i>
                                        </span>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                    
                    <div id="party-role-type-table-container" th:fragment="party-role-type-table-container"
                         hx-get="/master/party-role-types"
                         hx-trigger="refresh-table from:body delay:500ms"
                         hx-include="[name='keyword'], [name='page']">
                        <!-- State Tracking -->
                        <input type="hidden" name="page" th:value="${page.number}">

                        <div class="table-responsive">
                            <table class="table table-vcenter card-table">
                                <thead>
                                    <tr>
                                        <th th:replace="~{fragments/table :: sortable('code', #{label.party-role-type.column.code})}">Kode</th>
                                        <th th:replace="~{fragments/table :: sortable('name', #{label.party-role-type.column.name})}">Nama</th>
                                        <th class="w-1 text-end" th:text="#{label.common.actions}">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="item : ${page.content}" th:id="'party-role-type-row-' + ${item.id}">
                                        <td><span class="badge bg-secondary-lt" th:text="${item.code}">CODE</span></td>
                                        <td class="font-weight-medium" th:text="${item.name}">NAME</td>
                                        <td class="text-end">
                                            <div class="btn-list flex-nowrap justify-content-end">
                                                <a th:href="@{/master/party-role-types/edit/{id}(id=${item.id})}"
                                                   class="btn btn-white btn-sm"
                                                   sec:authorize="hasAuthority('PARTY-ROLE-TYPE_UPDATE')">
                                                    <i class="ti ti-edit me-1"></i> <span th:text="#{label.edit}">Edit</span>
                                                </a>
                                                <button class="btn btn-white btn-sm text-danger"
                                                        th:data-bs-target="'#modal-delete-' + ${item.id}" data-bs-toggle="modal"
                                                        sec:authorize="hasAuthority('PARTY-ROLE-TYPE_DELETE')">
                                                    <i class="ti ti-trash me-1"></i> <span th:text="#{label.delete}">Hapus</span>
                                                </button>
                                            </div>

                                            <!-- Delete Modal Fragment -->
                                            <div th:replace="~{fragments/modals :: delete-confirm(
                                                id='modal-delete-' + ${item.id},
                                                title=#{label.delete.confirm.title},
                                                message=#{msg.delete.confirm(${item.name})},
                                                actionUrl='/master/party-role-types/' + ${item.id},
                                                targetId='#party-role-type-row-' + ${item.id}
                                            )}"></div>
                                        </td>
                                    </tr>
                                    <tr th:if="${page.isEmpty()}">
                                        <td colspan="3" class="text-center text-secondary py-4"
                                            th:text="#{label.party-role-type.empty}">Tidak ada data.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <!-- Pagination -->
                        <div th:replace="~{fragments/table :: pagination(${page})}"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
