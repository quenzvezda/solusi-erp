<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head
    th:replace="~{layout/master :: head(${partyRoleTypeRequest.id == null ? #messages.msg('label.party-role-type.add') : #messages.msg('label.party-role-type.edit')})}">
</head>

<body th:replace="~{layout/master :: layout(~{:: .prt-form-content}, ~{})}">
    <div class="prt-form-content">
        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title"
                            th:text="${partyRoleTypeRequest.id == null ? #messages.msg('label.party-role-type.add') : #messages.msg('label.party-role-type.edit')}">
                            Tambah Tipe Peran
                        </h2>
                    </div>
                </div>
            </div>
        </div>

        <div class="page-body">
            <div class="container-xl">
                <form
                    th:action="${partyRoleTypeRequest.id == null ? '/master/party-role-types/create' : '/master/party-role-types/edit/' + partyRoleTypeRequest.id}"
                    th:object="${partyRoleTypeRequest}" method="post"
                    data-ajax-form="true"
                    data-redirect-on-success="/master/party-role-types">
                    
                    <input type="hidden" th:field="*{id}" />
                    <input type="hidden" th:field="*{version}" />

                    <div class="card" style="max-width: 540px;">
                        <div class="card-header">
                            <h3 class="card-title"
                                th:text="${partyRoleTypeRequest.id == null ? #messages.msg('label.party-role-type.add') : #messages.msg('label.party-role-type.edit')}">
                            </h3>
                        </div>
                        <div class="card-body">
                            <div th:replace="~{fragments/inputs :: text(field='code', label=#{label.party-role-type.code}, isReadonly=${partyRoleTypeRequest.id != null}, placeholder='Auto-generated if empty')}"></div>
                            
                            <div th:replace="~{fragments/inputs :: text(field='name', label=#{label.party-role-type.name}, required=true, placeholder=#{placeholder.party-role-type.name})}"></div>

                            <!-- Audit Info -->
                            <th:block th:if="${auditInfo != null and auditInfo.id != null}">
                                 <div th:replace="~{fragments/audit-info :: audit-info(${auditInfo})}"></div>
                            </th:block>
                        </div>
                        <div class="card-footer d-flex">
                            <a th:href="@{/master/party-role-types}" class="btn btn-link"
                                th:text="#{label.cancel}">Batal</a>
                            <button type="submit" class="btn btn-primary ms-auto">
                                <i class="ti ti-device-floppy me-1"></i>
                                <span th:text="#{label.save}">Simpan</span>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
