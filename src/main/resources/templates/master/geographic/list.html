<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layout/master :: head(#{label.geographic.title})}"></head>

<body th:replace="~{layout/master :: layout(~{:: .geographic-list-content}, ~{})}">
    <div class="geographic-list-content">
        <!-- Page Header -->
        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title" th:text="#{label.geographic.title}">Geographic Management</h2>
                        <div class="text-secondary mt-1">
                            <span th:if="${currentParent == null}" th:text="#{label.geographic.list}">Geographic List</span>
                            <nav th:if="${currentParent != null}" aria-label="breadcrumb">
                                <ol class="breadcrumb">
                                    <li class="breadcrumb-item"><a th:href="@{/master/geographics}" th:text="#{label.geographic}">Geographic</a></li>
                                    <li class="breadcrumb-item active" aria-current="page" th:text="${currentParent.name}">Parent Name</li>
                                </ol>
                            </nav>
                        </div>
                    </div>
                    <!-- Page title actions -->
                    <div class="col-auto ms-auto d-print-none">
                        <div class="btn-list">
                            <a th:if="${currentParent != null}" 
                               th:href="${currentParent.parentId != null ? '/master/geographics?parentId=' + currentParent.parentId : '/master/geographics'}" 
                               class="btn btn-secondary d-none d-sm-inline-block">
                                <i class="ti ti-arrow-back-up"></i>
                                <span th:text="#{label.geographic.back_to_parent}">Back</span>
                            </a>
                            <a th:href="@{/master/geographics/create(parentId=${parentId})}" 
                               class="btn btn-primary d-none d-sm-inline-block"
                               sec:authorize="hasAuthority('GEOGRAPHIC_CREATE')">
                                <i class="ti ti-plus"></i>
                                <span th:text="#{label.geographic.create}">Add New</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Page Body -->
        <div class="page-body">
            <div class="container-xl">
                <!-- Alerts -->
                <div th:if="${successMessage}" class="alert alert-success alert-dismissible" role="alert">
                    <div class="d-flex">
                        <div><i class="ti ti-check icon alert-icon"></i></div>
                        <div th:text="${successMessage}">Success!</div>
                    </div>
                    <a class="btn-close" data-bs-dismiss="alert" aria-label="close"></a>
                </div>
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible" role="alert">
                    <div class="d-flex">
                        <div><i class="ti ti-alert-circle icon alert-icon"></i></div>
                        <div th:text="${errorMessage}">Error!</div>
                    </div>
                    <a class="btn-close" data-bs-dismiss="alert" aria-label="close"></a>
                </div>

                <div class="card">
                    <div class="card-body border-bottom py-3">
                        <div class="d-flex">
                            <div class="text-secondary">
                            </div>
                            <div class="ms-auto text-secondary">
                                <form th:action="@{/master/geographics}" method="get">
                                    <input type="hidden" name="parentId" th:value="${parentId}" />
                                    <div class="input-icon">
                                        <input type="text" name="keyword" th:value="${keyword}"
                                            class="form-control form-control-sm" th:placeholder="#{label.search}">
                                        <span class="input-icon-addon">
                                            <i class="ti ti-search"></i>
                                        </span>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-vcenter card-table">
                            <thead>
                                <tr>
                                    <th th:replace="~{fragments/table :: sortable('code', #{label.geographic.code})}">Code</th>
                                    <th th:replace="~{fragments/table :: sortable('name', #{label.geographic.name})}">Name</th>
                                    <th th:replace="~{fragments/table :: sortable('type', #{label.geographic.type})}">Type</th>
                                    <th th:text="#{label.geographic.parent}">Parent</th>
                                    <th th:text="#{label.geographic.status}">Status</th>
                                    <th class="w-1" th:text="#{label.actions}">Aksi</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item : ${page.content}">
                                    <td><code th:text="${item.code}">CODE</code></td>
                                    <td class="font-weight-medium" th:text="${item.name}">Name</td>
                                    <td>
                                        <span th:if="${item.type.name() == 'COUNTRY'}" class="badge bg-blue-lt" th:text="${item.type}">COUNTRY</span>
                                        <span th:if="${item.type.name() == 'STATE_PROVINCE'}" class="badge bg-green-lt" th:text="${item.type}">PROVINCE</span>
                                        <span th:if="${item.type.name() == 'CITY_MUNICIPALITY'}" class="badge bg-yellow-lt" th:text="${item.type}">CITY</span>
                                    </td>
                                    <td th:text="${item.parentName ?: '-'}">Parent</td>
                                    <td>
                                        <span class="badge badge-outline text-green" th:if="${item.isActive}">
                                            <span class="badge-dot bg-success me-1"></span>
                                            <span th:text="#{label.active}">Aktif</span>
                                        </span>
                                        <span class="badge badge-outline text-red" th:unless="${item.isActive}">
                                            <span class="badge-dot bg-danger me-1"></span>
                                            <span th:text="#{label.inactive}">Tidak Aktif</span>
                                        </span>
                                    </td>
                                    <td>
                                        <div class="btn-list flex-nowrap">
                                            <a th:if="${item.type.name() != 'CITY_MUNICIPALITY'}"
                                               th:href="@{/master/geographics(parentId=${item.id})}" 
                                               class="btn btn-white btn-sm" 
                                               th:title="#{label.geographic.view_children}">
                                                <i class="ti ti-folder"></i>
                                            </a>
                                            <a th:href="@{/master/geographics/edit/{id}(id=${item.id})}" 
                                               class="btn btn-white btn-sm"
                                               sec:authorize="hasAuthority('GEOGRAPHIC_UPDATE')" th:text="#{label.edit}">
                                                Edit
                                            </a>
                                            <button class="btn btn-danger btn-sm" data-bs-toggle="modal"
                                                th:data-bs-target="'#modal-delete-' + ${item.id}"
                                                sec:authorize="hasAuthority('GEOGRAPHIC_DELETE')"
                                                th:text="#{label.delete}">
                                                Hapus
                                            </button>
                                        </div>

                                        <!-- Delete Modal -->
                                        <div class="modal modal-blur fade" th:id="'modal-delete-' + ${item.id}"
                                            tabindex="-1" role="dialog" aria-hidden="true">
                                            <div class="modal-dialog modal-sm modal-dialog-centered" role="document">
                                                <div class="modal-content">
                                                    <button type="button" class="btn-close" data-bs-dismiss="modal"
                                                        aria-label="Close"></button>
                                                    <div class="modal-status bg-danger"></div>
                                                    <div class="modal-body text-center py-4">
                                                        <i class="ti ti-alert-triangle icon mb-2 text-danger icon-lg"></i>
                                                        <h3 th:text="#{label.geographic.delete.confirm.title}">Konfirmasi Hapus</h3>
                                                        <div class="text-secondary"
                                                            th:text="#{label.geographic.delete.confirm.text(${item.name})}">
                                                            Apakah Anda yakin ingin menghapus data ini?</div>
                                                    </div>
                                                    <div class="modal-footer">
                                                        <div class="w-100">
                                                            <div class="row">
                                                                <div class="col"><a href="#" class="btn w-100"
                                                                        data-bs-dismiss="modal"
                                                                        th:text="#{label.cancel}">Batal</a></div>
                                                                <div class="col">
                                                                    <a th:href="@{/master/geographics/delete/{id}(id=${item.id})}"
                                                                        class="btn btn-danger w-100"
                                                                        th:text="#{label.delete}">Hapus</a>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${page.totalElements == 0}">
                                    <td colspan="6" class="text-center text-secondary py-4"
                                        th:text="#{label.geographic.empty}">Tidak ada data.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <!-- Pagination -->
                    <div th:replace="~{fragments/table :: pagination(${page})}"></div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
