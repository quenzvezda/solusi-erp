<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head
    th:replace="~{layout/master :: head(${geographic.id == null ? #messages.msg('label.geographic.create') : #messages.msg('label.geographic.edit')})}">
</head>

<body th:replace="~{layout/master :: layout(~{:: .geographic-form-content}, ~{})}">
    <div class="geographic-form-content">
        <!-- Page Header -->
        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title"
                            th:text="${geographic.id == null ? #messages.msg('label.geographic.create') : #messages.msg('label.geographic.edit') + ': ' + geographic.name}">
                            Form Geographic</h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Page Body -->
        <div class="page-body">
            <div class="container-xl">
                <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}">Error message</div>

                <form
                    th:action="${geographic.id == null ? '/master/geographics/create' : '/master/geographics/edit/' + geographic.id}"
                    th:object="${geographic}" method="post" class="card">
                    <input type="hidden" th:field="*{id}" />
                    <input type="hidden" th:field="*{version}" />
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <!-- Type Selection -->
                                <div class="mb-3">
                                    <label class="form-label required" th:text="#{label.geographic.type}">Type</label>
                                    <div>
                                        <div th:each="type : ${types}" class="form-check form-check-inline">
                                            <input class="form-check-input geographic-type-radio" type="radio" 
                                                   th:field="*{type}" th:value="${type}"
                                                   th:id="'type-' + ${type}">
                                            <label class="form-check-label" th:for="'type-' + ${type}" th:text="${type}">TYPE</label>
                                        </div>
                                    </div>
                                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></div>
                                </div>

                                <!-- Parent Selection (Dynamic Autocomplete) -->
                                <div class="mb-3" id="parent-container" th:style="*{type != null and type.name() == 'COUNTRY' ? 'display: none;' : ''}">
                                    <label class="form-label" th:text="#{label.geographic.parent}">Parent</label>
                                    <select th:field="*{parentId}" class="form-select" id="parent-select">
                                        <option value=""></option>
                                    </select>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('parentId')}" th:errors="*{parentId}"></div>
                                </div>
                            </div>
                            <div class="col-md-6 border-start-md">
                                <!-- Code -->
                                <div class="mb-3">
                                    <label class="form-label required" th:text="#{label.geographic.code}">Code</label>
                                    <input type="text" th:field="*{code}" class="form-control" 
                                           th:placeholder="#{placeholder.geographic.code}"
                                           th:classappend="${#fields.hasErrors('code')} ? 'is-invalid'">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
                                </div>

                                <!-- Name -->
                                <div class="mb-3">
                                    <label class="form-label required" th:text="#{label.geographic.name}">Name</label>
                                    <input type="text" th:field="*{name}" class="form-control" 
                                           th:placeholder="#{placeholder.geographic.name}"
                                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                                </div>

                                <!-- Active Status -->
                                <div class="mb-3">
                                    <label class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" th:field="*{isActive}">
                                        <span class="form-check-label" th:text="#{label.active}">Active</span>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <!-- Record Info (Edit Mode only) -->
                        <div th:if="${auditInfo != null and auditInfo.id != null}" th:replace="~{fragments/audit-info :: audit-info(${auditInfo})}"></div>
                    </div>
                    <div class="card-footer text-end">
                        <div class="d-flex">
                            <a th:href="@{/master/geographics(parentId=*{parentId})}" class="btn btn-link" th:text="#{label.cancel}">Cancel</a>
                            <button type="submit" class="btn btn-primary ms-auto" th:text="#{label.save}">Save</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <script th:inline="javascript">
            document.addEventListener('DOMContentLoaded', function() {
                const typeRadios = document.querySelectorAll('input[name="type"]');
                const parentContainer = document.getElementById('parent-container');
                const parentSelectEl = document.getElementById('parent-select');
                
                let parentTs = null;
                const initialParentId = [[${geographic.parentId}]];
                const placeholder = [[#{placeholder.geographic.parent}]];
                let isFirstLoad = true;

                function initTomSelect(selectedType) {
                    if (parentTs) {
                        parentTs.destroy();
                        parentSelectEl.innerHTML = '<option value=""></option>';
                    }

                    if (selectedType === 'COUNTRY') {
                        parentContainer.style.display = 'none';
                        return;
                    }

                    parentContainer.style.display = 'block';
                    
                    let lookupUrl = '';
                    if (selectedType === 'STATE_PROVINCE') {
                        lookupUrl = '/api/lookup/geographics/countries';
                    } else if (selectedType === 'CITY_MUNICIPALITY') {
                        lookupUrl = '/api/lookup/geographics/provinces';
                    }

                    parentTs = new TomSelect(parentSelectEl, {
                        valueField: 'id',
                        labelField: 'name',
                        searchField: ['name'],
                        placeholder: placeholder,
                        allowEmptyOption: true,
                        openOnFocus: true,
                        load: function(query, callback) {
                            fetch(`${lookupUrl}?q=${encodeURIComponent(query)}&limit=10`)
                                .then(response => response.json())
                                .then(json => {
                                    callback(json);
                                }).catch(() => {
                                    callback();
                                });
                        },
                        render: {
                            option: function(item, escape) {
                                return `<div>
                                    <span class="d-block">${escape(item.name)}</span>
                                    <small class="text-muted" style="font-size: 0.75rem">${escape(item.subText || '')}</small>
                                </div>`;
                            },
                            item: function(item, escape) {
                                return `<span>${escape(item.name)}</span>`;
                            }
                        },
                        onFocus() {
                            this.load('');
                        }
                    });

                    // Pre-fill for Edit mode or if parentId exists (e.g. from create with parentId param)
                    if (isFirstLoad && initialParentId && !parentTs.getValue()) {
                        isFirstLoad = false;
                        fetch(`/api/lookup/geographics/${initialParentId}`)
                            .then(r => r.json())
                            .then(data => {
                                parentTs.addOption(data);
                                parentTs.setValue(data.id);
                            });
                    }
                }

                typeRadios.forEach(radio => {
                    radio.addEventListener('change', function() {
                        if (this.checked) {
                            isFirstLoad = false; // Manually changing type should stop pre-fill
                            initTomSelect(this.value);
                        }
                    });
                });

                const checkedType = document.querySelector('input[name="type"]:checked');
                if (checkedType) {
                    initTomSelect(checkedType.value);
                } else {
                    parentContainer.style.display = 'none';
                }
            });
        </script>
    </div>
</body>

</html>
