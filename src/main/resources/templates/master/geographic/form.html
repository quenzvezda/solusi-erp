<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">

<head
    th:replace="~{layout/master :: head(${geographicRequest.id == null ? #messages.msg('label.geographic.create') : #messages.msg('label.geographic.edit')})}">
</head>

<body th:replace="~{layout/master :: layout(~{:: .geographic-form-content}, ~{:: #page-scripts})}">
    <div class="geographic-form-content">
        <!-- Page Header -->
        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title"
                            th:text="${geographicRequest.id == null ? #messages.msg('label.geographic.create') : #messages.msg('label.geographic.edit') + ': ' + geographicRequest.name}">
                            Form Geographic</h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Page Body -->
        <div class="page-body">
            <div class="container-xl">
                <form id="geographic-form"
                    th:action="${geographicRequest.id == null ? '/master/geographics/create' : '/master/geographics/edit/' + geographicRequest.id}"
                    th:object="${geographicRequest}" method="post" class="card"
                    data-ajax-form="true"
                    data-redirect-on-success="/master/geographics">
                    
                    <input type="hidden" th:field="*{id}" />
                    <input type="hidden" th:field="*{version}" />
                    
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <!-- Type Selection -->
                                <div class="mb-3">
                                    <label class="form-label required" th:text="#{label.geographic.type}">Type</label>
                                    <div>
                                        <div th:each="type : ${types}" class="form-check form-check-inline">
                                            <input class="form-check-input geographic-type-radio" type="radio" 
                                                   th:field="*{type}" th:value="${type}"
                                                   th:id="'type-' + ${type}">
                                            <label class="form-check-label" th:for="'type-' + ${type}" th:text="${type}">TYPE</label>
                                        </div>
                                    </div>
                                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></div>
                                </div>

                                <!-- Parent Selection (Dynamic Autocomplete) -->
                                <div class="mb-3" id="parent-container" th:style="*{type != null and type.name() == 'COUNTRY' ? 'display: none;' : ''}">
                                    <div th:replace="~{fragments/inputs :: autocomplete(field='parentId', label=#{label.geographic.parent}, path=${geographicRequest.type != null and geographicRequest.type.name() == 'CITY_MUNICIPALITY' ? 'geographics/provinces' : 'geographics/countries'}, 
                                          initialValue=${geographicRequest.parentId}, 
                                          initialText=${geographicRequest.parentName}, 
                                          initialSubtext='')}"></div>
                                </div>
                            </div>
                            <div class="col-md-6 border-start-md">
                                <!-- Code -->
                                <div th:replace="~{fragments/inputs :: text(field='code', label=#{label.geographic.code}, required=true, placeholder=#{placeholder.geographic.code})}"></div>

                                <!-- Name -->
                                <div th:replace="~{fragments/inputs :: text(field='name', label=#{label.geographic.name}, required=true, placeholder=#{placeholder.geographic.name})}"></div>

                                <!-- Active Status -->
                                <div class="mb-3">
                                    <label class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" th:field="*{isActive}">
                                        <span class="form-check-label" th:text="#{label.active}">Active</span>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <!-- Audit Info -->
                        <th:block th:if="${auditInfo != null and auditInfo.id != null}">
                             <div th:replace="~{fragments/audit-info :: audit-info(${auditInfo})}"></div>
                        </th:block>
                    </div>
                    <div class="card-footer text-end">
                        <div class="d-flex">
                            <a th:href="@{/master/geographics(parentId=*{parentId})}" class="btn btn-link" th:text="#{label.cancel}">Cancel</a>
                            <button type="submit" class="btn btn-primary ms-auto">
                                <i class="ti ti-device-floppy me-1"></i>
                                <span th:text="#{label.save}">Simpan</span>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="page-scripts" th:fragment="pageScripts">
        <script th:inline="javascript">
            document.addEventListener('DOMContentLoaded', function() {
                const typeRadios = document.querySelectorAll('.geographic-type-radio');
                const parentContainer = document.getElementById('parent-container');
                const parentSelectEl = document.getElementById('parentId');

                if (!parentContainer || !parentSelectEl) {
                    return;
                }

                function getLookupPath(selectedType) {
                    if (selectedType === 'STATE_PROVINCE') return 'geographics/countries';
                    if (selectedType === 'CITY_MUNICIPALITY') return 'geographics/provinces';
                    return 'geographics';
                }

                function initParentLookup(selectedType, preserveSelection) {
                    if (selectedType === 'COUNTRY') {
                        parentContainer.style.display = 'none';
                        if (parentSelectEl.tomselect) {
                            parentSelectEl.tomselect.clear(true);
                            parentSelectEl.tomselect.clearOptions();
                        }
                        return;
                    }

                    parentContainer.style.display = 'block';
                    const lookupPath = getLookupPath(selectedType);
                    const currentValue = parentSelectEl.value;
                    const currentOption = parentSelectEl.querySelector(`option[value="${currentValue}"]`);

                    parentSelectEl.setAttribute('data-lookup-path', lookupPath);
                    parentSelectEl.classList.remove('tomselect-initialized');

                    if (!preserveSelection) {
                        parentSelectEl.value = '';
                        parentSelectEl.querySelectorAll('option').forEach(opt => {
                            if (opt.value !== '') opt.remove();
                        });
                    } else if (currentOption) {
                        parentSelectEl.querySelectorAll('option').forEach(opt => {
                            if (opt.value !== '' && opt !== currentOption) opt.remove();
                        });
                    }

                    if (typeof initLookup === 'function') {
                        const ts = initLookup(parentSelectEl, lookupPath);
                        if (ts) {
                            parentSelectEl.classList.add('tomselect-initialized');
                            if (preserveSelection && currentValue) {
                                ts.setValue(currentValue, true);
                            } else {
                                ts.clear(true);
                            }
                        }
                    }
                }

                typeRadios.forEach(radio => {
                    radio.addEventListener('change', function() {
                        if (this.checked) {
                            initParentLookup(this.value, false);
                        }
                    });
                });

                const checkedType = document.querySelector('.geographic-type-radio:checked');
                if (checkedType) {
                    initParentLookup(checkedType.value, true);
                }
            });
        </script>
    </div>
</body>

</html>
