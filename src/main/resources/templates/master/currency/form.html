<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layout/master :: head(${currency.id == null ? #messages.msg('label.currency.add') : #messages.msg('label.currency.edit')})}"></head>

<body th:replace="~{layout/master :: layout(~{:: .currency-form-content}, ~{})}">
    <div class="currency-form-content">
        <!-- Page Header -->
        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title"
                            th:text="${currency.id == null ? #messages.msg('label.currency.add') : #messages.msg('label.currency.edit') + ': ' + currency.name}">
                            Form Mata Uang
                        </h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Page Body -->
        <div class="page-body">
            <div class="container-xl">
                <form th:action="${currency.id == null ? '/master/currencies/create' : '/master/currencies/edit/' + currency.id}"
                      th:object="${currency}" method="post" class="card"
                      data-ajax-form="true"
                      data-redirect-on-success="/master/currencies">
                    
                    <input type="hidden" th:field="*{version}" />

                    <div class="card-body">
                        <div class="row">
                            <!-- Left Column: Basic Info -->
                            <div class="col-md-6">
                                <h3 class="card-title" th:text="#{label.product.section.basic}">Informasi Dasar</h3>
                                
                                <div th:replace="~{fragments/inputs :: text(field='symbol', label=#{label.currency.symbol}, required=true, placeholder=#{placeholder.currency.symbol})}"></div>
                                
                                <div th:replace="~{fragments/inputs :: text(field='alias', label=#{label.currency.alias}, required=true, placeholder=#{placeholder.currency.alias})}"></div>
                                
                                <div th:replace="~{fragments/inputs :: text(field='name', label=#{label.currency.name}, required=true, placeholder=#{placeholder.currency.name})}"></div>
                            </div>

                            <!-- Right Column: Settings -->
                            <div class="col-md-6 border-start-md">
                                <h3 class="card-title" th:text="#{label.general.settings}">Pengaturan</h3>
                                
                                <div class="mb-3">
                                    <label class="form-label" th:text="#{label.currency.note}">Catatan</label>
                                    <textarea th:field="*{note}" class="form-control erp-input" rows="3" th:placeholder="#{placeholder.currency.note}"></textarea>
                                </div>

                                <div class="mb-3">
                                    <label class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" th:field="*{isActive}">
                                        <span class="form-check-label" th:text="#{label.active}">Aktif</span>
                                    </label>
                                </div>

                                <div class="mb-3">
                                    <label class="form-check">
                                        <input class="form-check-input" type="checkbox" th:field="*{isDefault}">
                                        <span class="form-check-label" th:text="#{label.currency.is.default}">Jadikan Default</span>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <!-- Record Info (Edit Mode) -->
                        <div th:if="${auditInfo != null and auditInfo.id != null}" 
                             th:replace="~{fragments/audit-info :: audit-info(${auditInfo})}"></div>
                    </div>

                    <!-- Card Footer -->
                    <div class="card-footer text-end">
                        <div class="d-flex">
                            <a th:href="@{/master/currencies}" class="btn btn-link" th:text="#{label.cancel}">Batal</a>
                            <button type="submit" class="btn btn-primary ms-auto">
                                <i class="ti ti-device-floppy me-1"></i>
                                <span th:text="#{label.save}">Simpan</span>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
