<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layout/master :: head(#{label.currency.title})}"></head>

<body th:replace="~{layout/master :: layout(~{:: .currency-list-content}, ~{})}">
    <div class="currency-list-content">
        <!-- Page Header -->
        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title" th:text="#{label.currency.title}">Manajemen Mata Uang</h2>
                        <div class="text-secondary mt-1" th:text="#{label.currency.subtitle}">Kelola data mata uang.
                        </div>
                    </div>
                    <!-- Page title actions -->
                    <div class="col-auto ms-auto d-print-none" sec:authorize="hasAuthority('CURRENCY_CREATE')">
                        <div class="btn-list">
                            <a th:href="@{/master/currencies/create}" class="btn btn-primary d-none d-sm-inline-block">
                                <i class="ti ti-plus"></i>
                                <span th:text="#{label.currency.add}">Tambah Mata Uang Baru</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Page Body -->
        <div class="page-body">
            <div class="container-xl">
                <!-- Alerts -->
                <div th:if="${successMessage}" class="alert alert-success alert-dismissible" role="alert">
                    <div class="d-flex">
                        <div><i class="ti ti-check icon alert-icon"></i></div>
                        <div th:text="${successMessage}">Success!</div>
                    </div>
                    <a class="btn-close" data-bs-dismiss="alert" aria-label="close"></a>
                </div>
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible" role="alert">
                    <div class="d-flex">
                        <div><i class="ti ti-alert-circle icon alert-icon"></i></div>
                        <div th:text="${errorMessage}">Error!</div>
                    </div>
                    <a class="btn-close" data-bs-dismiss="alert" aria-label="close"></a>
                </div>

                <div class="card">
                    <div class="card-body border-bottom py-3">
                        <div class="d-flex">
                            <div class="text-secondary">
                            </div>
                            <div class="ms-auto text-secondary">
                                <form th:action="@{/master/currencies}" method="get" class="input-icon"
                                      hx-get="/master/currencies" 
                                      hx-target="#currency-table-container" 
                                      hx-trigger="keyup changed delay:500ms from:#search-input">
                                    <input id="search-input" type="text" name="keyword" th:value="${keyword}"
                                        class="form-control form-control-sm" th:placeholder="#{label.search}">
                                    <span class="input-icon-addon">
                                        <i class="ti ti-search"></i>
                                    </span>
                                </form>
                            </div>
                        </div>
                    </div>
                    <div id="currency-table-container" th:fragment="currency-table-container"
                         hx-get="/master/currencies" 
                         hx-trigger="refresh-table from:body delay:500ms"
                         hx-include="[name='keyword'], [name='page']">
                        <input type="hidden" name="page" th:value="${page.number}">
                        <div class="table-responsive">
                            <table class="table table-vcenter card-table">
                                <thead>
                                    <tr>
                                        <th
                                            th:replace="~{fragments/table :: sortable('symbol', #{label.currency.column.symbol})}">
                                            Simbol</th>
                                        <th
                                            th:replace="~{fragments/table :: sortable('alias', #{label.currency.column.alias})}">
                                            Alias</th>
                                        <th
                                            th:replace="~{fragments/table :: sortable('name', #{label.currency.column.name})}">
                                            Nama</th>
                                        <th th:text="#{label.currency.column.default}">Default</th>
                                        <th th:text="#{label.currency.column.status}">Status</th>
                                        <th class="w-1" th:text="#{label.actions}">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="item : ${page.content}" th:id="'currency-row-' + ${item.id}">
                                        <td>
                                            <span class="badge bg-secondary-lt fw-bold" th:text="${item.symbol}">$</span>
                                        </td>
                                        <td><code th:text="${item.alias}">ALIAS</code></td>
                                        <td class="font-weight-medium" th:text="${item.name}">Name</td>
                                        <td>
                                            <span th:if="${item.isDefault}" class="badge bg-primary text-primary-fg"
                                                th:text="#{label.yes}">Ya</span>
                                            <span th:unless="${item.isDefault}" class="badge bg-secondary text-secondary-fg"
                                                th:text="#{label.no}">Tidak</span>
                                        </td>
                                        <td>
                                            <span class="badge badge-outline text-green" th:if="${item.isActive}">
                                                <span class="badge-dot bg-success me-1"></span>
                                                <span th:text="#{label.active}">Aktif</span>
                                            </span>
                                            <span class="badge badge-outline text-red" th:unless="${item.isActive}">
                                                <span class="badge-dot bg-danger me-1"></span>
                                                <span th:text="#{label.inactive}">Tidak Aktif</span>
                                            </span>
                                        </td>
                                        <td class="text-end">
                                            <div class="btn-list flex-nowrap justify-content-end">
                                                <a th:href="@{/master/currencies/edit/{id}(id=${item.id})}"
                                                    class="btn btn-white btn-sm"
                                                    sec:authorize="hasAuthority('CURRENCY_UPDATE')" th:text="#{label.edit}">
                                                    Edit
                                                </a>
                                                <button class="btn btn-white btn-sm text-danger" data-bs-toggle="modal"
                                                    th:data-bs-target="'#modal-delete-' + ${item.id}"
                                                    sec:authorize="hasAuthority('CURRENCY_DELETE')">
                                                    <i class="ti ti-trash me-1"></i> <span th:text="#{label.delete}">Hapus</span>
                                                </button>
                                            </div>

                                            <!-- Delete Modal Fragment -->
                                            <div th:replace="~{fragments/modals :: delete-confirm(
                                                id='modal-delete-' + ${item.id},
                                                title=#{label.delete.confirm.title},
                                                message=#{msg.delete.confirm(${item.name})},
                                                actionUrl='/master/currencies/' + ${item.id},
                                                targetId='#currency-row-' + ${item.id}
                                            )}"></div>
                                        </td>
                                    </tr>
                                    <tr th:if="${page.totalElements == 0}">
                                        <td colspan="6" class="text-center py-4 text-secondary"
                                            th:text="#{label.currency.empty}">Tidak ada data.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <!-- Pagination -->
                        <div th:replace="~{fragments/table :: pagination(${page})}"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
