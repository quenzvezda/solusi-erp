<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/master :: head(${bankAccountRequest.code == null ? #messages.msg('master.bank-account.add') : #messages.msg('master.bank-account.edit')})}"></head>

<body th:replace="~{layout/master :: layout(~{:: .bank-account-form-content}, ~{:: #page-scripts})}">
    <div class="bank-account-form-content">
        <!-- Page Header -->
        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title"
                            th:text="${bankAccountRequest.code == null ? #messages.msg('master.bank-account.add') : #messages.msg('master.bank-account.edit')}">
                            Add Bank Account
                        </h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Page Body -->
        <div class="page-body">
            <div class="container-xl">
                <form th:action="${bankAccountRequest.code == null ? '/master/bank-accounts/create' : '/master/bank-accounts/edit/' + bankAccountRequest.id}"
                      th:object="${bankAccountRequest}" method="post"
                      data-ajax-form="true"
                      data-redirect-on-success="/master/bank-accounts">

                    <div class="card">
                        <div class="card-body">
                            <div class="row">
                                <!-- Left Column -->
                                <div class="col-md-6">
                                    <div th:replace="~{fragments/inputs :: text(field='code', label=#{master.bank-account.code}, isReadonly=true, placeholder='[ Auto Generated ]')}"></div>
                                    
                                    <div th:replace="~{fragments/inputs :: text(field='bankName', label=#{master.bank-account.bank-name}, required=true)}"></div>
                                    
                                    <div th:replace="~{fragments/inputs :: text(field='branch', label=#{master.bank-account.branch}, required=true)}"></div>

                                    <div th:replace="~{fragments/inputs :: autocomplete(field='cityId', label=#{master.bank-account.city}, path='geographics/cities', required=true,
                                        initialValue=${bankAccountRequest.cityId}, 
                                        initialText=${selectedCity}, 
                                        initialSubtext='')}"></div>

                                    <div th:replace="~{fragments/inputs :: autocomplete(field='currencyId', label=#{master.bank-account.currency}, path='master/currencies', required=true,
                                        initialValue=${bankAccountRequest.currencyId},
                                        initialText=${bankAccountUI != null ? bankAccountUI['currencyText'] : ''},
                                        initialSubtext=${bankAccountUI != null ? bankAccountUI['currencySubtext'] : ''})}"></div>
                                </div>

                                <!-- Right Column -->
                                <div class="col-md-6 border-start-md">
                                    <div th:replace="~{fragments/inputs :: autocomplete(field='partyId', label=#{master.bank-account.party}, path='parties', required=true,
                                        initialValue=${bankAccountRequest.partyId}, 
                                        initialText=${selectedParty}, 
                                        initialSubtext='')}"></div>

                                    <div th:replace="~{fragments/inputs :: text(field='accountName', label=#{master.bank-account.account-name}, required=true)}"></div>
                                    
                                    <div th:replace="~{fragments/inputs :: text(field='accountNo', label=#{master.bank-account.account-no}, required=true)}"></div>

                                    <div class="mb-3">
                                        <label class="form-label required" th:text="#{master.bank-account.type}">Type</label>
                                        <select th:field="*{accountType}" class="form-select erp-input" th:errorclass="is-invalid">
                                            <option value="">-- Select Type --</option>
                                            <option th:each="type : ${accountTypes}" th:value="${type}" th:text="${type}"></option>
                                        </select>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('accountType')}" th:errors="*{accountType}"></div>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label" th:text="#{master.bank-account.coa}">COA</label>
                                        <div class="input-group">
                                            <input type="hidden" th:field="*{coaId}" id="bank-account-coa-id"/>
                                            <input type="text" id="bank-account-coa-display" class="form-control"
                                                   th:value="${bankAccountUI != null && bankAccountUI['coaText'] != null ? bankAccountUI['coaSubtext'] + ' - ' + bankAccountUI['coaText'] : ''}"
                                                   th:placeholder="#{master.bank-account.coa.placeholder}" readonly/>
                                            <button type="button" id="btn-select-bank-account-coa" class="btn btn-icon btn-outline-primary"
                                                    th:attr="title=#{master.bank-account.coa.placeholder}">
                                                <i class="ti ti-search"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                <!-- Full Width Note -->
                                <div class="col-12 mt-3">
                                    <div class="mb-3">
                                        <label class="form-label" th:text="#{master.bank-account.note}">Note</label>
                                        <textarea th:field="*{note}" class="form-control erp-input" rows="3"></textarea>
                                    </div>
                                </div>
                            </div>

                            <!-- Record Info (Edit Mode) -->
                            <div th:if="${auditInfo != null and auditInfo.id != null}" 
                                 th:replace="~{fragments/audit-info :: audit-info(${auditInfo})}"></div>
                        </div>

                        <!-- Card Footer -->
                        <div class="card-footer text-end">
                            <div class="d-flex">
                                <a th:href="@{/master/bank-accounts}" class="btn btn-link" th:text="#{label.cancel}">Cancel</a>
                                <button type="submit" class="btn btn-primary ms-auto">
                                    <i class="ti ti-device-floppy me-1"></i>
                                    <span th:text="#{label.save}">Save</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </form>
                <div th:replace="~{fragments/modal-selector :: shell('modal-bank-account-coa-selector', #{master.bank-account.coa.selector.title}, 'bank-account-coa-selector-modal-body', 'modal-xl')}"></div>
            </div>
        </div>
    </div>

    <!-- Page Specific Scripts Slot -->
    <div id="page-scripts" th:fragment="pageScripts">
        <script th:src="@{/js/shared/erp-modal-selector.js}" defer></script>
        <script th:src="@{/js/master/bank-accounts/form.js}" defer></script>
    </div>
</body>
</html>
