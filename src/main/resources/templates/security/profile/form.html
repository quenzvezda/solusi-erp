<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/master :: head(#{profile.edit.title})}"></head>
<body th:replace="~{layout/master :: layout(~{:: .profile-form-content}, ~{})}">
    <div class="profile-form-content">
        <!-- Page Header -->
        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title" th:text="#{profile.edit.title}">Edit Profil Saya</h2>
                        <div class="text-muted mt-1" th:text="#{profile.subtitle}">Lengkapi atau perbarui informasi profil Anda di bawah ini.</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Page Body -->
        <div class="page-body">
            <div class="container-xl">
                <form th:action="@{/profile/edit}" th:object="${profileRequest}" method="post" class="card"
                      data-ajax-form="true"
                      data-redirect-on-success="/profile">
                    <div class="card-body">
                        <div class="row">
                            <!-- Informasi Dasar Section -->
                            <div class="col-md-6">
                                <h3 class="card-title" th:text="#{profile.basic.info}">Informasi Dasar</h3>
                                
                                <div th:replace="~{fragments/inputs :: text(field='fullName', label=#{profile.full.name}, required=true, placeholder='Masukkan nama lengkap Anda')}"></div>
                                
                                <div th:replace="~{fragments/inputs :: text(field='email', label=#{profile.email}, required=true, placeholder='email@example.com')}"></div>
                                
                                <div th:replace="~{fragments/inputs :: text(field='phoneNumber', label=#{profile.phone}, placeholder='Contoh: 08123456789')}"></div>
                            </div>

                            <!-- Preferensi & Keamanan Section -->
                            <div class="col-md-6 border-start-md">
                                <h3 class="card-title" th:text="#{profile.preferences}">Preferensi Sistem</h3>
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label class="form-label required" th:text="#{profile.language}">Bahasa</label>
                                            <select th:field="*{languageCode}" class="form-select erp-input">
                                                <option value="id">Bahasa Indonesia</option>
                                                <option value="en">English</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label class="form-label required" th:text="#{profile.page.size}">Ukuran Halaman Default</label>
                                            <select th:field="*{defaultPageSize}" class="form-select erp-input">
                                                <option value="10">10 Baris</option>
                                                <option value="25">25 Baris</option>
                                                <option value="50">50 Baris</option>
                                                <option value="100">100 Baris</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label required" th:text="#{profile.theme}">Tema Visual</label>
                                    <div class="form-selectgroup">
                                        <label class="form-selectgroup-item">
                                            <input type="radio" th:field="*{theme}" value="light" class="form-selectgroup-input">
                                            <span class="form-selectgroup-label" th:text="#{profile.theme.light}">Terang</span>
                                        </label>
                                        <label class="form-selectgroup-item">
                                            <input type="radio" th:field="*{theme}" value="dark" class="form-selectgroup-input">
                                            <span class="form-selectgroup-label" th:text="#{profile.theme.dark}">Gelap</span>
                                        </label>
                                    </div>
                                </div>

                                <hr class="my-3">
                                <h3 class="card-title text-warning" th:text="#{profile.security.title}">Ganti Password (Opsional)</h3>
                                <div class="mb-3">
                                    <label class="form-label" th:text="#{profile.current.password}">Password Saat Ini</label>
                                    <input type="password" th:field="*{currentPassword}" class="form-control" 
                                           placeholder="Wajib diisi jika ingin mengubah password">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" th:text="#{profile.new.password}">Password Baru</label>
                                    <input type="password" th:field="*{newPassword}" class="form-control" 
                                           placeholder="Minimal 6 karakter">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" th:text="#{profile.confirm.password}">Konfirmasi Password Baru</label>
                                    <input type="password" th:field="*{confirmPassword}" class="form-control" 
                                           placeholder="Ulangi password baru">
                                </div>
                            </div>
                        </div>

                        <!-- Record Info -->
                        <div th:if="${auditInfo != null and auditInfo.id != null}" th:replace="~{fragments/audit-info :: audit-info(${auditInfo})}"></div>
                    </div>
                    <div class="card-footer text-end">
                        <div class="d-flex">
                            <a th:href="@{/profile}" class="btn btn-link" th:text="#{label.cancel}">Batal</a>
                            <button type="submit" class="btn btn-primary ms-auto" th:text="#{label.save}">Simpan Perubahan Profil</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
