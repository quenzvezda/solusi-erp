<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/master :: head(#{profile.title})}"></head>
<body th:replace="~{layout/master :: layout(~{:: .profile-view-content})}">
    <div class="profile-view-content">
        <!-- Page Header -->
        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title" th:text="#{profile.title}">Profil Saya</h2>
                        <div class="text-muted mt-1" th:text="${profile.fullName}">Nama Lengkap</div>
                    </div>
                    <!-- Page title actions -->
                    <div class="col-auto ms-auto d-print-none">
                        <div class="d-flex">
                            <a th:href="@{/profile/edit}" class="btn btn-primary">
                                <i class="ti ti-edit icon me-1"></i> <span th:text="#{label.edit}">Edit Profil</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Page Body -->
        <div class="page-body">
            <div class="container-xl">
                <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}">Success message</div>
                
                <div class="row row-cards">
                    <div class="col-md-4">
                        <div class="card">
                            <div class="card-body p-4 text-center">
                                <span class="avatar avatar-xl mb-3 rounded" 
                                      th:text="${#strings.substring(profile.fullName, 0, 1).toUpperCase()}">U</span>
                                <h3 class="m-0 mb-1" th:text="${profile.fullName}">Full Name</h3>
                                <div class="text-muted" th:text="${profile.roleName}">Role Name</div>
                                <div class="mt-3">
                                    <span class="badge bg-green-lt" th:text="#{label.active}">Aktif</span>
                                </div>
                            </div>
                            <div class="d-flex">
                                <div class="card-btn">
                                    <i class="ti ti-mail icon me-2"></i>
                                    <span th:text="${profile.email}">email@example.com</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-8">
                        <div class="card">
                            <div class="card-header">
                                <h3 class="card-title" th:text="#{profile.basic.info}">Informasi Pribadi</h3>
                            </div>
                            <div class="card-body">
                                <div class="datagrid">
                                    <div class="datagrid-item">
                                        <div class="datagrid-title">Username</div>
                                        <div class="datagrid-content" th:text="${profile.username}">username</div>
                                    </div>
                                    <div class="datagrid-item">
                                        <div class="datagrid-title" th:text="#{profile.email}">Email</div>
                                        <div class="datagrid-content" th:text="${profile.email}">email@example.com</div>
                                    </div>
                                    <div class="datagrid-item">
                                        <div class="datagrid-title" th:text="#{profile.phone}">Nomor Telepon</div>
                                        <div class="datagrid-content" th:text="${profile.phoneNumber ?: '-'}">08123456789</div>
                                    </div>
                                    <div class="datagrid-item">
                                        <div class="datagrid-title" th:text="#{label.roles}">Role / Peran</div>
                                        <div class="datagrid-content">
                                            <span class="badge bg-blue-lt" th:text="${profile.roleName}">ADMIN</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="card mt-3">
                            <div class="card-header">
                                <h3 class="card-title" th:text="#{profile.preferences}">Preferensi Sistem</h3>
                            </div>
                            <div class="card-body">
                                <div class="datagrid">
                                    <div class="datagrid-item">
                                        <div class="datagrid-title" th:text="#{profile.language}">Bahasa</div>
                                        <div class="datagrid-content" th:text="${profile.languageCode == 'id' ? 'Bahasa Indonesia' : 'English'}">Bahasa Indonesia</div>
                                    </div>
                                    <div class="datagrid-item">
                                        <div class="datagrid-title" th:text="#{profile.page.size}">Ukuran Halaman Default</div>
                                        <div class="datagrid-content" th:text="${profile.defaultPageSize}">10</div>
                                    </div>
                                    <div class="datagrid-item">
                                        <div class="datagrid-title" th:text="#{profile.theme}">Tema Visual</div>
                                        <div class="datagrid-content" th:text="${profile.theme == 'light' ? 'Terang' : 'Gelap'}">Terang</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
