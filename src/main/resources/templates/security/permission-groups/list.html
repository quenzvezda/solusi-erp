<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/master :: head(#{label.menu.group.title})}"></head>
<body th:replace="~{layout/master :: layout(~{:: .pg-list-content}, ~{})}">
    <div class="pg-list-content">
        <!-- Page Header -->
        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title" th:text="#{label.menu.group.title}">Manajemen Grup Menu</h2>
                        <div class="text-secondary mt-1" th:text="#{label.menu.group.subtitle}">Kelola hasil pencarian navigasi global.</div>
                    </div>
                    <div class="col-auto ms-auto d-print-none" sec:authorize="hasAuthority('MENU-GROUP_CREATE')">
                        <a th:href="@{/security/menu-groups/create}" class="btn btn-primary">
                            <i class="ti ti-plus me-1"></i> <span th:text="#{label.menu.group.add}">Tambah Grup Baru</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Page Body -->
        <div class="page-body">
            <div class="container-xl">
                <div class="card">
                    <div class="card-body border-bottom py-3">
                        <div class="d-flex">
                            <div class="ms-auto text-secondary">
                                <form th:action="@{/security/menu-groups}" method="get"
                                      hx-get="/security/menu-groups"
                                      hx-target="#menu-group-table-container"
                                      hx-trigger="keyup changed delay:500ms from:#search-input">
                                    <div class="input-icon">
                                        <input id="search-input" type="text" name="keyword" th:value="${keyword}"
                                               class="form-control form-control-sm" th:placeholder="#{label.search} + '...'">
                                        <span class="input-icon-addon">
                                            <i class="ti ti-search"></i>
                                        </span>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                    
                    <div id="menu-group-table-container" th:fragment="menu-group-table-container"
                         hx-get="/security/menu-groups"
                         hx-trigger="refresh-table from:body delay:500ms"
                         hx-include="[name='keyword'], [name='page']">
                        <!-- State Tracking -->
                        <input type="hidden" name="page" th:value="${page.number}">

                        <div class="table-responsive">
                            <table class="table table-vcenter card-table">
                                <thead>
                                    <tr>
                                        <th class="w-1">Icon</th>
                                        <th th:replace="~{fragments/table :: sortable('code', #{label.menu.group.code})}">Code</th>
                                        <th th:replace="~{fragments/table :: sortable('nameId', #{label.menu.group.name})}">Name</th>
                                        <th>URL Path</th>
                                        <th>Breadcrumb</th>
                                        <th class="w-1 text-end" th:text="#{label.common.actions}">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="g : ${page.content}" th:id="'menu-group-row-' + ${g.id}">
                                        <td>
                                            <div class="avatar avatar-sm bg-primary-lt">
                                                <i th:class="'ti ' + (${g.iconClass} ?: 'ti-circle')"></i>
                                            </div>
                                        </td>
                                        <td><code th:text="${g.code}">CODE</code></td>
                                        <td>
                                            <div class="d-flex flex-column">
                                                <strong th:text="${g.nameId}">Indonesian Name</strong>
                                                <small class="text-secondary" th:text="${g.nameEn}">English Name</small>
                                            </div>
                                        </td>
                                        <td class="text-secondary small" th:text="${g.urlPath}">/url/path</td>
                                        <td>
                                            <div class="d-flex flex-column small">
                                                <span th:text="${g.breadcrumbId}">Keamanan > ...</span>
                                                <span class="text-secondary" th:text="${g.breadcrumbEn}">Security > ...</span>
                                            </div>
                                        </td>
                                        <td class="text-end">
                                            <div class="btn-list flex-nowrap justify-content-end">
                                                <a th:href="@{/security/menu-groups/edit/{id}(id=${g.id})}"
                                                   class="btn btn-white btn-sm" sec:authorize="hasAuthority('MENU-GROUP_UPDATE')">
                                                    <i class="ti ti-edit me-1"></i> <span th:text="#{label.edit}">Edit</span>
                                                </a>
                                                <button class="btn btn-white btn-sm text-danger" data-bs-toggle="modal"
                                                    th:data-bs-target="'#modal-delete-' + ${g.id}"
                                                    sec:authorize="hasAuthority('MENU-GROUP_DELETE')">
                                                    <i class="ti ti-trash me-1"></i> <span th:text="#{label.delete}">Hapus</span>
                                                </button>
                                            </div>

                                            <!-- Delete Modal Fragment -->
                                            <div th:replace="~{fragments/modals :: delete-confirm(
                                                id='modal-delete-' + ${g.id},
                                                title=#{label.delete.confirm.title},
                                                message=#{msg.delete.confirm.cascade(${g.nameId})},
                                                actionUrl='/security/menu-groups/' + ${g.id},
                                                targetId='#menu-group-row-' + ${g.id}
                                            )}"></div>
                                        </td>
                                    </tr>
                                    <tr th:if="${page.isEmpty()}">
                                        <td colspan="6" class="text-center py-4 text-secondary" th:text="#{label.no.data}">No data found.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <!-- Pagination -->
                        <div th:replace="~{fragments/table :: pagination(${page})}"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
