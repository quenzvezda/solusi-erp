<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/master :: head(${request.id == null ? #messages.msg('label.menu.group.add') : #messages.msg('label.menu.group.edit')})}"></head>
<body th:replace="~{layout/master :: layout(~{:: .pg-form-content}, ~{})}">
    <div class="pg-form-content">
        <!-- Page Header -->
        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title" th:text="${request.id == null ? #messages.msg('label.menu.group.add') : #messages.msg('label.menu.group.edit')}">
                            Form Grup Menu
                        </h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Page Body -->
        <div class="page-body">
            <div class="container-xl">
                <form th:action="${request.id == null ? '/security/menu-groups/create' : '/security/menu-groups/edit/' + request.id}" 
                      th:object="${request}" method="post" class="card"
                      data-ajax-form="true"
                      data-redirect-on-success="/security/menu-groups">
                    <input type="hidden" th:field="*{id}">
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <div th:replace="~{fragments/inputs :: text(field='code', label=#{label.menu.group.code}, required=true, placeholder='e.g. SEC-01')}"></div>
                            </div>
                            <div class="col-md-4">
                                <div th:replace="~{fragments/inputs :: text(field='urlPath', label=#{label.menu.group.url}, required=true, placeholder='e.g. /security/users')}"></div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">
                                    Icon Class
                                    <a href="https://tabler-icons.io/" target="_blank" class="ms-1 small" title="Browse Icons">
                                        <i class="ti ti-external-link"></i>
                                    </a>
                                </label>
                                <div class="input-group input-group-flat">
                                    <span class="input-group-text">
                                        <i th:class="'ti ' + (*{iconClass} ?: 'ti-circle')" id="icon-preview"></i>
                                    </span>
                                    <input type="text" th:field="*{iconClass}" class="form-control erp-input" 
                                           placeholder="e.g. ti-user"
                                           oninput="document.getElementById('icon-preview').className = 'ti ' + (this.value || 'ti-circle')">
                                </div>
                                <small class="form-hint">Use Tabler Icon class (e.g., ti-package).</small>
                            </div>

                            <!-- Indonesian Section -->
                            <div class="col-md-6">
                                <div class="card bg-light border-0">
                                    <div class="card-body p-3">
                                        <h4 class="card-title mb-3"><span class="flag flag-country-id me-1"></span> Bahasa Indonesia</h4>
                                        <div th:replace="~{fragments/inputs :: text(field='nameId', label=#{label.menu.group.name.id}, required=true)}"></div>
                                        <div th:replace="~{fragments/inputs :: text(field='breadcrumbId', label=#{label.menu.group.breadcrumb.id}, required=true)}"></div>
                                        <div>
                                            <label class="form-label" th:text="#{label.menu.group.description.id}">Description (ID)</label>
                                            <textarea th:field="*{descriptionId}" class="form-control erp-input" rows="2"></textarea>
                                            <div class="invalid-feedback" th:if="${#fields.hasErrors('descriptionId')}" th:errors="*{descriptionId}"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- English Section -->
                            <div class="col-md-6">
                                <div class="card bg-light border-0">
                                    <div class="card-body p-3">
                                        <h4 class="card-title mb-3"><span class="flag flag-country-gb me-1"></span> English</h4>
                                        <div th:replace="~{fragments/inputs :: text(field='nameEn', label=#{label.menu.group.name.en}, required=true)}"></div>
                                        <div th:replace="~{fragments/inputs :: text(field='breadcrumbEn', label=#{label.menu.group.breadcrumb.en}, required=true)}"></div>
                                        <div>
                                            <label class="form-label" th:text="#{label.menu.group.description.en}">Description (EN)</label>
                                            <textarea th:field="*{descriptionEn}" class="form-control erp-input" rows="2"></textarea>
                                            <div class="invalid-feedback" th:if="${#fields.hasErrors('descriptionEn')}" th:errors="*{descriptionEn}"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Audit Info -->
                        <th:block th:if="${auditInfo != null and auditInfo.id != null}">
                             <div th:replace="~{fragments/audit-info :: audit-info(${auditInfo})}"></div>
                        </th:block>
                    </div>
                    <div class="card-footer text-end">
                        <div class="d-flex">
                            <a th:href="@{/security/menu-groups}" class="btn btn-link" th:text="#{label.cancel}">Cancel</a>
                            <button type="submit" class="btn btn-primary ms-auto">
                                <i class="ti ti-device-floppy me-1"></i>
                                <span th:text="#{label.save}">Simpan</span>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
