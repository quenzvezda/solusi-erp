<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/master :: head(${request.id == null ? #messages.msg('label.menu.group.add') : #messages.msg('label.menu.group.edit')})}"></head>
<body th:replace="~{layout/master :: layout(~{:: .pg-form-content})}">
    <div class="pg-form-content">
        <!-- Page Header -->
        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title" th:text="${request.id == null ? #messages.msg('label.menu.group.add') : #messages.msg('label.menu.group.edit')}">
                            Form Grup Menu
                        </h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Page Body -->
        <div class="page-body">
            <div class="container-xl">
                <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}">Error message</div>

                <form th:action="${request.id == null ? '/security/menu-groups/create' : '/security/menu-groups/edit/' + request.id}" 
                      th:object="${request}" method="post" class="card">
                    <input type="hidden" th:field="*{id}">
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label required" th:text="#{label.menu.group.code}">Code</label>
                                <input type="text" th:field="*{code}" class="form-control" 
                                       th:classappend="${#fields.hasErrors('code')} ? 'is-invalid'"
                                       placeholder="e.g. SEC-01" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
                            </div>
                            <div class="col-md-8">
                                <label class="form-label required" th:text="#{label.menu.group.url}">Target URL Path</label>
                                <input type="text" th:field="*{urlPath}" class="form-control" 
                                       th:classappend="${#fields.hasErrors('urlPath')} ? 'is-invalid'"
                                       placeholder="e.g. /security/users" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('urlPath')}" th:errors="*{urlPath}"></div>
                            </div>

                            <!-- Indonesian Section -->
                            <div class="col-md-6">
                                <div class="card bg-light border-0">
                                    <div class="card-body p-3">
                                        <h4 class="card-title mb-3"><span class="flag flag-country-id me-1"></span> Bahasa Indonesia</h4>
                                        <div class="mb-3">
                                            <label class="form-label required" th:text="#{label.menu.group.name.id}">Name (ID)</label>
                                            <input type="text" th:field="*{nameId}" class="form-control" 
                                                   th:classappend="${#fields.hasErrors('nameId')} ? 'is-invalid'" required>
                                            <div class="invalid-feedback" th:if="${#fields.hasErrors('nameId')}" th:errors="*{nameId}"></div>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label required" th:text="#{label.menu.group.breadcrumb.id}">Breadcrumb (ID)</label>
                                            <input type="text" th:field="*{breadcrumbId}" class="form-control" 
                                                   th:classappend="${#fields.hasErrors('breadcrumbId')} ? 'is-invalid'" required>
                                            <div class="invalid-feedback" th:if="${#fields.hasErrors('breadcrumbId')}" th:errors="*{breadcrumbId}"></div>
                                        </div>
                                        <div>
                                            <label class="form-label" th:text="#{label.menu.group.description.id}">Description (ID)</label>
                                            <textarea th:field="*{descriptionId}" class="form-control" rows="2"
                                                      th:classappend="${#fields.hasErrors('descriptionId')} ? 'is-invalid'"></textarea>
                                            <div class="invalid-feedback" th:if="${#fields.hasErrors('descriptionId')}" th:errors="*{descriptionId}"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- English Section -->
                            <div class="col-md-6">
                                <div class="card bg-light border-0">
                                    <div class="card-body p-3">
                                        <h4 class="card-title mb-3"><span class="flag flag-country-gb me-1"></span> English</h4>
                                        <div class="mb-3">
                                            <label class="form-label required" th:text="#{label.menu.group.name.en}">Name (EN)</label>
                                            <input type="text" th:field="*{nameEn}" class="form-control" 
                                                   th:classappend="${#fields.hasErrors('nameEn')} ? 'is-invalid'" required>
                                            <div class="invalid-feedback" th:if="${#fields.hasErrors('nameEn')}" th:errors="*{nameEn}"></div>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label required" th:text="#{label.menu.group.breadcrumb.en}">Breadcrumb (EN)</label>
                                            <input type="text" th:field="*{breadcrumbEn}" class="form-control" 
                                                   th:classappend="${#fields.hasErrors('breadcrumbEn')} ? 'is-invalid'" required>
                                            <div class="invalid-feedback" th:if="${#fields.hasErrors('breadcrumbEn')}" th:errors="*{breadcrumbEn}"></div>
                                        </div>
                                        <div>
                                            <label class="form-label" th:text="#{label.menu.group.description.en}">Description (EN)</label>
                                            <textarea th:field="*{descriptionEn}" class="form-control" rows="2"
                                                      th:classappend="${#fields.hasErrors('descriptionEn')} ? 'is-invalid'"></textarea>
                                            <div class="invalid-feedback" th:if="${#fields.hasErrors('descriptionEn')}" th:errors="*{descriptionEn}"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer text-end">
                        <div class="d-flex">
                            <a th:href="@{/security/menu-groups}" class="btn btn-link" th:text="#{label.cancel}">Cancel</a>
                            <button type="submit" class="btn btn-primary ms-auto" th:text="#{label.save}">Save Changes</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
