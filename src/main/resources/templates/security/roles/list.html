<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/master :: head(#{label.roles.title})}"></head>
<body th:replace="~{layout/master :: layout(~{:: .role-list-content}, ~{})}">
    <div class="role-list-content">
        <!-- Page Header -->
        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title" th:text="#{label.roles.title}">Manajemen Role</h2>
                        <div class="text-secondary mt-1" th:text="#{label.roles.subtitle}">Daftar role dan hak akses (permissions) dalam sistem.</div>
                    </div>
                    <!-- Page title actions -->
                    <div class="col-auto ms-auto d-print-none" sec:authorize="hasAuthority('ROLES_CREATE')">
                        <div class="btn-list">
                            <a th:href="@{/security/roles/create}" class="btn btn-primary d-none d-sm-inline-block">
                                <i class="ti ti-plus"></i>
                                <span th:text="#{label.roles.add}">Tambah Role Baru</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Page Body -->
        <div class="page-body">
            <div class="container-xl">
                <!-- Alerts -->
                <div th:if="${successMessage}" class="alert alert-success alert-dismissible" role="alert">
                    <div class="d-flex">
                        <div><i class="ti ti-check icon alert-icon"></i></div>
                        <div th:text="${successMessage}">Success!</div>
                    </div>
                    <a class="btn-close" data-bs-dismiss="alert" aria-label="close"></a>
                </div>
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible" role="alert">
                    <div class="d-flex">
                        <div><i class="ti ti-alert-circle icon alert-icon"></i></div>
                        <div th:text="${errorMessage}">Error!</div>
                    </div>
                    <a class="btn-close" data-bs-dismiss="alert" aria-label="close"></a>
                </div>

                <div class="card">
                    <div id="role-table-container" th:fragment="role-table-container"
                         hx-get="/security/roles"
                         hx-trigger="refresh-table from:body delay:500ms">
                        <div class="table-responsive">
                            <table class="table table-vcenter card-table">
                                <thead>
                                    <tr>
                                        <th th:text="#{label.roles.name}">Nama Role</th>
                                        <th th:text="#{label.roles.description}">Deskripsi</th>
                                        <th th:text="#{label.roles.permissions}">Permissions</th>
                                        <th class="w-1" th:text="#{label.actions}">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="role : ${roles}" th:id="'role-row-' + ${role.id}">
                                        <td class="fw-bold" th:text="${role.name}">ROLE_NAME</td>
                                        <td class="text-secondary" th:text="${role.description ?: '-'}">Description</td>
                                        <td>
                                            <div class="flex-wrap gap-1 d-flex">
                                                <span th:each="perm : ${role.permissions}" 
                                                      class="badge badge-outline text-blue" 
                                                      th:text="${perm.name}">PERM_NAME</span>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="btn-list flex-nowrap justify-content-end">
                                                <a th:href="@{/security/roles/edit/{id}(id=${role.id})}" 
                                                   class="btn btn-white btn-sm"
                                                   sec:authorize="hasAuthority('ROLES_UPDATE')">
                                                    <i class="ti ti-edit me-1"></i> <span th:text="#{label.edit}">Edit</span>
                                                </a>
                                                <button th:if="${role.name != 'ROLE_ADMIN'}" 
                                                        class="btn btn-white btn-sm text-danger"
                                                        data-bs-toggle="modal" 
                                                        th:data-bs-target="'#modal-delete-' + ${role.id}"
                                                        sec:authorize="hasAuthority('ROLES_DELETE')"
                                                        th:title="#{label.delete}">
                                                    <i class="ti ti-trash me-1"></i> <span th:text="#{label.delete}">Hapus</span>
                                                </button>
                                            </div>

                                            <!-- Delete Modal Fragment -->
                                            <th:block th:if="${role.name != 'ROLE_ADMIN'}">
                                                <div th:replace="~{fragments/modals :: delete-confirm(
                                                    id='modal-delete-' + ${role.id},
                                                    title=#{label.delete.confirm.title},
                                                    message=#{msg.delete.confirm.irreversible(${role.name})},
                                                    actionUrl='/security/roles/' + ${role.id},
                                                    targetId='#role-row-' + ${role.id}
                                                )}"></div>
                                            </th:block>
                                        </td>
                                    </tr>
                                <tr th:if="${#lists.isEmpty(roles)}">
                                    <td colspan="4" class="text-center text-secondary py-4" th:text="#{label.roles.empty}">Tidak ada data role.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
