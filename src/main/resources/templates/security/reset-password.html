<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <title th:text="#{reset.title} + ' - ' + #{app.name}">Ganti Password - Solusi ERP</title>
    <!-- Tabler Core CSS (CDN Latest) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css">
    <!-- Inter Font (CDN) -->
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    
    <style>
        :root {
            --tblr-font-sans-serif: 'Inter var', -apple-system, BlinkMacSystemFont, San Francisco, Segoe UI, Roboto, Helvetica Neue, sans-serif;
        }
    </style>
</head>
<body class="d-flex flex-column">
    <div class="page page-center">
        <div class="container container-tight py-4">
            <div class="card card-md">
                <div class="card-body">
                    <h2 class="h2 text-center mb-4" th:text="#{reset.heading}">Wajib Ganti Password</h2>
                    
                    <div class="text-center mb-4">
                        <img th:src="@{/img/logo.png}" width="150" alt="Logo" class="mx-auto">
                    </div>
                    <p class="text-secondary mb-4" th:text="#{reset.description}">Untuk alasan keamanan, Anda wajib mengganti password default Anda saat pertama kali login.</p>
                    
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                    <form th:action="@{/reset-password}" method="post" autocomplete="off">
                        <div class="mb-3">
                            <label class="form-label" th:text="#{label.reset.password.new}">Password Baru</label>
                            <input type="password" name="password" class="form-control" th:placeholder="#{placeholder.reset.password.new}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" th:text="#{label.reset.password.confirm}">Konfirmasi Password Baru</label>
                            <input type="password" name="confirmPassword" class="form-control" th:placeholder="#{placeholder.reset.password.confirm}" required>
                        </div>
                        <div class="form-footer">
                            <button type="submit" class="btn btn-primary w-100" th:text="#{reset.btn.save}">Simpan Password Baru</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <!-- Tabler Core JS (CDN Latest) -->
    <script src="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/js/tabler.min.js" defer></script>
</body>
</html>
