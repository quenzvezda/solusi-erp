name: agent-skill-workflow
version: 1.1
description: |
  Generic agentic skill for discover→plan→implement→test→fix→commit workflows.
  Supports relative paths, id-based suffix for notes/plan files, artifact storage, incremental test modes, and explicit human consent flow.
inputs:
  - repo_root: .
  - run_id: ''
  - plan_path_template: docs/PLAN-{run_id}.md
  - notes_path_template: docs/NOTES-{run_id}.md
  - allow_commit_docs: false
  - artifact_dir: docs/reports
  - test_scope: full
  - append_coauth_trailer: false
outputs:
  - commits: list of commit SHAs created
  - report_path: '{artifact_dir}/REPORT-{run_id}.md'
checkpoints:
  - discover
  - plan_generated
  - plan_approved
  - implement_iteration
  - all_tests_green
  - done
policy:
  - always_run_full_test: false
  - allow_incremental_tests: true
  - auto_fix_non_breaking: true
  - stop_on_breaking: true
  - no_push_without_explicit_user: true
  - require_human_consent_for_commits: true
  - consent_timeout_seconds: 172800
sub_agents:
  - discover
  - plan_generator
  - implementer
  - tester
  - fixer
  - committer
human_checkpoints:
  - plan_approved
  - approve_breaking_fix
notes: |
  Use templates in skills/templates and skills/prompts.
  - Filenames for Plan and Notes MUST follow templates using the same {run_id} suffix (e.g., NOTES-4538.md and PLAN-4538.md).
  - Paths should be relative; avoid hardcoded absolute repo paths.
  - append_coauth_trailer controls whether commits include the Co-authored-by trailer (default: false).
