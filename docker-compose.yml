version: '3.8'

services:
  # MariaDB Database
  # Note: Not used on current PC (mariadb-local already running on 3307)
  # Uncomment ports if needed. Or change DB_PORT in .env to use this.
  mariadb:
    image: mariadb:latest
    container_name: mariadb-erp
    ports:
      - "${DB_PORT}:3306"  # Set to 3308+ if mariadb-local using 3307
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - ./data/mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - erp-network
    profiles: ["with-db"]  # Only start if explicitly requested

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: minio-erp
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./data/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - erp-network

  # Kafka KRaft single-node for local messaging POC.
  # Start explicitly with: docker compose --profile messaging up -d
  kafka:
    image: bitnami/kafka:3.7
    container_name: kafka-erp
    profiles: ["messaging"]
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT},INTERNAL://kafka:29092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: ${KAFKA_AUTO_CREATE_TOPICS_ENABLE:-false}
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - ./data/kafka:/bitnami/kafka
    restart: unless-stopped
    networks:
      - erp-network

  # Optional local Kafka topic/browser UI.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui-erp
    profiles: ["messaging"]
    depends_on:
      - kafka
    ports:
      - "${KAFKA_UI_PORT}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-erp
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    restart: unless-stopped
    networks:
      - erp-network

networks:
  erp-network:
    driver: bridge
