name: CI - Java 21

on:
  push:
    branches: [ main, master, 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Nightly full run — setiap hari pukul 02:00 UTC (09:00 WIB)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      run_full:
        description: 'Jalankan full test suite termasuk integration-template?'
        required: false
        default: 'false'
        type: boolean

# Prevents multiple redundant jobs from running on the same branch simultaneously
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Fast — executed on every push / PR
  # Includes: unit tests, static template checks, domain/application usecases
  # Excludes: @Tag("integration-template") (Thymeleaf sec:authorize tests)
  # Target time: < 60 seconds
  # ──────────────────────────────────────────────────────────────────────────
  fast-tests:
    name: Fast Tests (unit + static)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Run fast tests (exclude integration-template tag)
        # Use ./mvnw to ensure the same Maven version as in local development
        run: ./mvnw -B -e test -DexcludedGroups=integration-template

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-test-reports
          path: target/surefire-reports/

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Full — executed on schedule (nightly), manual dispatch, or push to main/master
  # Includes: ALL tests including @Tag("integration-template")
  # Target time: < 3 minutes
  # ──────────────────────────────────────────────────────────────────────────
  full-tests:
    name: Full Tests (unit + integration-template)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_full == true) ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Run full test suite
        run: ./mvnw -B -e test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-test-reports
          path: target/surefire-reports/

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: Deploy — executed ONLY AFTER both test jobs pass on main branch
  # Depends on: fast-tests, full-tests
  # Skips paths: docs, conductor, markdown files, config files
  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    needs: [fast-tests, full-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Rename JAR
        run: mv target/solusi-program-erp-*.jar target/app.jar

      - name: Upload JAR ke VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "target/app.jar"
          target: "/home/ubuntu/app/"
          strip_components: 1
          overwrite: true

      - name: Restart service & capture log
        if: always()
        run: |
          mkdir -p logs
          LOG=logs/deploy-${{ github.run_number }}.txt

          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "sudo systemctl restart erp && sleep 10"

          echo "====== DEPLOY INFO ======" > $LOG
          echo "Run Number : ${{ github.run_number }}" >> $LOG
          echo "Commit     : ${{ github.sha }}" >> $LOG
          echo "Triggered  : ${{ github.actor }}" >> $LOG
          echo "Branch     : ${{ github.ref_name }}" >> $LOG
          echo "Timestamp  : $(date)" >> $LOG

          echo "" >> $LOG
          echo "====== SYSTEMCTL STATUS ======" >> $LOG
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "sudo systemctl status erp" >> $LOG

          echo "" >> $LOG
          echo "====== APP LOG (last 50 lines) ======" >> $LOG
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "sudo journalctl -u erp -n 50 --no-pager" >> $LOG

          echo "" >> $LOG
          echo "====== JAR INFO ======" >> $LOG
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "ls -lh /home/ubuntu/app/app.jar" >> $LOG

          rm /tmp/deploy_key

      - name: Upload log sebagai artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-log-${{ github.run_number }}
          path: logs/
          retention-days: 30

