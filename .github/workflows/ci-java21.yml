name: CI - Java 21

on:
  push:
    branches: [ main, master, 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Nightly full run — setiap hari pukul 02:00 UTC (09:00 WIB)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      run_full:
        description: 'Jalankan full test suite termasuk integration-template?'
        required: false
        default: 'false'
        type: boolean

# Prevents multiple redundant jobs from running on the same branch simultaneously
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Fast — executed on every push / PR
  # Includes: unit tests, static template checks, domain/application usecases
  # Excludes: @Tag("integration-template") (Thymeleaf sec:authorize tests)
  # Target time: < 60 seconds
  # ──────────────────────────────────────────────────────────────────────────
  fast-tests:
    name: Fast Tests (unit + static)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Run fast tests (exclude integration-template tag)
        # Use ./mvnw to ensure the same Maven version as in local development
        run: ./mvnw -B -e test -DexcludedGroups=integration-template

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-test-reports
          path: target/surefire-reports/

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Full — executed on schedule (nightly) or manual dispatch
  # Includes: ALL tests including @Tag("integration-template")
  # Target time: < 3 minutes
  # ──────────────────────────────────────────────────────────────────────────
  full-tests:
    name: Full Tests (unit + integration-template)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_full == true)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Run full test suite
        run: ./mvnw -B -e test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-test-reports
          path: target/surefire-reports/
