name: CI - Java 21

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/**/*.md'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/**/*.md'
  schedule:
    # Twice weekly full run — Sunday & Wednesday 19:30 UTC (Monday & Thursday 02:30 WIB)
    - cron: '30 19 * * 0,3'
  workflow_dispatch:
    inputs:
      run_full:
        description: 'Jalankan full test suite termasuk integration-template?'
        required: false
        default: 'false'
        type: boolean

# Prevents multiple redundant jobs from running on the same branch/PR simultaneously
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 0: Migration Parity — ensures H2 mirrors all MariaDB Flyway versions
  # Target time: < 5 seconds
  # ──────────────────────────────────────────────────────────────────────────
  migration-parity:
    name: Migration Parity Check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_full == false)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check MariaDB ↔ H2 migration parity
        run: bash scripts/check-migration-parity.sh

  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Fast — executed on PRs or manual non-full dispatch
  # Includes: unit tests, static template checks, domain/application usecases
  # Excludes: @Tag("integration-template") (Thymeleaf sec:authorize tests)
  # Target time: < 60 seconds
  # ──────────────────────────────────────────────────────────────────────────
  fast-tests:
    name: Fast Tests (unit + static)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_full == false)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Run fast tests (exclude integration-template tag)
        # Use ./mvnw to ensure the same Maven version as in local development
        run: ./mvnw -B -e test -DexcludedGroups=integration-template

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-test-reports
          path: target/surefire-reports/

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Full — executed on schedule (nightly), manual dispatch, or push to main/master
  # Includes: ALL tests including @Tag("integration-template")
  # Target time: < 3 minutes
  # ──────────────────────────────────────────────────────────────────────────
  full-tests:
    name: Full Tests (unit + integration-template)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_full == true) ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Run full test suite
        run: ./mvnw -B -e test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-test-reports
          path: target/surefire-reports/

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: Deploy — executed ONLY AFTER full test job passes on main branch
  # Uses the same Maven Wrapper as tests and verifies the Ubuntu VPS service
  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    needs: [full-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Build JAR
        run: ./mvnw -B -e clean package -DskipTests

      - name: Rename JAR
        run: mv target/solusi-program-erp-*.jar target/app.jar

      - name: Upload JAR ke VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "target/app.jar"
          target: "/home/ubuntu/app/"
          strip_components: 1
          overwrite: true

      - name: Restart service & capture log
        run: |
          mkdir -p logs
          LOG=logs/deploy-${{ github.run_number }}.txt
          DEPLOY_KEY=/tmp/deploy_key_${{ github.run_id }}
          trap 'rm -f "$DEPLOY_KEY"' EXIT

          printf '%s' "${{ secrets.SSH_PRIVATE_KEY }}" > "$DEPLOY_KEY"
          chmod 600 "$DEPLOY_KEY"

          {
            echo "====== DEPLOY INFO ======"
            echo "Run Number : ${{ github.run_number }}"
            echo "Commit     : ${{ github.sha }}"
            echo "Triggered  : ${{ github.actor }}"
            echo "Branch     : ${{ github.ref_name }}"
            echo "Timestamp  : $(date)"
            echo ""
            echo "====== SERVICE RESTART ======"
          } > "$LOG"

          set +e
          ssh -i "$DEPLOY_KEY" -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "sudo systemctl restart erp" >> "$LOG" 2>&1
          RESTART_STATUS=$?

          {
            echo ""
            echo "====== HEALTH CHECK ======"
          } >> "$LOG"
          ssh -i "$DEPLOY_KEY" -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "for i in {1..30}; do curl -fsS http://localhost:8080/login >/dev/null && exit 0; sleep 2; done; exit 1" >> "$LOG" 2>&1
          HEALTH_STATUS=$?

          {
            echo ""
            echo "====== SYSTEMCTL STATUS ======"
          } >> "$LOG"
          ssh -i "$DEPLOY_KEY" -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "sudo systemctl status erp --no-pager" >> "$LOG" 2>&1

          {
            echo ""
            echo "====== APP LOG (last 50 lines) ======"
          } >> "$LOG"
          ssh -i "$DEPLOY_KEY" -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "sudo journalctl -u erp -n 50 --no-pager" >> "$LOG" 2>&1

          {
            echo ""
            echo "====== JAR INFO ======"
          } >> "$LOG"
          ssh -i "$DEPLOY_KEY" -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "ls -lh /home/ubuntu/app/app.jar" >> "$LOG" 2>&1

          if [ "$RESTART_STATUS" -ne 0 ] || [ "$HEALTH_STATUS" -ne 0 ]; then
            exit 1
          fi

      - name: Upload log sebagai artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-log-${{ github.run_number }}
          path: logs/
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────────
  # Job 4: E2E — Playwright end-to-end tests against H2 in-memory
  # Runs after full-tests pass. Uses Spring Boot with e2e profile (H2).
  # Strategy:
  #   - push to main/master → smoke subset (@smoke tagged tests only)
  #   - schedule (twice weekly) → full E2E suite
  #   - manual dispatch (run_full=true) → full E2E suite
  # ──────────────────────────────────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [full-tests]
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_full == true) ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))

    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: e2e-tests/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e-tests/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Make scripts executable
        run: chmod +x mvnw e2e-tests/scripts/run-e2e.sh

      - name: Start MinIO for E2E
        run: |
          docker run -d --name minio-e2e \
            -p 9000:9000 \
            -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data --console-address ":9001"

          for i in {1..30}; do
            if curl -fsS http://localhost:9000/minio/health/live >/dev/null; then
              echo "MinIO ready after ${i}s"
              exit 0
            fi
            sleep 1
          done

          echo "MinIO failed to start"
          docker logs minio-e2e
          exit 1

      - name: Run Playwright E2E via shared runner
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Running smoke E2E subset (push-to-main)..."
            PLAYWRIGHT_ARGS="--grep @smoke" INSTALL_PLAYWRIGHT_DEPS=1 ./e2e-tests/scripts/run-e2e.sh
          else
            echo "Running full E2E suite (schedule/dispatch)..."
            INSTALL_PLAYWRIGHT_DEPS=1 ./e2e-tests/scripts/run-e2e.sh
          fi
        env:
          E2E_BASE_URL: http://localhost:18080

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e-tests/playwright-report/
            e2e-tests/test-results/
            target/e2e-server.log
            target/e2e-server-err.log
          retention-days: 7

