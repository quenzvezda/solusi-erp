name: Deploy ERP

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Rename JAR
        run: mv target/solusi-program-erp-*.jar target/app.jar

      - name: Upload JAR ke VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "target/app.jar"
          target: "/home/ubuntu/app/"
          strip_components: 1
          overwrite: true

      - name: Restart service & simpan log
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo systemctl restart erp
            sleep 10
            echo "====== SYSTEMCTL STATUS ======"
            sudo systemctl status erp
            echo ""
            echo "====== APP LOG (last 50 lines) ======"
            sudo journalctl -u erp -n 50 --no-pager
            echo ""
            echo "====== JAR INFO ======"
            ls -lh /home/ubuntu/app/app.jar

      - name: Simpan metadata deploy ke file
        if: always()
        run: |
          mkdir -p logs
          echo "Run Number : ${{ github.run_number }}" > logs/deploy-${{ github.run_number }}.txt
          echo "Commit     : ${{ github.sha }}" >> logs/deploy-${{ github.run_number }}.txt
          echo "Triggered  : ${{ github.actor }}" >> logs/deploy-${{ github.run_number }}.txt
          echo "Branch     : ${{ github.ref_name }}" >> logs/deploy-${{ github.run_number }}.txt
          echo "Timestamp  : $(date)" >> logs/deploy-${{ github.run_number }}.txt

      - name: Upload log sebagai artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-log-${{ github.run_number }}
          path: logs/
          retention-days: 30