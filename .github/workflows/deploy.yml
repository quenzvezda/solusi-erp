name: Deploy ERP

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Rename JAR
        run: mv target/solusi-program-erp-*.jar target/app.jar

      - name: Upload JAR ke VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "target/app.jar"
          target: "/home/ubuntu/app/"
          strip_components: 1
          overwrite: true

      - name: Restart service & capture log
        if: always()
        run: |
          mkdir -p logs

          # Setup SSH key
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          # Restart service
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "sudo systemctl restart erp && sleep 10"

          # Capture semua log ke file
          {
            echo "====== DEPLOY INFO ======"
            echo "Run Number : ${{ github.run_number }}"
            echo "Commit     : ${{ github.sha }}"
            echo "Triggered  : ${{ github.actor }}"
            echo "Branch     : ${{ github.ref_name }}"
            echo "Timestamp  : $(date)"
            echo ""
            echo "====== SYSTEMCTL STATUS ======"
            ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "sudo systemctl status erp"
            echo ""
            echo "====== APP LOG (last 50 lines) ======"
            ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "sudo journalctl -u erp -n 50 --no-pager"
            echo ""
            echo "====== JAR INFO ======"
            ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "ls -lh /home/ubuntu/app/app.jar"
          } > logs/deploy-${{ github.run_number }}.txt

          # Cleanup key
          rm /tmp/deploy_key

      - name: Upload log sebagai artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-log-${{ github.run_number }}
          path: logs/
          retention-days: 30